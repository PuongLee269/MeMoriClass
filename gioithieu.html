:root{color-scheme:dark;--bg:#0b1918;--gold:#f3cf8e;--cream:#fbefd5;
 --script:'Oooh Baby','Segoe Script','Bradley Hand',cursive;--sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);color:var(--cream);-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;contain:layout paint;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:radial-gradient(120% 90% at 50% 40%,#173a30 0%,#0b1918 62%,#06100e 100%)}
/* ---- màn hình tải ---- */
.loader{position:fixed;inset:0;z-index:2147483100;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#173a30 0%,#0b1918 60%,#06100e 100%);transition:opacity .9s ease,visibility .9s}
.loader.is-done{opacity:0;visibility:hidden;pointer-events:none}
.loader-inner{display:grid;justify-items:center;gap:14px;padding:0 24px;text-align:center}
.loader-logo{display:flex;flex-direction:column;align-items:center;font:400 clamp(44px,8vw,64px)/.8 var(--script);color:#f8ebcb;text-shadow:0 0 18px #ffd98a40}
.loader-logo small{margin-top:10px;font:400 10px/1 Georgia,serif;letter-spacing:.5em}
.loader-text{margin:4px 0 0;font:400 14px/1.4 var(--sans);color:#d9cfae}
.loader-track{width:min(220px,60vw);height:2px;border-radius:2px;background:#f4e7c41f;overflow:hidden}
.loader-track span{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(.04);background:linear-gradient(90deg,#d9c27a,#fff3c8);box-shadow:0 0 8px #ffd98a;transition:transform .4s ease}
.loader-flies{position:relative;width:160px;height:40px}
.loader-flies i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe8a4;box-shadow:0 0 10px 3px #ffd97d88;animation:loader-fly 3.2s ease-in-out infinite}
.loader-flies i:nth-child(1){left:10%;top:60%;animation-delay:-.4s}.loader-flies i:nth-child(2){left:32%;top:20%;animation-delay:-1.2s}
.loader-flies i:nth-child(3){left:52%;top:70%;animation-delay:-2s}.loader-flies i:nth-child(4){left:72%;top:30%;animation-delay:-.8s}.loader-flies i:nth-child(5){left:88%;top:65%;animation-delay:-2.6s}
@keyframes loader-fly{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(6px,-9px);opacity:1}}
/* ---- sân khấu ---- */
#fill{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
#fill img{position:absolute;left:0;top:0;transform-origin:0 0;filter:blur(26px) brightness(.8) saturate(1.05);opacity:0;transition:opacity .8s ease}
#stage{position:absolute;left:0;top:0;opacity:0;transition:opacity .9s ease}
.mk{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:var(--mask,none);mask-image:var(--mask,none);-webkit-mask-composite:source-in;mask-composite:intersect}
#app.go #stage{opacity:1}#app.go #fill img{opacity:1}
#stage img{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none;user-select:none}
.hide-fail{visibility:hidden}
#fxs,#flies{position:absolute;inset:0;pointer-events:none}
.fx{position:absolute;pointer-events:none}
.fx img{width:100%;height:100%;left:0;top:0}
/* chuyển động môi trường: chỉ transform/opacity (GPU) */
.sway{transform-origin:50% 100%;will-change:transform;animation:sway 6.5s ease-in-out infinite}
.sway.gust{animation:swayG 3.2s ease-in-out 1}
@keyframes sway{0%,100%{transform:rotate(-.25deg) translateX(0)}50%{transform:rotate(.3deg) translateX(.35%)}}
@keyframes swayG{0%{transform:rotate(0) translateX(0)}35%{transform:rotate(1.1deg) translateX(1.1%)}70%{transform:rotate(-.5deg) translateX(-.4%)}100%{transform:rotate(0) translateX(0)}}
.bob{will-change:transform;animation:bob 5.5s ease-in-out infinite;transform-origin:50% 100%}
.bobfly{will-change:transform,opacity;animation:bobfly 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg) translateY(-1%)}}
@keyframes bobfly{0%,100%{transform:translate(0,0) rotate(-1deg)}50%{transform:translate(1%,-4%) rotate(1.5deg)}}
.tail{will-change:opacity;animation:tail 4.8s ease-in-out infinite}
@keyframes tail{0%,100%{opacity:.55}50%{opacity:1}}
#flies i{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe8a4;box-shadow:0 0 8px 2px #ffd97d77;opacity:0;will-change:transform,opacity;animation:ff 7s ease-in-out infinite}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:0}25%{opacity:.7}50%{transform:translate(14px,-18px);opacity:.15}75%{opacity:.6}}
#app.still .sway,#app.still .bob,#app.still .bobfly,#app.still .tail,#app.still #flies i,#app.hid .sway,#app.hid .bob,#app.hid .bobfly,#app.hid .tail,#app.hid #flies i{animation-play-state:paused}
#app.still #flies,#app.still .sway.gust{animation:none}
/* ---- player ---- */
#slot{position:absolute;overflow:hidden;background:#05100e;box-shadow:none;border-radius:0;isolation:isolate;opacity:0;transform:scale(.97);transition:opacity .9s ease .15s,transform .9s cubic-bezier(.2,.7,.2,1) .15s}
#app.go #slot{opacity:1;transform:none}
#dk{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,6,12,.30) 0%,rgba(2,6,12,.34) 45%,rgba(2,6,12,.50) 100%)}
#capV{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(closest-side,rgba(2,6,12,.84) 0%,rgba(2,6,12,.72) 55%,rgba(2,6,12,.34) 82%,rgba(2,6,12,0) 100%);opacity:0;transition:opacity 1s ease .5s}
#app.go #capV{opacity:1}
#poster{position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:16%!important;text-align:center;padding:0 12%;background:radial-gradient(90% 120% at 50% 85%,#7a4a2a 0%,#2b2a35 45%,#0e1c1f 100%);transition:opacity .5s ease}
#poster b{display:block;font:400 clamp(28px,5.2vw,64px)/1 var(--script);color:var(--cream);text-shadow:0 2px 8px rgba(0,0,0,.6);margin-bottom:.15em}
#poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}#poster img.hide-fail{visibility:hidden}
#poster::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.0) 40%,rgba(8,4,2,.55))}
#poster span{font:400 clamp(12px,1.5vw,16px)/1.4 var(--sans);color:#e7d9b8;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#slot.started #poster{opacity:0;pointer-events:none}
#slot .emb{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#000;opacity:0;transition:opacity .45s ease;pointer-events:none}
#slot .emb.show{opacity:1}
#vclick{position:absolute;inset:0;z-index:2;cursor:pointer;background:transparent;border:0;padding:0}
#shade{position:absolute;left:0;right:0;bottom:0;height:min(150px,45%);z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(8,4,2,0),rgba(8,4,2,.6));transition:opacity .3s ease}
#bigplay{position:absolute;left:50%;top:50%;z-index:5;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:1.5px solid rgba(255,225,160,.8);background:rgba(20,12,6,.55);color:#ffe9b8;display:grid;place-items:center;cursor:pointer;padding:0;transition:opacity .3s ease,transform .2s ease,box-shadow .2s ease}
#bigplay svg{width:32px;height:32px;fill:currentColor;margin-left:4px}
#bigplay:hover,#bigplay:focus-visible{transform:scale(1.07);box-shadow:0 0 22px rgba(255,200,110,.5)}
#slot.started #bigplay,#slot.buffering #bigplay{opacity:0;pointer-events:none}
#slot.ended #bigplay{opacity:1;pointer-events:auto}
#spin{position:absolute;left:50%;top:50%;z-index:4;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid rgba(255,225,160,.25);border-top-color:#ffe3a0;opacity:0;pointer-events:none;animation:spin .9s linear infinite;animation-play-state:paused}
#slot.buffering:not(.started) #spin{opacity:1;animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
#unmute{position:absolute;z-index:6;left:10px;top:10px;min-height:44px;padding:0 16px 0 12px;display:none;align-items:center;gap:8px;border-radius:22px;border:1.5px solid rgba(255,225,160,.9);background:rgba(20,12,6,.72);color:#ffe9b8;font:500 15px/1 var(--sans);cursor:pointer;box-shadow:0 0 16px rgba(255,190,100,.35);transition:transform .2s ease,box-shadow .2s ease}
#unmute svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#unmute:hover,#unmute:focus-visible{transform:scale(1.04);box-shadow:0 0 24px rgba(255,200,110,.6)}
#slot.started.muted #unmute{display:inline-flex}#slot.ended #unmute{display:none!important}
#bar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:2px;padding:0 10px 8px;transition:opacity .3s ease}
#slot.idleui.started:not(.paused) #bar,#slot.idleui.started:not(.paused) #shade{opacity:0}
#slot.idleui.started:not(.paused) #bar{pointer-events:none}
.cb{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fbefd5;display:grid;place-items:center;cursor:pointer;padding:0;transition:color .2s ease,transform .2s ease}
.cb:hover,.cb:focus-visible{color:#ffd98a}.cb:focus-visible,#seek:focus-visible,#vol:focus-visible,#unmute:focus-visible,#bigplay:focus-visible,#back:focus-visible,#vclick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cb svg{width:24px;height:24px;fill:currentColor;stroke:currentColor;stroke-width:0}
.cb .st{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#time{flex:none;font:400 13px/1 var(--sans);color:#f2e6c8;min-width:84px;text-align:center;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.rng{position:relative;flex:1 1 auto;min-width:40px;height:44px;display:flex;align-items:center}
.rng .trk{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,240,205,.22);overflow:hidden;pointer-events:none}
.rng .trk i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#d9a85e,#ffe3a0)}
.rng input{position:relative;width:100%;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:none}
.rng input::-webkit-slider-runnable-track{height:44px;background:transparent}
.rng input::-moz-range-track{height:44px;background:transparent}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:15px;border-radius:50%;background:#ffe9b8;box-shadow:0 0 8px rgba(255,200,110,.7)}
.rng input::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#ffe9b8;box-shadow:0 0 8px rgba(255,200,110,.7)}
#volw{flex:none;width:84px}
#fb{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;display:none;flex-direction:column;align-items:center;gap:10px;text-align:center;font:400 14px/1.45 var(--sans);color:var(--cream);text-shadow:0 1px 6px #000,0 0 16px #000}
#fb.show{display:flex}#slot.failed #bigplay{opacity:0;pointer-events:none}#slot.failed #poster::after{background:rgba(0,0,0,.62)}#fb a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:22px;border:1.5px solid rgba(255,225,160,.9);background:rgba(20,12,6,.8);color:#ffe9b8;font:500 15px/1 var(--sans);text-decoration:none}#fb a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#next{position:absolute;z-index:8;left:50%;top:10px;transform:translateX(-50%);display:none;flex-direction:row;align-items:center;justify-content:center;gap:10px;width:max-content;max-width:calc(100% - 20px);padding:0;text-align:center;font:500 15px/1.3 var(--sans);color:var(--cream);text-shadow:0 1px 6px #000,0 0 18px #000}
#next.show{display:flex}#next button{min-height:44px;min-width:96px;padding:0 20px;border-radius:22px;border:1.5px solid rgba(255,225,160,.9);background:rgba(20,12,6,.72);color:#ffe9b8;font:500 15px/1 var(--sans);cursor:pointer}#next button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#exitv{position:fixed;inset:0;z-index:2147483200;background:#06100e;opacity:0;pointer-events:none;transition:opacity .6s ease}#exitv.on{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483300;padding:12px 18px;border-radius:22px;background:rgba(20,12,6,.85);color:var(--cream);font:500 15px/1.3 var(--sans);opacity:0;transition:opacity .3s;pointer-events:none}#toast.show{opacity:1}
#msg{position:absolute;z-index:7;left:50%;bottom:62px;transform:translateX(-50%);max-width:90%;padding:6px 10px;font:400 13px/1.4 var(--sans);color:var(--cream);text-align:center;text-shadow:0 1px 4px #000;opacity:0;pointer-events:none;transition:opacity .3s ease}
#msg.show{opacity:1}
#slot.compact #volw{display:none}#slot.compact #time{min-width:76px;font-size:12px}
/* toàn màn hình */
#slot:fullscreen,#slot.pfs{position:fixed!important;inset:0!important;left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;z-index:2147483000;transform:none}
#slot:-webkit-full-screen{width:100%!important;height:100%!important;border-radius:0}
/* chữ */
#cap{position:absolute;left:0;top:0;text-align:center;pointer-events:none;opacity:0;transition:opacity 1s ease .5s}
#app.go #cap{opacity:1}
#cap h1{margin:0;font:400 clamp(38px,4vw,46px)/1.2 var(--script);color:var(--cream);text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 22px rgba(255,200,120,.2)}
#cap p{margin:8px auto 0;max-width:640px;font:400 15px/1.55 var(--sans);color:#efe3c6;text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.6)}
#back{position:fixed;z-index:30;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));min-height:44px;display:flex;align-items:center;padding:0 6px;color:var(--cream);font:500 16px/1 var(--sans);text-decoration:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.6)}
#back:hover,#back:focus-visible{color:#fff;text-shadow:0 1px 3px #000,0 0 14px rgba(255,205,120,.85)}
@media (prefers-reduced-motion:reduce){.loader,.loader-track span,#stage,#slot,#cap{transition-duration:.01s!important}.loader-flies i,.sway,.bob,.bobfly,.tail,#flies i{animation:none!important}}
</style>

'use strict';
/* =================== CONFIG (thay nội dung tại đây) =================== */
const CONFIG={
 hosts:{youtube:'https://www.youtube-nocookie.com',list:['https://www.youtube-nocookie.com','https://www.youtube.com']},  /* thử lần lượt; nocookie hỏng thì thử www.youtube.com */
 loadTimeoutMs:8000,
 /* TẠM THỜI: video thử (ngang 16:9) từ playlist KMM FILM; thay bằng video giới thiệu thật (chỉ cần đổi id) */
