<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1918">
  <meta name="description" content="Một góc rừng đêm yên tĩnh để bắt đầu cuộc trò chuyện cùng Me.Mori.">
  <title>Mình là Bọ — Me.Mori Class</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --cream: #f4e7c4;
      --moss: #bdc78f;
      --gold: #ffd87f;
      --art-scale: 1;
      --cursor-x: -1000px;
      --cursor-y: -1000px;
      --aura-size: clamp(150px, 18vw, 250px);
      font-family: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: #0b1918; color: var(--cream); }
    button, input { font: inherit; }
    .scene {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background: #0b1918;
    }
    .artwork {
      position: absolute;
      z-index: -4;
      inset: -2.2%;
      width: 104.4%;
      height: 104.4%;
      object-fit: cover;
      object-position: center;
      transform: none;
    }
    .shade {
      position: absolute;
      z-index: -3;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, #07131130, transparent 62%), linear-gradient(0deg, #07131120, transparent 28%);
    }
    .brand-mark, .question-form, .quiet-links { position:absolute; z-index:2; }
    .brand-mark { left:2.7%; top:2.8%; width:12%; height:9%; pointer-events:none; }
    .brand-mark:not([data-compact="true"]) { transform:translateY(12px); }
    .brand-label { display:flex; flex-direction:column; align-items:flex-start; gap:0; font-family:"Caveat","Segoe Script",cursive; font-size:calc(42px * var(--art-scale)); font-weight:500; line-height:.78; color:#f8ebcb; white-space:nowrap; }
    .brand-label small { align-self:center; margin-left:22%; font:normal calc(9px * var(--art-scale))/1.4 Georgia,serif; letter-spacing:.45em; }
    .brand-mark[data-compact="true"] { left:10px!important; top:16px!important; right:auto!important; width:110px!important; height:42px!important; }
    .brand-mark[data-compact="true"] .brand-label { font-size:29px; line-height:.78; }
    .brand-mark[data-compact="true"] .brand-label small { font-size:7px; }
    .send:focus-visible, .quiet-links a:focus-visible {
      outline: 2px solid var(--cream); outline-offset: 4px;
    }

    /* The illustration is static; this visible native form replaces its painted prompt and underline. */
    .question-form { isolation:isolate; left:24.8%; top:54.4%; width:37.2%; height:6%; display:grid; grid-template-columns:minmax(0,1fr) 48px; align-items:center; padding:0 0 5px 8px; border:0; background:transparent; box-shadow:none; }
    .question-form::after { content:""; position:absolute; z-index:1; left:8px; right:48px; bottom:20px; height:1px; background:linear-gradient(90deg,#d9c89a,#e8d8b1 82%,transparent); box-shadow:0 0 5px #eadba770; transform:scaleX(.985); transform-origin:left; transition:box-shadow .25s ease,filter .25s ease; }
    .question-form:hover::after,.question-form:focus-within::after { box-shadow:0 0 8px #fff0bd,0 0 18px #ebca788c; filter:brightness(1.2); }
    .question-form input {
      width: 100%; min-width: 0; height: 100%; padding: 0 7px 0 0;
      position:relative; z-index:2; border: 0; outline: 0; color: #fff2d2; background: transparent;
      margin-top:calc(-10px * var(--art-scale)); font:calc(18px * var(--art-scale))/1.35 "Segoe UI",Arial,sans-serif; letter-spacing:normal; caret-color: var(--gold); text-shadow:0 1px 5px #0b1715;
    }
    .question-form input::placeholder { color:#e4ddc8d0; opacity:1; font:calc(19px * var(--art-scale)) Georgia,"Times New Roman",serif; letter-spacing:normal; transition:color .25s ease,text-shadow .25s ease; }
    .question-form:hover input::placeholder,.question-form:focus-within input::placeholder { color:#fff5db; text-shadow:0 0 8px #fff1c9,0 0 18px #f2cb776e; }
    .send { position:relative; z-index:2; display:grid; place-items:center; justify-self:end; width:42px; height:44px; padding:0; border:0; color:#f3d998; background:transparent; cursor:pointer; transition:transform .2s ease,color .2s ease,filter .2s ease; }
    .send svg { width:30px; height:30px; filter:drop-shadow(0 1px 3px #07120f); transition:filter .2s ease; }
    .send:hover { transform:translate(3px,-1px); color:#fff5d8; filter:drop-shadow(0 0 7px #ffe4a5); }
    .send:hover svg { filter:drop-shadow(0 0 8px #ffe4a5c9); }
    .send:active { transform:translate(2px,0) scale(.94); }
    .hero-copy { position:absolute; z-index:1; pointer-events:auto; display:block; color:#f5e8c5; font-family:"Caveat","Segoe Script",cursive; font-weight:500; font-style:normal; text-shadow:0 1px 5px #06110f,0 0 1px #fff3d1; cursor:default; }
    .copy-base { position:relative; z-index:1; display:block; white-space:nowrap; }
    .glow-word { white-space:pre; transition:color .1s ease,text-shadow .1s ease; }
    .glow-run { white-space:nowrap; }
    .hero-title { font-size:calc(70px * var(--art-scale)); line-height:.95; }
    .hero-question { font-size:calc(58px * var(--art-scale)); line-height:.98; }
    .cursor-aura { position:absolute; z-index:0; inset:0; pointer-events:none; opacity:0; mix-blend-mode:screen; background:radial-gradient(circle var(--aura-size) at var(--cursor-x) var(--cursor-y),#ffe5a525 0%,#ffe5a516 34%,#ffe5a509 66%,transparent 100%); transition:opacity .24s ease; }
    .scene.is-illuminated .cursor-aura { opacity:1; }
    .status {
      position: absolute; z-index: 3; left: 25.7%; top: 66.6%; margin: 0;
      max-width: none; color: #f1e6c3; font-size: clamp(11px,1vw,15px);
      text-shadow: 0 1px 8px #071311; opacity: 0; transform: translateY(4px);
      transition: opacity .25s ease, transform .25s ease; pointer-events: none;
    }
    .status.is-visible { opacity: 1; transform: translateY(0); pointer-events:auto; }
    .status a { display:inline-block; margin-left:7px; color:#f2d58e; text-underline-offset:3px; pointer-events:auto; }
    .fireflies { position: absolute; z-index: -1; inset: 0; overflow: hidden; pointer-events: none; }
    .firefly {
      position: absolute; left: var(--x); top: var(--y); width: var(--size,5px); aspect-ratio: 1;
      border-radius: 50%; background: #ffe8a4; opacity: .06;
      box-shadow: 0 0 8px 2px #ffda7d70, 0 0 20px 5px #ffe7a225;
      animation: glow var(--duration,6s) ease-in-out var(--delay,0s) infinite alternate,
                 wander var(--wander,11s) ease-in-out var(--delay,0s) infinite alternate;
    }
    .water-glimmer {
      position: absolute; z-index: -1; left: 16%; top: 76%; width: 48%; height: 14%;
      pointer-events: none; opacity: .42; overflow: hidden;
      clip-path: polygon(4% 26%, 76% 10%, 100% 50%, 82% 100%, 15% 82%, 0 56%);
      mask-image: linear-gradient(180deg, transparent, #000 27%, #000 67%, transparent);
    }
    .water-glimmer::before, .water-glimmer::after {
      content: ""; position: absolute; inset: 10% -12%;
      background: repeating-linear-gradient(180deg, transparent 0 9px, #e6d69a35 10px, #b3d9c22a 11px, transparent 13px 21px);
      filter: blur(1.1px); transform: translateX(-2%); animation: water 13s ease-in-out infinite alternate;
    }
    .water-glimmer::after { inset: 37% -8% 4%; opacity: .56; filter: blur(2px); animation-duration: 18s; animation-direction: alternate-reverse; }
    .wind-layer { position:absolute; z-index:1; inset:0; overflow:hidden; pointer-events:none; }
    .wind-leaf { position:absolute; left:-14vw; top:var(--start-y); width:clamp(34px,5vw,74px); aspect-ratio:120/70; opacity:0; filter:drop-shadow(0 2px 3px #07120f80); animation:wind-flight var(--flight-duration,7s) cubic-bezier(.38,.03,.63,.98) var(--flight-delay,0s) both; will-change:transform,opacity; }
    .wind-leaf svg { display:block; width:100%; height:100%; overflow:visible; }
    .beetle-head { position:absolute; z-index:2; overflow:visible; pointer-events:none; transform-origin:48% 91%; animation:head-wobble 6.8s ease-in-out infinite; }
    .beetle-head-svg { display:block; width:100%; height:100%; overflow:visible; }
    .beetle-blink .lid { fill:#cf7852; stroke:#8f4c34; stroke-width:1.5; transform-box:fill-box; transform-origin:center; transform:scaleY(0); animation:beetle-blink 6.3s ease-in-out infinite; }
    .beetle-blink .lid-right { animation-delay:.025s; }
    .beetle-blink .lid-line { fill:none; stroke:#76412f; stroke-width:1.6; stroke-linecap:round; transform-box:fill-box; transform-origin:center; transform:scaleY(0); animation:beetle-blink 6.3s ease-in-out infinite; }
    .beetle-blink .lid-line-right { animation-delay:.025s; }
    .beetle-head.is-hover-blinking .beetle-blink .lid,
    .beetle-head.is-hover-blinking .beetle-blink .lid-line { animation:beetle-blink-now .24s ease-in-out both; }
    .quiet-links { left:0; top:0; width:0; height:0; display:block; color:transparent; font-size:calc(18px * var(--art-scale)); }
    .quiet-links a { position:absolute; display:flex; align-items:center; padding-left:10px; color:#bdc492; text-decoration:none; border-radius:2px; white-space:nowrap; text-shadow:0 1px 4px #07120f; }
    .quiet-links a:focus-visible { color: var(--cream); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes glow { from { opacity: .08; } 45% { opacity: .72; } to { opacity: .16; } }
    @keyframes wander { from { translate: -3px 2px; } to { translate: 4px -5px; } }
    @keyframes water { from { transform: translate3d(-1.5%,0,0) scaleY(.94); opacity: .55; } to { transform: translate3d(1.5%,2px,0) scaleY(1.04); opacity: .96; } }
    @keyframes wind-flight { 0% { opacity:0; transform:translate3d(0,0,0) rotate(var(--start-rot,-25deg)) scale(var(--leaf-scale,.8)); } 9% { opacity:var(--leaf-opacity,.86); } 50% { opacity:var(--leaf-opacity,.86); transform:translate3d(58vw,var(--drift-y,5vh),0) rotate(calc(var(--start-rot,-25deg) + 185deg)) scale(var(--leaf-scale,.8)); } 92% { opacity:var(--leaf-opacity,.86); } 100% { opacity:0; transform:translate3d(128vw,var(--end-y,12vh),0) rotate(calc(var(--start-rot,-25deg) + 390deg)) scale(var(--leaf-scale,.8)); } }
    @keyframes beetle-blink { 0%,88%,100% { transform:scaleY(0); } 89.2%,91% { transform:scaleY(1); } 92.2% { transform:scaleY(0); } }
    @keyframes beetle-blink-now { 0%,100% { transform:scaleY(0); } 28%,68% { transform:scaleY(1); } }
    @keyframes head-wobble { 0%,100% { rotate:-1.1deg; } 50% { rotate:1.2deg; } }
    @media (max-width: 700px) {
      .scene { min-height: 100svh; }
      .artwork { inset: 0; width: 100%; height: 100%; object-position: 58% center; transform: scale(1.02); animation-duration: 55s; }
      .shade { background: linear-gradient(0deg,#07131140,transparent 35%); }
      .question-form { left: 13%; top: 54.4%; width: 51%; height: 7%; grid-template-columns: minmax(0,1fr) 40px; padding:3px 5px 3px 10px; }
      .question-form input { margin-top:0; font-size:14px; }
      .question-form input::placeholder { font-size:14px; }
      .send { width:34px; height:34px; }
      .status { left: 13.5%; top: 65.7%; max-width: 53%; font-size: 12px; }
      .quiet-links a { min-height: 28px; min-width: 32px; }
      .brand-mark { left: 2%; top: 2%; width: 18%; height: 8%; }
      .water-glimmer { left: 7%; top: 76%; width: 60%; height: 12%; }
    }
    @media (max-width: 430px) {
      .artwork { object-position: 60% center; }
      .question-form { left: 8%; width: 59%; }
      .status { left: 9%; max-width: 58%; }
    }
    @media (max-aspect-ratio: 4/3) {
      .hero-title { left:4%!important; top:30%!important; width:92%!important; height:auto!important; font-size:clamp(42px,7.75vw,62px); }
      .hero-question { left:10%!important; top:39%!important; width:90%!important; height:auto!important; font-size:clamp(32px,5.65vw,45px); }
    }
    @media (max-width: 700px) {
      .artwork { object-position:81% center!important; transform:none; }
      .hero-title { left:6%!important; top:31%!important; width:88%!important; height:auto!important; font-size:clamp(31px,8.2vw,42px)!important; line-height:1.06; }
      .hero-question { left:7%!important; top:38%!important; width:87%!important; height:auto!important; font-size:clamp(22px,5.9vw,30px)!important; line-height:1.18; white-space:normal; }
      .hero-question .copy-base { white-space:normal; }
      .question-form { left:7%!important; top:54%!important; width:31%!important; height:7%!important; grid-template-columns:minmax(0,1fr) 34px; }
      .quiet-links { left:7%!important; top:auto!important; bottom:18%!important; width:auto!important; height:auto!important; display:flex; gap:clamp(14px,5vw,28px); font-size:13px; }
      .quiet-links a { position:static!important; top:auto!important; left:auto!important; width:auto!important; height:auto!important; padding:0; min-height:28px; min-width:0; }
      .brand-mark { left:4%!important; top:2%!important; width:120px!important; height:48px!important; }
      .status { left:7%!important; top:63%!important; max-width:52%!important; }
      .question-form input::placeholder { font-size:12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .15s !important; }
      .artwork { transform: none; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Me.Mori Class — cuộc trò chuyện bên rừng">
    <img class="artwork" src="assets/me-mori-intro-clean.png" alt="Bọ cánh cứng nhỏ bên hồ trong khu rừng đêm, dưới ánh trăng." fetchpriority="high">
    <div class="shade" aria-hidden="true"></div>
    <div class="cursor-aura" aria-hidden="true"></div>
    <div class="wind-layer" aria-hidden="true"></div>
    <h1 class="hero-copy hero-title"><span class="copy-base">Mình là Bọ.</span></h1>
    <p class="hero-copy hero-question"><span class="copy-base">Bạn đang tò mò điều gì?</span></p>
    <div class="fireflies" aria-hidden="true">
      <i class="firefly" style="--x:19%;--y:34%;--size:4px;--duration:5.4s;--delay:-2s"></i>
      <i class="firefly" style="--x:24%;--y:62%;--size:5px;--duration:7s;--delay:-4s"></i>
      <i class="firefly" style="--x:48%;--y:76%;--size:3px;--duration:6.2s;--delay:-1s"></i>
      <i class="firefly" style="--x:72%;--y:54%;--size:4px;--duration:8s;--delay:-3s"></i>
      <i class="firefly" style="--x:88%;--y:38%;--size:5px;--duration:6.8s;--delay:-5s"></i>
      <i class="firefly" style="--x:81%;--y:77%;--size:3px;--duration:5.8s;--delay:-2.5s"></i>
    </div>
    <div class="water-glimmer" aria-hidden="true"></div>
    <div class="beetle-head" aria-hidden="true"><svg class="beetle-head-svg" viewBox="0 0 175 160" preserveAspectRatio="none"><defs><clipPath id="beetle-head-cutout" clipPathUnits="userSpaceOnUse"><ellipse cx="77" cy="111" rx="49" ry="41"/><path d="M59 77 C57 55 45 29 18 15" fill="none" stroke="white" stroke-width="4.2" stroke-linecap="round"/><circle cx="16" cy="14" r="4.8"/><path d="M103 83 C108 65 126 48 151 39" fill="none" stroke="white" stroke-width="4.2" stroke-linecap="round"/><circle cx="153" cy="39" r="4.8"/></clipPath></defs><image href="assets/me-mori-intro-clean.png" x="-1145" y="-460" width="1672" height="941" preserveAspectRatio="none" clip-path="url(#beetle-head-cutout)"/><g class="beetle-blink"><ellipse class="lid lid-left" cx="37" cy="99" rx="8" ry="10"/><path class="lid-line" d="M29 100 Q37 95 45 100"/><ellipse class="lid lid-right" cx="91" cy="110" rx="9" ry="10"/><path class="lid-line lid-line-right" d="M82 111 Q91 105 100 111"/></g></svg></div>

    <div class="brand-mark" aria-label="Me.Mori Class"><span class="brand-label"><span>Me.Mori</span><small>CLASS</small></span></div>
    <form class="question-form" aria-label="Hỏi Me.Mori" lang="vi">
      <label class="sr-only" for="question">Bạn đang tò mò điều gì?</label>
      <input id="question" name="question" type="text" lang="vi" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="true" placeholder="Hỏi Me.Mori…">
      <button class="send" type="submit" aria-label="Gửi câu hỏi"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.2 11.6 20.5 3.8l-5.3 16.4-3.5-6.4-8.5-2.2Zm8.5 2.2 5.2-5.1" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr-only">Gửi câu hỏi</span></button>
    </form>
    <p class="status" role="status" aria-live="polite"></p>
    <nav class="quiet-links" aria-label="Khám phá Me.Mori">
      <a href="index.html#courses">Lớp F2</a><a href="index.html#workshops">Tác phẩm</a><a href="index.html#contact">Đăng ký</a>
    </nav>
  </main>
  <script>
    (() => {
      const scene = document.querySelector('.scene');
      const artwork = document.querySelector('.artwork');
      const form = document.querySelector('.question-form');
      const field = document.querySelector('#question');
      const status = document.querySelector('.status');
      const windLayer = document.querySelector('.wind-layer');
      const beetleHead = document.querySelector('.beetle-head');
      const quietLinks = [...document.querySelectorAll('.quiet-links a')];
      const brand = document.querySelector('.brand-mark');
      const heroTitle = document.querySelector('.hero-title');
      const heroQuestion = document.querySelector('.hero-question');
      const glowTargets = [...document.querySelectorAll('.hero-copy .copy-base,.quiet-links a')];
      glowTargets.forEach(target => {
        const text = target.textContent;
        target.setAttribute('aria-label', text.trim());
        const tokens = text.split(/(\s+)/u);
        const pieces = tokens.map(token => {
          if (/^\s+$/u.test(token)) return document.createTextNode(token);
          const word = document.createElement('span');
          word.className = 'glow-word';
          word.textContent = token;
          return word;
        });
        if (target.matches('.quiet-links a')) {
          const run = document.createElement('span');
          run.className = 'glow-run';
          run.append(...pieces);
          target.replaceChildren(run);
        } else target.replaceChildren(...pieces);
      });
      const sharpCopy = [
        [heroTitle, 405, 250, 540, 80],
        [heroQuestion, 492, 310, 800, 82]
      ];

      // Map hotspots from the original artwork coordinates to the visible object-fit:cover image.
      // This keeps the actual controls aligned when the browser crops the artwork on narrow screens.
      const hotspots = [
        [brand, 52, 24, 205, 82],
        [document.querySelector('.beetle-head'), 1145, 460, 175, 160],
        [form, 418, 500, 625, 66],
        [status, 428, 637, 610, 44],
        [quietLinks[0], 420, 566, 112, 50],
        [quietLinks[1], 560, 566, 139, 50],
        [quietLinks[2], 716, 566, 122, 50]
      ];
      function placeHotspots() {
        if (!artwork.naturalWidth || !artwork.naturalHeight) return;
        const box = artwork.getBoundingClientRect();
        const scale = Math.max(box.width / artwork.naturalWidth, box.height / artwork.naturalHeight);
        const renderedWidth = artwork.naturalWidth * scale;
        const renderedHeight = artwork.naturalHeight * scale;
        const [objectX = '50%', objectY = '50%'] = getComputedStyle(artwork).objectPosition.split(' ');
        const positionX = Number.parseFloat(objectX) / 100 || .5;
        const positionY = Number.parseFloat(objectY) / 100 || .5;
        const imageLeft = box.left + (box.width - renderedWidth) * positionX - scene.getBoundingClientRect().left;
        const imageTop = box.top + (box.height - renderedHeight) * positionY - scene.getBoundingClientRect().top;
        scene.style.setProperty('--art-scale', String(scale));
        for (const [element, x, y, width, height] of sharpCopy) {
          element.style.left = `${imageLeft + x * scale}px`;
          element.style.top = `${imageTop + y * scale}px`;
          element.style.width = `${width * scale}px`;
          element.style.height = `${height * scale}px`;
        }
        for (const [element, x, y, width, height] of hotspots) {
          element.style.left = `${imageLeft + x * scale}px`;
          element.style.top = `${imageTop + y * scale}px`;
          element.style.width = `${width * scale}px`;
          element.style.height = `${height * scale}px`;
          element.style.right = 'auto';
        }
        const compact = innerWidth / innerHeight < artwork.naturalWidth / artwork.naturalHeight;
        brand.dataset.compact = String(compact);
      }
      if (artwork.complete) placeHotspots();
      artwork.addEventListener('load', placeHotspots, { once: true });
      new ResizeObserver(placeHotspots).observe(scene);
      window.addEventListener('resize', placeHotspots, { passive: true });

      // Hand-drawn, transparent leaf sketches travel across the scene in small wind gusts.
      const leafDrawings = [
        '<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg"><path d="M8 54C27 44 41 17 92 12c-8 36-37 51-84 42Z" fill="#9b9b54" stroke="#d0bd76" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 53 91 14M36 42l-4-17m18 8 1-16m-1 28 17 6m-4-20 19 5" fill="none" stroke="#ddca87" stroke-width="1.5" stroke-linecap="round"/><path d="M8 54q-5 5-7 10" fill="none" stroke="#c5a96a" stroke-width="2" stroke-linecap="round"/></svg>',
        '<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg"><path d="M7 48C22 17 55 8 105 18c-13 28-49 43-98 30Z" fill="#788752" stroke="#b9ba78" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 48 103 19M33 41l-5-16m22 10 4-17m0 29 18 5m-5-20 21 3" fill="none" stroke="#d4cc91" stroke-width="1.4" stroke-linecap="round"/><path d="M7 48 1 53" fill="none" stroke="#b49c61" stroke-width="2" stroke-linecap="round"/></svg>',
        '<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg"><path d="M10 56C22 24 52 9 97 10c-8 34-38 51-87 46Z" fill="#b0894d" stroke="#dec18a" stroke-width="2.3" stroke-linejoin="round"/><path d="M12 55 95 12M34 43l-1-17m20 8 5-17m-3 29 18 4m-2-21 19 1" fill="none" stroke="#f0d49a" stroke-width="1.5" stroke-linecap="round"/><path d="M10 56q-4 3-6 8" fill="none" stroke="#cfaa70" stroke-width="2" stroke-linecap="round"/></svg>'
      ];
      const random = (min, max) => min + Math.random() * (max - min);
      function spawnWindGust() {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const count = Math.floor(random(2, 4));
        for (let i = 0; i < count; i++) {
          const leaf = document.createElement('span');
          const startY = random(17, 78);
          const drift = random(-15, 15);
          leaf.className = 'wind-leaf';
          leaf.innerHTML = leafDrawings[Math.floor(Math.random() * leafDrawings.length)];
          leaf.style.setProperty('--start-y', `${startY}vh`);
          leaf.style.setProperty('--drift-y', `${drift}vh`);
          leaf.style.setProperty('--end-y', `${drift * 1.8}vh`);
          leaf.style.setProperty('--start-rot', `${random(-48, 48)}deg`);
          leaf.style.setProperty('--flight-duration', `${random(5, 10).toFixed(2)}s`);
          leaf.style.setProperty('--flight-delay', `${(i * random(.25, .7)).toFixed(2)}s`);
          leaf.style.setProperty('--leaf-scale', random(.62, 1.08).toFixed(2));
          leaf.style.setProperty('--leaf-opacity', random(.72, .94).toFixed(2));
          windLayer.append(leaf);
          leaf.addEventListener('animationend', () => leaf.remove(), { once: true });
        }
        window.setTimeout(spawnWindGust, random(10500, 16000));
      }
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) window.setTimeout(spawnWindGust, random(1200, 2600));

      let pointerOverBeetle = false;
      let hoverBlinkTimeout = 0;
      scene.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch' || !finePointer.matches) return;
        const rect = beetleHead.getBoundingClientRect();
        const overBeetle = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
        if (overBeetle && !pointerOverBeetle) {
          beetleHead.classList.add('is-hover-blinking');
          window.clearTimeout(hoverBlinkTimeout);
          hoverBlinkTimeout = window.setTimeout(() => beetleHead.classList.remove('is-hover-blinking'), 280);
        }
        pointerOverBeetle = overBeetle;
      }, { passive: true });
      scene.addEventListener('pointerleave', () => {
        pointerOverBeetle = false;
        beetleHead.classList.remove('is-hover-blinking');
        window.clearTimeout(hoverBlinkTimeout);
      });

      let pointerFrame = 0;
      const finePointer = matchMedia('(hover:hover) and (pointer:fine)');
      function clearGlow() {
        scene.classList.remove('is-illuminated');
        glowTargets.forEach(target => {
          target.classList.remove('is-hovered');
          target.querySelectorAll('.glow-word').forEach(word => { word.style.removeProperty('color'); word.style.removeProperty('text-shadow'); });
        });
      }
      scene.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch' || !finePointer.matches) return;
        cancelAnimationFrame(pointerFrame);
        pointerFrame = requestAnimationFrame(() => {
          const x = event.clientX;
          const y = event.clientY;
          const hovered = glowTargets.filter(target => {
            const rect = target.getBoundingClientRect();
            return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
          });
          glowTargets.forEach(target => target.classList.toggle('is-hovered', hovered.includes(target)));
          if (!hovered.length) { clearGlow(); return; }
          const bounds = scene.getBoundingClientRect();
          scene.style.setProperty('--cursor-x', `${x - bounds.left}px`);
          scene.style.setProperty('--cursor-y', `${y - bounds.top}px`);
          const radius = parseFloat(getComputedStyle(scene).getPropertyValue('--aura-size')) || 200;
          glowTargets.forEach(target => {
            target.querySelectorAll('.glow-word').forEach(word => {
              const box = word.getBoundingClientRect();
              const nearX = Math.max(box.left, Math.min(x, box.right));
              const nearY = Math.max(box.top, Math.min(y, box.bottom));
              const distance = Math.hypot(x - nearX, y - nearY);
              const falloff = Math.max(0, 1 - distance / radius);
              const strength = falloff * falloff;
              if (strength < .025) { word.style.removeProperty('color'); word.style.removeProperty('text-shadow'); return; }
              const mix = Math.round(245 + (255 - 245) * strength);
              const green = Math.round(232 + (248 - 232) * strength);
              const blue = Math.round(197 + (221 - 197) * strength);
              word.style.color = `rgb(${mix} ${green} ${blue})`;
              word.style.textShadow = `0 0 ${2 + 5 * strength}px rgba(255,244,215,${strength.toFixed(3)}), 0 0 ${5 + 14 * strength}px rgba(246,211,138,${(.68 * strength).toFixed(3)})`;
            });
          });
          scene.classList.add('is-illuminated');
        });
      }, { passive:true });
      scene.addEventListener('pointerleave', clearGlow);

      form.addEventListener('submit', event => {
        event.preventDefault();
        const question = field.value.trim();
        const normalized = question.toLocaleLowerCase('vi');
        let reply = 'Màn trò chuyện này chưa được kết nối với trợ lý Me.Mori. Bạn có thể xem thông tin lớp học và gửi câu hỏi qua trang chính.';
        let target = 'index.html#courses';
        let label = 'Xem thông tin lớp học';
        if (/đăng ký|dang ky|liên hệ|lien he/.test(normalized)) {
          reply = 'Bạn có thể xem cách đăng ký và gửi lời nhắn cho Me.Mori tại trang chính.';
          target = 'index.html#contact'; label = 'Đến mục đăng ký';
        } else if (/workshop|tác phẩm|tac pham|video|bài học|bai hoc/.test(normalized)) {
          reply = 'Trang chính có thông tin workshop, nội dung học và các tác phẩm của Me.Mori.';
          target = 'index.html#workshops'; label = 'Xem workshop';
        } else if (/lớp|lop|học|hoc|f2|khóa|khoa/.test(normalized)) {
          reply = 'Me.Mori Class kết hợp điện ảnh, storytelling và kỹ năng sản xuất nội dung. Mở trang lớp để xem thông tin hiện có.';
          target = 'index.html#courses'; label = 'Xem lớp học';
        }
        status.replaceChildren(document.createTextNode(question ? reply : 'Bạn hãy nhập câu hỏi vào khung rồi gửi nhé.'));
        if (question) {
          const link = document.createElement('a');
          link.href = target; link.textContent = label;
          status.append(' ', link);
        }
        status.classList.add('is-visible');
        if (!question) field.focus();
      });
      field.addEventListener('focus', () => status.classList.remove('is-visible'));
    })();
  </script>
</body>
</html>
