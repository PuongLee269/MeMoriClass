/* Bố cục: một sân khấu logic được scale theo màn hình; chữ và nút thật nằm ngoài sân khấu (px thật). Đá, bàn, đĩa nằm trong sân khấu. */
:root{
  --night:#07120f; --night2:#0e2a24; --cream:#f6ecd0; --ink:#3a2814; --ink2:#6a3f14;
  --amber:#ffd98a; --amber-soft:#ffd98a66;
  --glass:rgba(255,244,214,.12); --glass-line:rgba(255,244,214,.2);
  --disp:"Oooh Baby","Segoe Script",cursive; --body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font:400 16px/1.5 var(--body);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
#bg{position:fixed;inset:0;z-index:0;background:var(--night)}
#bg img{display:block;width:100%;height:100%;object-fit:cover;object-position:62% 50%}
#bgshade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#0000 45%,#02080a99 100%)}
#glints,#flies{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#glints{z-index:1}
#flies{z-index:4}
.glint{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff6d0 0,#ffe9a888 28%,#ffe9a800 70%);opacity:0;animation:glint 4.6s ease-in-out infinite}
@keyframes glint{0%,60%,100%{opacity:0;transform:scale(.5)}80%{opacity:.5;transform:scale(1)}}
.fly{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;background:radial-gradient(circle,#fff0b0 0,#ffd97dcc 22%,#ffd97d00 68%);opacity:0;animation:fly var(--d,9s) ease-in-out infinite var(--dl,0s)}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.7)}18%{opacity:.85}45%{opacity:.25}60%{opacity:.8}100%{opacity:0;transform:translate(var(--dx,20px),var(--dy,-30px)) scale(1)}}

#scene{position:fixed;left:0;top:0;z-index:2;transform-origin:0 0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#scene>*{position:absolute;pointer-events:none}
#scene img{display:block;user-select:none;-webkit-user-drag:none}
.layer img{width:100%;height:auto}
#lglow{border-radius:50%;background:radial-gradient(circle,#ffbd5acc 0,#ffa43c55 32%,#ffa43c00 68%);opacity:.5;animation:lglow 5.4s ease-in-out infinite;mix-blend-mode:screen}
@keyframes lglow{0%,100%{opacity:.42}50%{opacity:.72}}
#lantern{transform-origin:49% 1%;animation:sway 15s ease-in-out infinite}
#leaves{transform-origin:55% 45%;animation:rustle 15s ease-in-out infinite}
@keyframes sway{0%,22%,100%{transform:rotate(0)}30%{transform:rotate(1.1deg)}38%{transform:rotate(-1.4deg)}46%{transform:rotate(1deg)}54%{transform:rotate(-.6deg)}62%{transform:rotate(.25deg)}70%{transform:rotate(0)}}
@keyframes rustle{0%,24%,100%{transform:rotate(0) translate(0,0)}29%{transform:rotate(.35deg) translate(.8px,-.5px)}34%{transform:rotate(-.3deg) translate(-.7px,.5px)}40%{transform:rotate(.28deg) translate(.6px,-.4px)}46%{transform:rotate(-.2deg) translate(-.4px,.3px)}54%{transform:rotate(.1deg)}62%{transform:rotate(0)}}
.paused *{animation-play-state:paused!important}
#dishWrap img{position:absolute;left:0;top:0;width:100%;height:100%}
#table img{height:100%}
#dishBright{opacity:0;will-change:opacity}
#fx{pointer-events:none}
.pshadow{border-radius:50%;background:radial-gradient(ellipse,#000a 0,#0006 45%,#0000 72%)}

.cube{position:absolute!important;left:0;top:0;margin:0;padding:0;border:0;background:none;pointer-events:auto!important;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;will-change:transform;outline:none;border-radius:24%}
.cube.covered{cursor:default}
.cube.held{cursor:grabbing}
.cube .ci{position:absolute;inset:0;display:block;will-change:transform}
.cube img{position:absolute;left:50%;top:50%;width:109%;height:auto;transform:translate(-50%,-50%);transition:filter .35s ease;pointer-events:none}
.cube.covered img{filter:brightness(.66) saturate(.8)}
.cube .cs{position:absolute;left:8%;right:8%;bottom:-6%;height:24%;border-radius:50%;background:radial-gradient(ellipse,#000b 0,#0007 48%,#0000 74%);pointer-events:none;transform-origin:50% 50%}
.cube:focus-visible::after{content:"";position:absolute;inset:-6px;border-radius:30%;box-shadow:0 0 0 2px #fff0c2,0 0 16px 3px #ffd98acc;pointer-events:none}
@media (hover:hover){.cube:not(.covered):not(.held):hover img{filter:brightness(1.14)}}
#dishHit{position:absolute;border:0;background:none;border-radius:50%;padding:0;cursor:pointer;pointer-events:none!important}
#dishHit.on{pointer-events:auto!important}
#dishHit:focus-visible{outline:2px solid #fff0c2}
.ghost{opacity:0;will-change:transform,opacity}
.ghost img{display:block;width:100%;height:auto;opacity:.45}
#finger{width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle,#fff6d8cc 0,#ffe3a077 38%,#ffe3a000 72%);opacity:0}

/* chữ & nút thật (px thật) */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#ui>*{pointer-events:auto}
#head{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(560px,calc(100vw - 150px));text-align:center;pointer-events:none;transition:opacity .5s ease}
#head h1{margin:0;font:400 clamp(42px,5.2vw,64px)/1 var(--disp);color:#f8ebcb;text-shadow:0 2px 14px #000b,0 0 22px #ffd98a44}
#head p{margin:6px 0 0;font:400 16px/1.4 var(--body);color:#e9dfbd;text-shadow:0 1px 8px #000d,0 0 3px #000}
body.reading #head{opacity:0}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;color:var(--cream);text-decoration:none;font:400 15px/1 var(--body);border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pill:hover{background:rgba(255,244,214,.2)}
.pill:focus-visible,.pclose:focus-visible,.vbtn:focus-visible{outline:2px solid #fff0c2;outline-offset:2px}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#back{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}
#tools{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:10px}
#snd,.ibtn{width:44px;padding:0}
#hint{position:absolute;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 62px);transform:translate(-50%,6px);max-width:min(520px,calc(100vw - 32px));text-align:center;font:400 16px/1.4 var(--body);color:#f4e9c6;text-shadow:0 1px 8px #000,0 0 4px #000;opacity:0;transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none}
#hint.on{opacity:.9;transform:translate(-50%,0)}
#wrong{position:absolute;left:50%;top:calc(var(--wy,50%));transform:translate(-50%,8px);max-width:min(420px,calc(100vw - 32px));text-align:center;font:500 16px/1.4 var(--body);color:#ffe2b4;text-shadow:0 1px 8px #000,0 0 4px #000;opacity:0;transition:opacity .35s ease,transform .35s ease;pointer-events:none}
#wrong.on{opacity:1;transform:translate(-50%,0)}
#sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#ui>.panel{position:absolute;left:50%;top:70px;width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 90px);overflow:auto;overscroll-behavior:contain;color:var(--ink);padding:26px 34px 26px;border-radius:26px 14px 24px 16px / 16px 24px 14px 26px;
  background:radial-gradient(ellipse at 20% 12%,#fff4d2cc 0,#fff4d200 55%),radial-gradient(ellipse at 85% 90%,#d9bd8355 0,#d9bd8300 60%),linear-gradient(160deg,#f2e3bd,#e4cf9d 70%,#dcc48f);
  box-shadow:0 0 0 3px #f2e3bd22,0 0 46px 6px #ffcf7a55,0 22px 40px #000a;opacity:0;transform:translate(-50%,16px) scale(.94);pointer-events:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.3,1)}
#ui>.panel.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.panel h2{margin:0 36px 8px 0;font:400 clamp(34px,4vw,46px)/1.05 var(--disp);color:var(--ink2);outline:none}
.panel .ptext{margin:0;font:400 17px/1.62 var(--body);color:var(--ink)}
.panel .ptext span{display:inline-block}
.panel.anim .ptext span,.panel.anim h2{animation:wordin .7s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*26ms + 180ms)}
@keyframes wordin{from{opacity:0;filter:blur(6px);transform:translateY(7px)}to{opacity:1;filter:none;transform:none}}
.pclose{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:50%;border:0;background:#6a3f1422;color:var(--ink2);font:400 26px/1 var(--body);cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.pclose:hover{background:#6a3f1440}
.pimg{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin:0 0 12px;filter:sepia(.18)}
.pvid{margin-top:14px}
.vbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:99px;background:#6a3f14;color:#fff1cf;font:500 15px/1 var(--body);cursor:pointer}
.vbtn:hover{background:#7d4b19}
.vframe{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* loader (cùng họ với index.html) */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#173a30 0,#0b1918 60%,#06100e 100%);transition:opacity .9s ease,visibility .9s}
#loader.done{opacity:0;visibility:hidden}
.ld-in{display:grid;justify-items:center;gap:14px;padding:0 24px;text-align:center}
.ld-logo{display:flex;flex-direction:column;align-items:center;font:400 clamp(44px,8vw,64px)/.8 var(--disp);color:#f8ebcb;text-shadow:0 0 18px #ffd98a40}
.ld-logo small{margin-top:10px;font:400 10px/1 Georgia,serif;letter-spacing:.5em}
.ld-text{margin:4px 0 0;font:400 14px/1.4 var(--body);color:#d9cfae}
.ld-track{width:min(220px,60vw);height:2px;border-radius:2px;background:#f4e7c41f;overflow:hidden}
.ld-track span{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(.04);background:linear-gradient(90deg,#d9c27a,#fff3c8);box-shadow:0 0 8px #ffd98a;transition:transform .4s ease}
.ld-flies{position:relative;width:160px;height:40px}
.ld-flies i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe8a4;box-shadow:0 0 10px 3px #ffd97d88;animation:ldfly 3.2s ease-in-out infinite}
.ld-flies i:nth-child(1){left:10%;top:60%;animation-delay:-.4s}.ld-flies i:nth-child(2){left:32%;top:20%;animation-delay:-1.2s}.ld-flies i:nth-child(3){left:52%;top:70%;animation-delay:-2s}.ld-flies i:nth-child(4){left:72%;top:30%;animation-delay:-.8s}.ld-flies i:nth-child(5){left:88%;top:65%;animation-delay:-2.6s}
@keyframes ldfly{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(6px,-9px);opacity:1}}

@media (max-width:700px){
  #head{width:calc(100vw - 150px);top:calc(max(14px,env(safe-area-inset-top,0px)) + 66px)}
  @media (min-aspect-ratio:1/1){#head{top:max(14px,env(safe-area-inset-top,0px))}}
  #head h1{font-size:clamp(36px,10vw,46px)}
  #head p{font-size:14px;margin-top:4px}
  .panel{padding:22px 20px 20px}
  .panel .ptext{font-size:16.5px}
}
@media (max-height:520px) and (min-aspect-ratio:21/10){#head p{display:none}#head h1{font-size:40px}#tools{right:auto;left:calc(max(14px,env(safe-area-inset-left,0px)) + 54px)}.panel{padding:16px 20px 16px!important}.panel h2{font-size:32px!important;margin-bottom:4px!important}.panel .ptext{font-size:16px!important;line-height:1.5!important}.pvid{margin-top:8px!important}}
@media (prefers-reduced-motion:reduce){
  #lantern,#leaves,#lglow,.glint,.fly,.ld-flies i{animation:none!important}
  .fly{opacity:.35}
  .panel,.panel.show{transition:opacity .2s ease}
  .panel.anim .ptext span,.panel.anim h2{animation:none}
  #hint{transition:opacity .2s}
}

</style>
</head>

      if(!d||d>snapR()*.9){ /* mũi tên đầu tiên: đưa khối thẳng tới đĩa */
        flyTo(cu,L.dcx+(S.dish.length?(S.dish.length%2?1:-1)*L.dw*.1:0),L.dcy,{dur:.45,arc:60,lift:1,rot:0,done:function(){setGlowTarget()}});$('sr').textContent='Khối đá đã tới đĩa. Nhấn Enter để thả, Esc để hủy.';
      }else{cu.x+=dx*step;cu.y+=dy*step;render(cu)}
      S.kbDrag.moved=true;setGlowTarget();kick();return}
    if(k==='Enter'||k===' '){e.preventDefault();kbDrop(cu);return}
    if(k==='Escape'){e.preventDefault();kbCancel(cu);return}
    return;
  }
  if(k==='Enter'||k===' '){
    e.preventDefault();Snd.unlock();
    if(!canPick(cu)){$('sr').textContent='Khối đá này đang bị che. Hãy nhấc các khối phía trên trước.';return}
    interact();S.kb=true;S.lastFocus=cu.el;
    drag=null;var d={cu:cu,fromState:cu.state,fromDish:cu.state==='dish',moved:false,kbMoved:false};S.kbDrag=d;pickUp(cu);
    $('sr').textContent=label(cu)+' đã được nhấc. Dùng phím mũi tên để đưa tới đĩa, Enter để thả, Esc để hủy.';
  }else if(k==='Escape'&&S.panelOpen){closePanel(true)}
}
function kbDrop(cu){var d=S.kbDrag;if(!d.moved){kbCancel(cu);return}d.kbMoved=true;S.kb=false;S.held=null;cu.el.classList.remove('held');cu.tilt=0;dropAt(cu);setTimeout(function(){var t=cubes.filter(function(q){return !q.el.classList.contains('covered')&&q.state!=='flying'})[0];if(S.panelOpen){try{$('pTitle').focus({preventScroll:true})}catch(e){}}else if(cu.state==='pile'||cu.state==='free'||cu.state==='dish'){try{cu.el.focus({preventScroll:true})}catch(e){}}},900)}
function kbCancel(cu){var d=S.kbDrag;S.kb=false;S.held=null;cu.el.classList.remove('held');cu.tilt=0;
  if(d.fromDish){putInDish(cu,true)}else goHome(cu,true);setGlowTarget();$('sr').textContent='Đã hủy, khối đá về chỗ cũ.';setTimeout(function(){try{cu.el.focus({preventScroll:true})}catch(e){}},800)}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.panelOpen&&!S.held)closePanel(true)});
$('pclose').addEventListener('click',function(){closePanel(true)});

/* ---------------- gợi ý bằng bàn tay ma ---------------- */
var ghost={on:false,t0:0},idleTimer=0,hintTimer=0;
function hideHint(){$('hint').classList.remove('on');clearTimeout(idleTimer);clearTimeout(hintTimer)}
function armIdle(){
  clearTimeout(idleTimer);
  var G=C.ghostHint;if(!G.enabled&&!C.page.hint)return;
  idleTimer=setTimeout(function(){if(S.interacted||!S.ready)return;if(C.page.hint)$('hint').classList.add('on');if(!RM&&G.enabled)startGhost()},G.delay*1000);
}
function startGhost(){
  if(S.interacted)return;
  var top=cubes.filter(function(c){return !covered(c)&&c.state==='pile'})[0];if(!top)return;
  el.ghost.innerHTML='<img alt="" src="assets/method/cube-'+top.id+'.webp">';el.ghost.style.width=L.c*1.09+'px';
  ghost.cube=top;ghost.on=true;ghost.t0=performance.now();ghost.x0=top.x;ghost.y0=top.y;ghost.x1=L.dcx;ghost.y1=L.dcy;kick();
}
function stopGhost(){ghost.on=false;el.ghost.style.opacity=0;el.finger.style.opacity=0;clearTimeout(ghost.rep)}
function ghostStep(now){
  if(!ghost.on)return;var t=(now-ghost.t0)/1000,T=4.2;
  if(t>=T){el.ghost.style.opacity=0;el.finger.style.opacity=0;ghost.on=false;ghost.rep=setTimeout(function(){if(!S.interacted)startGhost()},4500);return}
  var a=clamp((t-.5)/2.0,0,1),e=easeInOut(a),x=lerp(ghost.x0,ghost.x1,e),y=lerp(ghost.y0,ghost.y1,e)-Math.sin(Math.PI*e)*70;
  var fade=t<.5?t/.5:t>3.4?Math.max(0,(T-t)/.8):1,lift=t>.35?1:0;
  var sz=L.c;
  el.ghost.style.left=(x-sz/2)+'px';el.ghost.style.top=(y-sz/2-lift*e*0)+'px';el.ghost.style.opacity=(.9*fade).toFixed(3);el.ghost.style.transform='translateY('+(-sz*.1*(a>0&&a<1?1:0))+'px)';
  el.finger.style.left=x+'px';el.finger.style.top=(y+sz*.12)+'px';el.finger.style.opacity=(.75*fade).toFixed(3);el.finger.style.transform='scale('+(a>0&&a<1?.82:1)+')';
}

/* ---------------- đặt lại ---------------- */
function resetAll(){
  S.held=null;drag=null;S.kb=false;S.dish=[];S.dishSym=null;S.busy=0;anims=[];
  cubes.forEach(function(cu,i){cu.state='pile';cu.anim=null;cu.lift=0;cu.tilt=0;cu.dslot=-1;cu.el.classList.remove('held');var sl=L.slots[cu.slot];flyTo(cu,sl.x,sl.y,{rot:sl.rot,delay:i*.03,dur:.5,done:function(){cu.state='pile';setZ(cu,zFor(cu));refreshAvail()}});cu.state='flying'});
  setTimeout(function(){cubes.forEach(function(cu){cu.state='pile'});refreshAvail();setGlowTarget()},900);
  closePanel(false);setGlowTarget();Snd.play('whoosh');
}
$('reset').addEventListener('click',function(){Snd.unlock();resetAll()});
$('snd').addEventListener('click',function(){Snd.unlock();setMute(!Snd.muted);if(!Snd.muted)Snd.play('pick')});

/* ---------------- nền: đom đóm, lấp lánh ---------------- */
function ambience(){
  var f=$('flies'),g=$('glints');f.innerHTML='';g.innerHTML='';
  var vw=innerWidth,vh=innerHeight,n=vw<700?9:14,i;
  for(i=0;i<n;i++){var e=document.createElement('i');e.className='fly';e.style.left=rnd(4,96)+'%';e.style.top=rnd(12,82)+'%';e.style.setProperty('--d',rnd(7,12).toFixed(1)+'s');e.style.setProperty('--dl',(-rnd(0,10)).toFixed(1)+'s');e.style.setProperty('--dx',rnd(-40,40).toFixed(0)+'px');e.style.setProperty('--dy',rnd(-50,10).toFixed(0)+'px');f.appendChild(e)}
  /* lấp lánh trên mặt nước / thác (toạ độ ảnh nền) */
  var pts=[[.905,.27],[.88,.33],[.74,.58],[.66,.66],[.93,.45],[.52,.7]],cover=Math.max(vw/1672,vh/941),px=vw<vh?.78:.62,ox=(vw-1672*cover)*px,oy=(vh-941*cover)*.5;
  pts.forEach(function(p,i){var x=p[0]*1672*cover+ox,y=p[1]*941*cover+oy;if(x<10||x>vw-10||y<10||y>vh-10)return;var e=document.createElement('i');e.className='glint';e.style.left=x+'px';e.style.top=y+'px';e.style.animationDuration=(3.6+i*.55)+'s';e.style.animationDelay=(-i*1.3)+'s';g.appendChild(e)});
  $('bgimg').style.objectPosition=(vw<vh?78:62)+'% 50%';
}

/* ---------------- khởi động + loader ---------------- */
function applyContent(){
  document.title=C.page.title;$('pageTitle').textContent=C.page.title;$('pageSub').textContent=C.page.subtitle;$('hint').textContent=C.page.hint;
  $('back').setAttribute('aria-label',C.page.backLabel);$('back').href=C.page.backHref;$('reset').setAttribute('aria-label',C.page.resetLabel);$('pclose').setAttribute('aria-label',C.page.closeLabel);$('ldText').textContent=C.page.loaderText;
  $('scene').setAttribute('aria-describedby','sr');$('scene').title='';
  $('hint').setAttribute('data-kb',C.page.keyboardHelp);
}
function relayout(){
  if(!S.ready)return;
  var wasMode=L&&L.land;
  var rels=cubes.map(function(c){return c.rel});
  L=layout();applyLayout();
  if(wasMode!==undefined&&wasMode!==L.land)cubes.forEach(function(cu){if(cu.state==='free'){cu.state='pile'}});
  if(S.held&&S.held.state==='held'){var h=S.held;S.held=null;h.el.classList.remove('held');goHome(h,true)}
  posAll();ambience();placeHint();if(S.panelOpen)placePanel();setGlowTarget();el.lastGlow=undefined;kick();
}
var rzT=0;addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(relayout,80)});
document.addEventListener('visibilitychange',function(){document.body.classList.toggle('paused',document.hidden);if(!document.hidden)kick()});

function loadAll(){
  var list=IMG_PATHS.map(function(n){return 'assets/method/'+n+'.webp'}).concat(IDS.map(function(i){return 'assets/method/cube-'+i+'.webp'}));
  var total=list.length+2,done=0,bar=$('ldBar'),cache={};
  function step(){done++;bar.style.transform='scaleX('+Math.max(.04,done/total)+')'}
  var ps=list.map(function(u){return new Promise(function(res){var im=new Image();im.onload=function(){(im.decode?im.decode():Promise.resolve()).catch(function(){}).then(function(){step();res()})};im.onerror=function(){step();res()};im.src=u})});
  ps.push(MemoriContent.prefetch('method').then(function(j){if(j===undefined)throw 0;C=normContent(j)}).catch(function(){}).then(step));
  /* site.json dùng chung: tắt/mở âm mặc định toàn trang + cổng nhạc nền (chưa có module phát) */
  ps.push(MemoriContent.load('site',MemoriContent.SITE_DEFAULT).then(function(S){SITE_SND=S.soundDefault!==false;var u=MemoriContent.url(S.backgroundMusicUrl,'');if(u&&window.MemoriAudio)window.MemoriAudio.setBackground(u)}).catch(function(){}));
  ps.push(Promise.race([(document.fonts&&document.fonts.load?document.fonts.load('40px "Oooh Baby"'):Promise.resolve()),new Promise(function(r){setTimeout(r,1500)})]).catch(function(){}).then(step));
  var kill=new Promise(function(r){setTimeout(r,9000)});
  return Promise.race([Promise.all(ps),kill]);
}
var SITE_SND=true;
function start(){
  /* âm thanh: mặc định theo nội dung, người dùng nhớ lựa chọn */
  var saved=null;try{saved=localStorage.getItem(MUTE_KEY)}catch(e){}
  Snd.vol=C.sound.volume;setMute(saved==='off'?true:saved==='on'?false:!(C.sound.enabled&&SITE_SND),false);
  applyContent();build();L=layout();applyLayout();posAll();ambience();placeHint();
  var ld=$('loader');ld.classList.add('done');setTimeout(function(){ld.remove()},1000);
  S.ready=true;armIdle();setGlowTarget();
  window.__method={S:S,cubes:function(){return cubes},layout:function(){return L},content:function(){return C},ghost:ghost};
}
['pointerdown','keydown'].forEach(function(t){addEventListener(t,function(){Snd.unlock()},{capture:true,passive:true})});
loadAll().then(start);
})();
</script>
