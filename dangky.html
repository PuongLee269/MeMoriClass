:root{color-scheme:dark;--ink:#ffe6b8;--ink-hi:#fff6dc;--gold:#ffd28a;--bg:#06100e;
 --hand:"Mali","Oooh Baby","Segoe Script",cursive;--script:"Oooh Baby","Segoe Script","Bradley Hand",cursive;--sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#root{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#under{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(14px) brightness(.55);opacity:.9}
#view{position:absolute;left:0;top:0;transform-origin:0 0;contain:layout style;opacity:0;transition:opacity .9s ease .1s}
body.ready #view{opacity:1}
#art,#ui{position:absolute;left:0;top:0;transform-origin:0 0}
#art img,#art .lay{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#art.lb #bg{-webkit-mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent),linear-gradient(to bottom,transparent,#000 40px,#000 calc(100% - 40px),transparent);-webkit-mask-composite:source-in;mask-composite:intersect;mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent),linear-gradient(to bottom,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.flies{animation:drift 17s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0);opacity:.78}to{transform:translate(5px,-4px);opacity:1}}
.glint{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,238,170,.95),rgba(255,214,110,.28) 38%,transparent 70%);animation:gl var(--d) ease-in-out var(--dl) infinite}
@keyframes gl{0%,100%{opacity:0;transform:scale(.7)}50%{opacity:.55;transform:scale(1)}}
@property --g{syntax:'<number>';inherits:true;initial-value:1}
#art{transition:--g 1.8s ease-in-out}#art.gust{--g:1.8}
.leaf{transform-origin:var(--ox) var(--oy);animation:leaf var(--p,3s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes leaf{from{transform:rotate(calc(var(--a) * var(--g) * -1deg)) skewX(calc(var(--k) * var(--g) * -1deg))}to{transform:rotate(calc(var(--a) * var(--g) * 1deg)) skewX(calc(var(--k) * var(--g) * 1deg))}}
.bug{animation:draw 5.4s ease-in-out infinite}
@keyframes draw{0%,52%,100%{transform:rotate(0) scaleY(1)}6%{transform:rotate(1.3deg) scaleY(1.004)}12%{transform:rotate(-.9deg)}18%{transform:rotate(1.5deg) scaleY(1.004)}24%{transform:rotate(-1deg)}30%{transform:rotate(1.2deg)}36%{transform:rotate(-.8deg) scaleY(1.004)}42%{transform:rotate(.9deg)}47%{transform:rotate(-.4deg)}}
#penline{width:130px;height:20px;transform-origin:0 50%;animation:ink 5.4s ease-in-out infinite;opacity:0}
#penline svg{display:block;overflow:visible}
@keyframes ink{0%{transform:scaleX(0);opacity:0}5%{opacity:.95}44%{transform:scaleX(1);opacity:.95}62%{transform:scaleX(1);opacity:0}100%{transform:scaleX(1);opacity:0}}
#pentip{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,160,.95),rgba(255,200,90,.3) 45%,transparent 70%);animation:tipg 2.7s ease-in-out infinite;opacity:0}
@keyframes tipg{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.75;transform:scale(1.1)}}
#imprint{opacity:0;transform:rotate(var(--ir,-9deg)) scale(1.07);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.8,.3,1)}
#imprint.on{opacity:.8;transform:rotate(var(--ir,-9deg)) scale(1)}
#glow{opacity:0;transition:opacity 1s ease}
#glow.on{opacity:1;animation:breathe 5s ease-in-out 1.2s infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.82}}
#ripple{border-radius:50%;border:2px solid rgba(255,226,160,.7);opacity:0;pointer-events:none}
#ripple.go{animation:rip .9s ease-out}
@keyframes rip{0%{opacity:.7;transform:scale(.7)}100%{opacity:0;transform:scale(1.45)}}
/* chữ là ảnh lớp của người dùng: hiện dần bằng nét mực quét + mờ vào */
#art img.txt{opacity:0}
body.go #art img.txt{animation:inkIn 1.5s cubic-bezier(.3,.6,.2,1) var(--d,0s) forwards}
@keyframes inkIn{0%{opacity:0;transform:translateY(8px);-webkit-mask-position:100% 0;mask-position:100% 0}60%{opacity:1}100%{opacity:1;transform:none;-webkit-mask-position:0 0;mask-position:0 0}}
#art img.txt{-webkit-mask-image:linear-gradient(100deg,#000 38%,transparent 62%);mask-image:linear-gradient(100deg,#000 38%,transparent 62%);-webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:100% 0;mask-position:100% 0}
body.go #art img.txt.done{-webkit-mask-image:none;mask-image:none}
/* UI */
#ui{pointer-events:none;contain:layout style}
#ui>*{position:absolute;pointer-events:auto}
.rv{opacity:0}
body.go .rv{animation:rvIn 1.4s cubic-bezier(.2,.7,.2,1) var(--d,0s) forwards}
@keyframes rvIn{0%{opacity:0;transform:translateY(10px) scale(.97)}100%{opacity:1;transform:none}}
#cnt{display:flex;align-items:baseline;justify-content:center;gap:.06em;margin:0;white-space:nowrap;font:italic 400 var(--cs,104px)/1 var(--hand);transform-origin:50% 50%;text-shadow:0 0 14px rgba(255,150,40,.85),0 0 4px rgba(255,200,90,.9);pointer-events:none}
#cnt .rem{color:#ff9a22;font-weight:400;text-shadow:0 0 10px rgba(255,120,20,.95),0 0 3px rgba(255,214,110,.95),0 0 1px #ffe9a8}
#cnt .sl,#cnt .cap{color:#fff0cf;font-weight:300;text-shadow:0 0 8px rgba(255,170,60,.8),0 0 2px rgba(255,235,190,.9)}
#cnt .cap{font-size:.8em}
#cnt .sl{display:inline-block;position:relative;width:.55em;height:1.05em;font-size:1em}
#cnt .sl::before{content:"";position:absolute;left:50%;top:2%;height:96%;width:.03em;min-width:2px;border-radius:2px;background:linear-gradient(#fff6dc,#ffd890);box-shadow:0 0 7px rgba(255,170,60,.85);transform:translateX(-50%) skewX(-24deg)}

.roll{display:inline-flex;height:1.05em;overflow:hidden;vertical-align:bottom;font-variant-numeric:tabular-nums}
.roll .col{display:block;height:1.05em;overflow:hidden}
.roll .strip{display:block;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.roll .strip span{display:block;height:1.05em;line-height:1.05em;text-align:center}
.cap2{margin:0;filter:drop-shadow(0 0 3px rgba(20,8,0,.9));text-align:left;color:var(--ink);font:500 var(--cf,24px)/1.35 var(--sans);text-shadow:0 1px 3px rgba(20,8,0,.6),0 0 12px rgba(255,170,60,.35);pointer-events:none}
.cap2 .hint{display:block;color:var(--gold);font:italic 400 1em/1.35 var(--hand)}
#zone{margin:0;padding:0;border:0;background:transparent;border-radius:50%;cursor:none;-webkit-appearance:none;appearance:none;color:inherit}
#zone::before{content:"";position:absolute;inset:12%;border-radius:50%;border:3px dashed rgba(255,226,160,.62);box-shadow:0 0 18px rgba(255,190,90,.22),inset 0 0 28px rgba(255,190,90,.14);transition:border-color .4s,box-shadow .4s;animation:zspin 70s linear infinite}
#zone::after{content:"";position:absolute;inset:9%;border-radius:50%;border:2px solid rgba(255,214,130,.5);opacity:.1;animation:zpulse 4.2s ease-in-out infinite;pointer-events:none}
@keyframes zspin{to{transform:rotate(360deg)}}
@keyframes zpulse{0%,100%{opacity:.08;transform:scale(.985)}50%{opacity:.5;transform:scale(1.03)}}
#zone .gh{position:absolute;display:block;opacity:.3;filter:brightness(2.2) saturate(1.2) drop-shadow(0 0 8px rgba(255,200,110,.6));mix-blend-mode:screen;transition:opacity .45s;pointer-events:none;animation:ghb 4.2s ease-in-out infinite}
@keyframes ghb{0%,100%{opacity:.2}50%{opacity:.38}}
#zone:hover::before,#zone:focus-visible::before,body.zone-hot #zone::before{border-color:rgba(255,240,196,.95);box-shadow:0 0 30px rgba(255,200,100,.6),inset 0 0 40px rgba(255,200,100,.28)}
body.zone-hot #zone .gh,#zone:focus-visible .gh{opacity:.7;animation:none}
#zone:focus-visible{outline:3px solid var(--ink-hi);outline-offset:-4px}
body.stamped #zone::before{animation:none;border-color:rgba(255,226,160,.18);box-shadow:none}
body.stamped #zone::after,body.stamped #zone .gh,body.stamped .zl{opacity:0!important;animation:none}
.zl{margin:0;white-space:nowrap;text-align:center;font:italic 400 var(--zf,24px)/1.25 var(--hand);color:#ffe8b4;pointer-events:none;text-shadow:0 1px 3px rgba(20,8,0,.9),0 0 12px rgba(255,170,60,.65);transition:opacity .35s}
body.zone-hot .zl{opacity:0!important}
#gs{position:absolute;opacity:0;pointer-events:none;transform-origin:55.8% 71.7%}
#gs img{display:block;width:100%;height:100%;filter:brightness(1.1) drop-shadow(0 0 14px rgba(255,200,110,.7))}
#gs.on{animation:gsn 4.6s ease-in-out 2 both}
@keyframes gsn{0%{opacity:0;transform:translate(-90px,-60px) rotate(-6deg)}22%{opacity:.6}50%{opacity:.6;transform:translate(0,-18px) rotate(-3deg)}62%{opacity:.62;transform:translate(0,6px) scale(.94)}74%{opacity:.5;transform:translate(0,-6px)}100%{opacity:0;transform:translate(0,-6px)}}
#stamp .cta{position:absolute;left:55.8%;top:100%;transform:translate(-50%,6px);margin:0;white-space:nowrap;padding:5px 14px;border-radius:20px;font:italic 400 17px/1.2 var(--hand);color:#2a1406;background:linear-gradient(#ffe6a8,#ffbf57);box-shadow:0 0 18px rgba(255,190,80,.75);opacity:0;transition:opacity .3s}
body.zone-hot #stamp .cta{opacity:1}
body.zone-hot #stamp img{transform:translateY(-14px) rotate(calc(var(--tilt,0deg) - 3deg))}
body:not(.stampcur) #zone{cursor:pointer}
#stamp{position:fixed;left:0;top:0;width:var(--ss,170px);height:var(--ss,170px);z-index:40;pointer-events:none;opacity:0;will-change:transform}
#stamp.glide{transition:transform .5s cubic-bezier(.3,.7,.2,1),opacity .3s}
#stamp.show{opacity:1}
#stamp img{transform:rotate(var(--tilt,0deg));transform-origin:55.8% 71.7%;display:block;width:100%;height:100%;filter:brightness(.8) saturate(.85) drop-shadow(0 10px 8px rgba(0,0,0,.45));transition:filter .4s,transform .45s cubic-bezier(.3,.7,.2,1);user-select:none;-webkit-user-drag:none}
#stamp.parked img{transform:translateY(-22px) rotate(-4deg)}
body.zone-hot #stamp img,#stamp.lit img{filter:brightness(1.05) saturate(1.1) drop-shadow(0 0 16px rgba(255,190,90,.7)) drop-shadow(0 10px 8px rgba(0,0,0,.4))}
body.stampcur,body.stampcur *{cursor:none!important}
body.stampcur #back{cursor:pointer!important}
.sp{position:absolute!important;pointer-events:none!important;width:34px;height:34px;margin:-17px 0 0 -17px;opacity:0;background:radial-gradient(circle,#fff8e0 0 14%,rgba(255,214,120,.55) 34%,transparent 68%)}
.sp::before,.sp::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:2px;margin:-1px 0 0 -23px;background:linear-gradient(90deg,transparent,#fff3c8,transparent)}
.sp::after{transform:rotate(90deg)}
body.go .sp{animation:spk 1.4s ease-out var(--d) both}
@keyframes spk{0%{opacity:0;transform:scale(0) rotate(0)}35%{opacity:1;transform:scale(1) rotate(40deg)}100%{opacity:0;transform:scale(.3) rotate(110deg)}}
.mdl{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(4,10,8,.72);opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s;overflow:auto}
.mdl.open{opacity:1;visibility:visible}
.mcard{position:relative;width:min(520px,100%);max-height:100%;overflow:auto;padding:34px 32px 30px;border-radius:6px 14px 8px 12px;color:var(--ink);background:linear-gradient(rgba(34,18,8,.58),rgba(34,18,8,.7)),var(--paperbg) center/cover,#5b3a20;box-shadow:0 0 0 1px rgba(255,210,140,.28),0 18px 60px rgba(0,0,0,.65),0 0 40px rgba(255,170,60,.18) inset;transform:translateY(14px) scale(.98);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.mdl.open .mcard{transform:none}
.mdl{--ft:var(--script);--fts:54px;--fl:var(--hand);--fls:17px}
.mdl.pB{--ft:var(--hand);--fts:40px;--fl:var(--hand);--fls:17px}
.mdl.pC{--ft:var(--script);--fts:54px;--fl:var(--sans);--fls:14px}
.mcard h2{margin:0 0 6px;font:400 var(--fts)/1.1 var(--ft);color:var(--ink-hi);text-shadow:0 0 18px rgba(255,170,60,.5),0 2px 3px rgba(20,8,0,.6)}
.mcard .lead{margin:0 0 20px;font:italic 400 16px/1.5 var(--hand);color:var(--ink)}
.mx{position:absolute;right:10px;top:10px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);font:400 26px/1 var(--sans);cursor:pointer}
.mx:hover,.mx:focus-visible{background:rgba(255,210,140,.16);color:#fff}
.mx:focus-visible,.mcard button:focus-visible,.mcard input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.mf{display:grid;gap:16px}
.mf label{display:block;margin:0 0 4px;font:italic 400 var(--fls)/1.3 var(--fl);letter-spacing:.02em;color:var(--gold)}
.mf input{width:100%;font:400 17px/1.45 var(--sans);letter-spacing:.01em;color:var(--ink-hi);background:rgba(20,8,0,.28);border:0;border-bottom:2px solid rgba(255,214,150,.55);border-radius:4px 4px 0 0;padding:9px 10px;caret-color:var(--gold)}
.mf input::placeholder{color:rgba(255,230,184,.62)}
.mf input[aria-invalid=true]{border-bottom-color:#ff9c7a}
.mf .err{display:block;min-height:0;margin-top:4px;font:400 14px/1.4 var(--sans);color:#ffc2a8}
.mf .go{margin-top:6px;min-height:50px;border:0;border-radius:26px;padding:0 24px;cursor:pointer;font:500 17px/1 var(--sans);color:#2a1406;background:linear-gradient(#ffe2a0,#ffb94d);box-shadow:0 0 22px rgba(255,180,70,.5),0 2px 0 rgba(255,255,255,.4) inset}
.mf .go[disabled]{opacity:.7;cursor:wait}
.mf .gerr{margin:0;min-height:0;font:400 14px/1.4 var(--sans);color:#ffb59a}
.thx{display:none;text-align:center;padding:10px 0 4px}
.mdl.sent .thx{display:block}.mdl.sent .mf,.mdl.sent .lead{display:none}.mdl.sent h2{display:none}
.thx h2{display:block!important;margin-bottom:10px}
.thx p{margin:0 0 20px;font:italic 400 17px/1.55 var(--hand);color:var(--ink)}
.thx button{min-height:46px;border:1px solid rgba(255,214,150,.6);border-radius:24px;padding:0 26px;background:transparent;color:var(--ink-hi);font:500 16px/1 var(--sans);cursor:pointer}

 M.sparks.forEach((p,i)=>{const s=document.createElement('i');s.className='sp';s.style.left=p[0]+'px';s.style.top=p[1]+'px';s.style.setProperty('--d',(.5+i*.3).toFixed(2)+'s');ui.appendChild(s)});
 if(stamped){glow.classList.add('on');if(imp)imp.classList.add('on')}
 if(!(zone.matches(':hover')))document.body.classList.remove('zone-hot');
 if(sent)$('#hint').textContent=CONFIG.hintDone
 if(CAP)setEnrolled(EN,CAP);
}
/* ===== số đếm (chữ thật, lăn từng chữ số) ===== */
function roll(host,n){
 const w=Math.max(2,String(n).length);const s=String(n).padStart(w,'0');
 while(host.children.length<s.length){const col=document.createElement('span');col.className='col';const strip=document.createElement('span');strip.className='strip';strip.innerHTML=[...'0123456789'].map(d=>'<span>'+d+'</span>').join('');col.appendChild(strip);host.insertBefore(col,host.firstChild)}
 [...host.children].forEach((c,i)=>{c.firstChild.style.transform='translateY(-'+(+s.padStart(host.children.length,'0')[i]*1.05)+'em)'});
}
function setEnrolled(n,capacity){
 if(capacity!=null)CAP=Math.max(1,Math.floor(+capacity||CAP||1));
 n=Math.min(Math.max(0,Math.floor(+n||0)),CAP);EN=n;
 const rem=CAP-n;
 if($('#rRem')){roll($('#rRem'),rem);roll($('#rCap'),CAP);
  $('#enr').innerHTML=CONFIG.enrolledLabel+': <b>'+n+' / '+CAP+'</b> '+CONFIG.seatWord+(rem<=0?' · '+CONFIG.fullLabel:'')+'<br>'}
 $('#live').textContent=CONFIG.enrolledLabel+': '+n+' / '+CAP+' '+CONFIG.seatWord;
}
/* ===== API cho ứng dụng đăng ký sau này ===== */
window.MemoriRegister={
 setEnrolled,
 getState:()=>({enrolled:EN,capacity:CAP,remaining:CAP-EN}),
 /* TODO(ứng dụng đăng ký): thay bằng lời gọi thật. Hiện CHỈ là giả lập, không gửi gì đi đâu. */
 submitRegistration(data){console.info('[DEMO] submitRegistration (chưa nối ứng dụng đăng ký)',data);return Promise.resolve({ok:true,demo:true})}
};
function submitRegistration(data){return window.MemoriRegister.submitRegistration(Object.assign({intent:'register-f2',enrolled:EN,capacity:CAP},data||{}))}

/* ===== bố cục ===== */
let SS=170,zc=[0,0];
function layout(){
 const w=VW(),h=VH(),want=(w/h<.9)?'port':'land';
 if(want!==mode){build(want);for(const e of imgs)if(!e.complete)e.decode&&e.decode().catch(()=>{})}
 K=mode==='port'?Math.min(h/M.H,w*.97/M.W):Math.min(w/M.W,h/M.H);
 TX=(w-M.W*K)/2;TY=(h-M.H*K)/2;
 view.style.transform='translate('+TX+'px,'+TY+'px) scale('+K+')';
 art.classList.toggle('lb',Math.abs(TX)>2||Math.abs(TY)>2);
 SS=mode==='port'?Math.round(Math.min(150,Math.max(92,w*.27))):Math.round(Math.min(190,Math.max(84,Math.min(w,h)*.24)));stamp.style.setProperty('--ss',SS+'px');
 zc=[TX+M.seal[0]*K,TY+M.seal[1]*K];place();
}
/* ===== con trỏ = con dấu ===== */
const HX=.558,HY=.717;
const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
let mouse=null,parked=true,busy=false,overInput=false,ready=false,stamped=false;
if(fine)document.body.classList.add('stampcur');
stampImg.src='assets/register/stamp.webp';stampImg.addEventListener('error',()=>{stampImg.style.visibility='hidden'});
let cur=null,tilt=0,rafS=0,mopen=false;
function apply(x,y){stamp.style.transform='translate3d('+(x-HX*SS).toFixed(1)+'px,'+(y-HY*SS).toFixed(1)+'px,0)'}
function place(glide){
 stamp.classList.toggle('glide',!!glide);
 let x,y;if(parked||!mouse){x=zc[0];y=zc[1]}else{x=mouse[0];y=mouse[1]}
 cur=[x,y];tilt=0;stampImg.style.setProperty('--tilt','0deg');apply(x,y);
 stamp.classList.toggle('parked',parked&&!busy);
 stamp.classList.toggle('show',ready&&fine&&!mopen);
}
function follow(){ // con dấu bám theo chuột, trễ nhẹ và nghiêng theo hướng di chuyển
 rafS=0;if(!mouse||parked||busy||!fine)return;
 const dx=mouse[0]-cur[0],dy=mouse[1]-cur[1];
 cur[0]+=dx*.34;cur[1]+=dy*.34;
 const tt=RM?0:Math.max(-10,Math.min(10,dx*.45));tilt+=(tt-tilt)*.3;
 stampImg.style.setProperty('--tilt',tilt.toFixed(2)+'deg');apply(cur[0],cur[1]);
 if(Math.hypot(dx,dy)>.4||Math.abs(tilt-tt)>.15)rafS=requestAnimationFrame(follow);
}
addEventListener('pointermove',e=>{
 if(e.pointerType==='touch')return;
 mouse=[e.clientX,e.clientY];overInput=!!(e.target.closest&&e.target.closest('a'));
 if(!fine||busy)return;
 if(overInput){stamp.classList.remove('show');return}
 if(parked){parked=false;stamp.classList.remove('parked');cur=mouse.slice();stamp.classList.remove('glide');stamp.classList.toggle('show',ready&&!mopen)}
 if(!rafS)rafS=requestAnimationFrame(follow);
},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>{if(fine&&!busy){parked=true;place(true)}});
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,150));
if(window.ResizeObserver)new ResizeObserver(()=>layout()).observe(rootEl);if(window.visualViewport)visualViewport.addEventListener('resize',layout);
/* ===== gợi ý lần đầu: con dấu mờ nhích về vùng đóng dấu sau ~3 giây không thao tác ===== */
let idleT=0,hinted=0;
function hideGs(){const g=$('#gs');if(g)g.classList.remove('on');clearTimeout(idleT)}
function armIdle(){clearTimeout(idleT);if(stamped||hinted>=2||RM)return;
 idleT=setTimeout(()=>{if(stamped||busy||mopen||document.hidden)return;
  if(fine&&mouse&&!parked&&Math.hypot(mouse[0]-zc[0],mouse[1]-zc[1])<M.zone*K*.8)return;
  const g=$('#gs');if(g){hinted++;g.classList.remove('on');void g.offsetWidth;g.classList.add('on')}},hinted?9000:3200)}
addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const g=$('#gs');
 if(mouse&&g&&g.classList.contains('on')&&Math.hypot(mouse[0]-zc[0],mouse[1]-zc[1])<M.zone*K*.9)g.classList.remove('on');armIdle()},{passive:true});
/* ===== đóng dấu ===== */
async function doStamp(){
 if(busy)return;busy=true;
 const wasParked=parked||!mouse||!fine;
 if(wasParked){parked=true;stamp.classList.remove('parked');place(true);await wait(RM?0:(fine?520:140))}
 else{stamp.classList.add('glide');stamp.style.transform='translate3d('+(zc[0]-HX*SS)+'px,'+(zc[1]-HY*SS)+'px,0)';await wait(RM?0:260)}
 if(!RM)stampImg.animate([{translate:'0 0',scale:'1'},{translate:'0 '+(SS*.09)+'px',scale:'.93',offset:.3},{translate:'0 '+(SS*.09)+'px',scale:'.93',offset:.52},{translate:'0 -'+(SS*.03)+'px',scale:'1.01',offset:.8},{translate:'0 0',scale:'1'}],{duration:1000,easing:'ease'});
 await wait(RM?0:230);
 if(imp)imp.classList.add('on');
 const rp=$('#ripple');rp.classList.remove('go');void rp.offsetWidth;rp.classList.add('go');
 await wait(RM?0:200);
 glow.classList.add('on');stamp.classList.add('lit');
 stamped=true;document.body.classList.add('stamped');hideGs();
 await wait(RM?0:620);
 stamp.classList.remove('lit');busy=false;
 openModal();
}
function stampBack(){if(fine&&mouse){parked=false;place(true);setTimeout(()=>place(false),520)}else{parked=true;place(true)}}
/* ===== form đăng ký riêng (mở sau khi đóng dấu) ===== */
const FM=CONFIG.form;
const mdl=document.createElement('div');mdl.className='mdl';mdl.setAttribute('role','dialog');mdl.setAttribute('aria-modal','true');mdl.setAttribute('aria-labelledby','mTitle');mdl.setAttribute('aria-hidden','true');
mdl.innerHTML='<div class="mcard"><button type="button" class="mx" aria-label="'+FM.close+'">×</button><h2 id="mTitle">'+FM.title+'</h2><p class="lead">'+FM.lead+'</p><form class="mf" novalidate>'+
 FM.fields.map(f=>'<div><label for="m-'+f.id+'">'+f.label+(f.req?' *':'')+'</label><input id="m-'+f.id+'" name="'+f.id+'" type="'+f.type+'" placeholder="'+f.ph+'" autocomplete="'+f.ac+'"'+(f.value?' value="'+f.value+'"':'')+(f.req?' required aria-required="true"':'')+' aria-describedby="e-'+f.id+'"><span class="err" id="e-'+f.id+'" aria-live="polite"></span></div>').join('')+
 '<p class="gerr" id="gerr" aria-live="polite"></p><button type="submit" class="go">'+FM.submit+'</button></form>'+
 '<div class="thx" role="status"><h2>'+FM.thanksTitle+'</h2><p>'+FM.thanksText+'</p><button type="button" class="tclose">'+FM.close+'</button></div></div>';
$('#root').appendChild(mdl);
let lastFocus=null;
const mcard=mdl.querySelector('.mcard'),mform=mdl.querySelector('form');
const focusables=()=>[...mdl.querySelectorAll('button,input')].filter(e=>e.offsetParent!==null&&!e.disabled);
function openModal(){
 mopen=true;lastFocus=zone;mdl.style.setProperty('--paperbg','url('+(mode==='port'?'assets/register/p/m_paper.webp':(small?'assets/register/m/paper.webp':'assets/register/d/paper.webp'))+')');
 mdl.classList.remove('sent');mdl.classList.add('open');mdl.setAttribute('aria-hidden','false');document.body.classList.add('mopen');
 stamp.classList.remove('show');
 setTimeout(()=>{const f=mdl.querySelector('input');f&&f.focus({preventScroll:true})},RM?0:150);
}
function closeModal(){
 mopen=false;mdl.classList.remove('open');mdl.setAttribute('aria-hidden','true');document.body.classList.remove('mopen');
 stampBack();stamp.classList.toggle('show',fine);
 setTimeout(()=>{if(lastFocus)lastFocus.focus({preventScroll:true})},50);
}
mdl.querySelector('.mx').addEventListener('click',closeModal);
mdl.querySelector('.tclose').addEventListener('click',closeModal);
mdl.addEventListener('pointerdown',e=>{if(e.target===mdl)closeModal()});
mdl.addEventListener('keydown',e=>{
 if(e.key==='Escape'){e.preventDefault();closeModal();return}
 if(e.key==='Tab'){const f=focusables();if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
const PHONE=/^(?:0|\+?84)(?:3|5|7|8|9)\d{8}$/,MAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function validate(){
 let ok=true,first=null;const data={};
 for(const f of FM.fields){
  const i=mform.elements[f.id],v=i.value.trim();data[f.id]=v;let m='';
  if(f.req&&!v)m=FM.errReq;
  else if(f.id==='sdt'&&v&&!PHONE.test(v.replace(/[\s.\-()]/g,'')))m=FM.errPhone;
  else if(f.type==='email'&&v&&!MAIL.test(v))m=FM.errEmail;
  document.getElementById('e-'+f.id).textContent=m;i.setAttribute('aria-invalid',m?'true':'false');
  if(m){ok=false;if(!first)first=i}
 }
 if(first)first.focus();
 return ok?data:null;
}
mform.addEventListener('input',e=>{const i=e.target;if(i.getAttribute('aria-invalid')==='true'){i.setAttribute('aria-invalid','false');document.getElementById('e-'+i.name).textContent=''}});
mform.addEventListener('submit',async e=>{
 e.preventDefault();const data=validate();if(!data)return;
 const btn=mform.querySelector('.go');btn.disabled=true;btn.textContent=FM.sending;$('#gerr').textContent='';
 try{await submitRegistration(data);sent=true;$('#hint').textContent=CONFIG.hintDone;$('#live').textContent=CONFIG.hintDone;mdl.classList.add('sent');setTimeout(()=>mdl.querySelector('.tclose').focus(),30)}
 catch(err){$('#gerr').textContent=FM.errSend}
 btn.disabled=false;btn.textContent=FM.submit;
});
/* ===== gió: thỉnh thoảng một cơn gió nhẹ làm lá rung mạnh hơn một chút (cành gần như đứng yên) ===== */
let raf=0;
function gustLoop(){setTimeout(()=>{if(!document.hidden&&!RM){art.classList.add('gust');setTimeout(()=>art.classList.remove('gust'),2600)}gustLoop()},rnd(6000,12000))}
function start(){}

/* ===== tải xong rồi mới mở ===== */
layout();
const bar=$('.loader-track span');let done=0;
const total=imgs.length+2;
const tick=()=>{done++;bar.style.transform='scaleX('+Math.min(1,done/total).toFixed(2)+')'};
const dec=e=>new Promise(r=>{const fin=()=>{tick();r()};(e.decode?e.decode():Promise.reject()).then(fin,()=>{if(e.complete)fin();else{e.addEventListener('load',fin,{once:true});e.addEventListener('error',fin,{once:true})}})});
const fonts=Promise.all([document.fonts.load('400 40px "Oooh Baby"','Đăng ký lớp F2 Cảm ơn bạn!'),document.fonts.load('italic 400 40px "Mali"','Còn 0123456789 Chạm vào con dấu'),document.fonts.load('italic 300 40px "Mali"','0123456789'),document.fonts.load('500 20px "Be Vietnam Pro"','Họ tên ế')]).then(tick,tick);
Promise.race([Promise.all([...imgs.map(dec),dec(stampImg),fonts]),wait(15000)]).then(async()=>{
 layout();
 document.body.classList.add('ready');$('.loader').classList.add('is-done');
 ready=true;place();
 await wait(RM?0:550);
 document.body.classList.add('go');gustLoop();setTimeout(armIdle,RM?0:3000);
 setTimeout(()=>setEnrolled(CONFIG.demo.enrolled,CONFIG.demo.capacity),RM?0:3600);
});
})();
</script>
