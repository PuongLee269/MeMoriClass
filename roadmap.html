:root{
  color-scheme:dark;
  --bg:#080504;--gold:#f3cf8e;--gold2:#ffb765;--cream:#fbefd5;--ink:#3a2410;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);color:var(--cream);-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;overflow:clip;contain:layout paint;background:radial-gradient(120% 90% at 50% 30%,#1a0f09 0%,#0b0605 60%,#050302 100%);touch-action:manipulation;user-select:none;-webkit-user-select:none}

.g{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.gi{position:absolute;left:0;top:0;width:0;height:0;transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1),clip-path .9s ease}
.l{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
.hide-fail{visibility:hidden}
/* intro: everything starts hidden, JS removes .pre classes in order */
#app.intro .gi,#app.intro .fade{opacity:0}

#app.intro #chapGI{clip-path:inset(-60px 100% -60px -60px)}

#app.intro #leafRGI{transform:translate(40px,30px)}
#app.intro #glints{opacity:0}
#chapGI{width:1040px;height:210px}
#app #stext.swap{opacity:0!important}
#app .on{opacity:1!important}
#app .gi.on{transform:none!important;clip-path:inset(-60px -60px -60px -60px)!important}
.fade{transition:opacity .7s ease}
/* ---- khung video theo tỉ lệ clip + viền năng lượng (canvas) ---- */
#pz{position:absolute;left:0;top:0;width:0;height:0}
#pw{position:absolute;left:0;top:0;--bs:44px;--bps:72px;--spn:36px;--ccfs:16px;--bpad:8px;--prog:22px;--barh:66px;--shh:100px;transition:transform .9s cubic-bezier(.2,.7,.2,1)}

#app #pw.on{transform:none!important}
#vwrap{isolation:isolate;position:absolute;inset:0;overflow:hidden;background:#000}

#pz.swp{opacity:0!important;transition:opacity .16s ease!important}
#pz.swi{transition:opacity .3s ease!important}

#pfs{position:absolute;inset:0;pointer-events:none}
#pfs #pui>*{pointer-events:auto}#pfs #cc,#pfs #spin,#pfs #msg{pointer-events:none}

#pw.h-vol #vol,#pw.h-time #time,#pw.h-set #bSet,#pw.h-cc #bCC,#pw.h-mute #bMute{display:none}
#pfs{position:absolute;inset:0;pointer-events:none}
#pfs #pui>*{pointer-events:auto}#pfs #cc,#pfs #spin,#pfs #msg{pointer-events:none}

/* ---- chapters ---- */

.nd .orb,.hls,#chapGI .hr,.selr,#chapGI .lab.lit{will-change:opacity;backface-visibility:hidden}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 78% 74% at 50% 46%,rgba(0,0,0,0) 52%,rgba(2,1,1,.34) 82%,rgba(2,1,1,.6) 100%)}

.nd .orb::after{content:'';position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1.5px solid rgba(255,230,170,.9)}
.nd .orb.on2{opacity:1}
.hls{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;opacity:0;transition:opacity .42s ease}
.hls.on2{opacity:1}
#chapGI .hr{position:absolute;border-radius:50%;border:1.5px solid rgba(255,186,105,.9);box-shadow:0 0 12px rgba(255,150,60,.55),inset 0 0 10px rgba(255,150,60,.25);opacity:0;transition:opacity .25s;pointer-events:none}
#chapGI .hr.on2{opacity:.55}
.selr{position:absolute;border-radius:50%;border:1.8px solid rgba(255,190,110,.95);box-shadow:0 0 16px rgba(255,150,60,.65),inset 0 0 14px rgba(255,150,60,.28);opacity:0;transition:opacity .42s ease;pointer-events:none}
.selr.act{opacity:1}
#wave{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
/* ---- scroll text ---- */
#stext{position:absolute;left:0;top:0;color:#2a1608;-webkit-text-stroke:.35px rgba(42,22,8,.7);font-family:var(--script);display:flex;flex-direction:column;gap:calc(var(--u,1)*5px);overflow:hidden;transition:opacity .25s ease,transform .3s ease;will-change:transform}

#stext .sc{font-size:calc(var(--u,1)*17px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:calc(var(--u,1)*8px)}

#stext .nr{font-size:calc(var(--u,1)*18px);line-height:1.16;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4;overflow:hidden;min-height:0;flex:0 1 auto}
#deco{position:absolute;left:0;top:0;pointer-events:none}#deco svg{width:100%;height:100%;display:block}

#sketch .fr{position:absolute;inset:0;border:1.6px solid currentColor;border-radius:2px;transform:rotate(-.4deg)}
#sketch svg{position:absolute;inset:0;width:100%;height:100%}
/* ---- player ui ---- */
#pui{position:absolute;inset:0}
#pui>*{position:absolute}
#bigplay{left:50%;top:50%;width:var(--bps);height:var(--bps);margin:calc(var(--bps)/-2) 0 0 calc(var(--bps)/-2);border-radius:50%;border:2px solid rgba(255,196,120,.95);background:radial-gradient(circle,rgba(14,8,4,.32),rgba(14,8,4,.12));box-shadow:0 0 20px rgba(255,150,60,.6),inset 0 0 16px rgba(255,150,60,.28);color:var(--cream);cursor:pointer;display:grid;place-items:center;padding:0;transition:opacity .35s,transform .35s;outline:0}
#bigplay::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(255,190,110,.35);animation:ring 3.2s ease-in-out infinite}
@keyframes ring{0%,100%{transform:scale(.96);opacity:.25}50%{transform:scale(1.06);opacity:.7}}
#bigplay svg{width:42%;height:42%;fill:currentColor;filter:drop-shadow(0 0 6px rgba(255,170,80,.7));margin-left:6%}
#bigplay:focus-visible,.cb:focus-visible,.mi:focus-visible,.sp:focus-visible,#cancelNext:focus-visible{outline:2px solid #ffd98f;outline-offset:3px}
#app.playing #bigplay,#app.playing.hasplayed #bigplay{opacity:0;pointer-events:none;transform:scale(.9)}
#bar{left:var(--bpad);right:var(--bpad);bottom:6px;height:var(--barh);display:flex;flex-direction:column;justify-content:flex-end;transition:opacity .3s ease}

#app.idleui #bar,#app.idleui #menu{opacity:0;pointer-events:none}
#app.idleui #pw,#app.idleui #pui{cursor:none}
#bar .row{display:flex;align-items:center;gap:2px;height:var(--bs);color:var(--cream);filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
.cb{width:var(--bs);height:var(--bs);flex:none;border:0;background:transparent;color:var(--cream);border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .2s,color .2s,opacity .2s;outline:0}
.cb:hover:not(:disabled){background:rgba(255,226,170,.15);color:#fff}
.cb:disabled{opacity:.35;cursor:default}
.cb svg{width:calc(var(--bs)*.55);height:calc(var(--bs)*.55);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cb .fillic{fill:currentColor;stroke:none}
.cb[aria-pressed=true]{color:var(--gold2)}
#time{font-size:13px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;margin:0 8px;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.sp{flex:1}
#vol{width:78px;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;--p:100%}
.prog{position:relative;height:var(--prog);margin:0 6px}
.prog .tr{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:rgba(255,235,200,.22)}
.prog .bf,.prog .pl{position:absolute;left:0;top:0;height:100%;border-radius:3px}
.prog .bf{background:rgba(255,235,200,.34);width:0}
.prog .pl{background:linear-gradient(90deg,#ffb765,#ffd99a);box-shadow:0 0 8px rgba(255,160,70,.8);width:0}
#seek{position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:22px;background:transparent}
input[type=range]::-moz-range-track{height:22px;background:transparent}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:4px;border-radius:50%;background:#ffe9b8;box-shadow:0 0 0 3px rgba(255,170,80,.35),0 0 10px rgba(255,160,70,.9);border:0}
#seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#ffe9b8;box-shadow:0 0 0 3px rgba(255,170,80,.35),0 0 10px rgba(255,160,70,.9);border:0}
#vol::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold) var(--p),rgba(255,235,200,.25) var(--p))}

#vol::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#ffe9b8;border:0;box-shadow:0 0 8px rgba(255,160,70,.9)}
input[type=range]:focus-visible{outline:2px solid #ffd98f;outline-offset:2px;border-radius:6px}
#cc{left:5%;width:90%;bottom:calc(var(--barh) + 12px);font-size:var(--ccfs);display:flex;align-items:flex-end;justify-content:center;text-align:center;pointer-events:none;font-family:var(--sans);font-weight:500;color:#fff6e0;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.95),0 0 2px #000;line-height:1.35;transition:opacity .2s}

/* ---- toàn màn hình: chỉ phần tử #pfs (video + điều khiển) ---- */

/* ================= VÒNG LẶP: parallax, trôi nhẹ, bọ rùa ================= */
let mx=0,my=0,smx=0,smy=0,vis=true;
app.addEventListener('pointermove',e=>{mx=(e.clientX/VW-.5)*2;my=(e.clientY/VH-.5)*2;LADY.ptr=[e.clientX,e.clientY];LADY.ptrType=e.pointerType==='mouse'?'mouse':'touch';LADY.act=now},{passive:true});
app.addEventListener('pointerdown',e=>{LADY.ptr=[e.clientX,e.clientY];LADY.ptrType=e.pointerType==='mouse'?'mouse':'touch';LADY.act=now},{passive:true});
function tf(el,g,dx,dy){el.style.transform=`translate(${(g.tx+dx).toFixed(2)}px,${(g.ty+dy).toFixed(2)}px) scale(${g.kx},${g.ky})`}
function frame(ts){
  now=ts/1000;requestAnimationFrame(frame);if(!vis)return;
  smx+=(mx-smx)*.06;smy+=(my-smy)*.06;
  const A=RM?0:1,pxs=PORT?.35:1,ds=Math.sin(now*.35)*3*A,dc=Math.cos(now*.27)*2*A;
  const bobY=A*Math.sin(now*1.1)*5*(PORT?.6:1)*(UI.s||1);
  let pdx=0,pdy=0;
  for(const id in G){const g=G[id];const k=(UI.s||1);let dx=A*(smx*g.depth*-7*pxs+ds*g.depth*.5)*Math.max(.5,k),dy=A*(smy*g.depth*-4*pxs+dc*g.depth*.5)*Math.max(.5,k);
    if(id==='scrollG'||id==='sshadowG'){dy+=id==='scrollG'?bobY:0}
    if(id==='playerG'){pdx=dx;pdy=dy}
    if(id==='sshadowG'){g.el.style.opacity=(1-.18*Math.sin(now*1.1)*A*.9).toFixed(3)}
    tf(g.el,g,dx,dy);G[id]._dx=dx;G[id]._dy=dy}
  {const z=$('pz').style;z.left=pdx.toFixed(2)+'px';z.top=pdy.toFixed(2)+'px'}
  wrapTick();
  const sg=G.scrollG;stext.style.transform=stext.classList.contains('swap')?`translate(${sg._dx}px,${(sg._dy+5).toFixed(2)}px)`:`translate(${sg._dx.toFixed(2)}px,${sg._dy.toFixed(2)}px)`;
  $('sketch').style.transform=`translate(${sg._dx.toFixed(2)}px,${sg._dy.toFixed(2)}px)`;$('deco').style.transform=$('sketch').style.transform;
  glintsEl.style.transform=`translate(${G.bgG._dx.toFixed(1)}px,${G.bgG._dy.toFixed(1)}px)`;
  if(!RM){const sw=Math.sin(now*.6)*.5;leafL.style.transform=`rotate(${sw}deg)`;leafR.style.transform=`rotate(${-sw*.9}deg)`}
  // bọ rùa: toạ độ màn hình của chân
  const mg=G.moundLG;LADY.sx=mg.tx+mg._dx+(LADY_FEET[0]-mg.gx)*mg.kx;LADY.sy=mg.ty+mg._dy+(LADY_FEET[1]-mg.gy)*mg.ky;LADY.sk=mg.kx;
  drawLady();
  FX.lvl+=((app.classList.contains('playing')?.45:.6)-FX.lvl)*.03;
  if(now-FX.last>1/30&&!RM){FX.last=now;fxDraw()}
}

/* ================= MỞ ĐẦU (~3 s) ================= */
function intro(){
  const on=(el)=>el&&el.classList.add('on');
  const steps=[[0,()=>on($('bgGI'))],[0,()=>{$('glints').style.transition='opacity 1s'}],[450,()=>{on($('pz'));on($('pw'))}],[1150,()=>{on($('sshadowGI'));on($('scrollGI'));on($('stext'));on($('sketch'));on($('deco'))}],
    [1650,()=>on($('chapGI'))],[2150,()=>{on($('moundLGI'))}],[2450,()=>{on($('leafLGI'));on($('leafRGI'))}],
    [3100,()=>{app.classList.remove('intro');app.querySelectorAll('.on').forEach(e=>e.classList.remove('on'))}]];
  steps.forEach(([t,f])=>setTimeout(f,t));
}
/* Tải thật: MỌI ảnh (nền, các lớp, 4 poster, bọ rùa 6 dáng) + giải mã (img.decode) + phông chữ. Iframe video KHÔNG nằm trong danh sách: chỉ tạo khi bấm phát. */
function loadGate(){
  const loader=document.querySelector('.loader'),bar=loader.querySelector('.loader-track span');
  const dec=im=>new Promise(r=>{const go=()=>{(im.decode?im.decode():Promise.resolve()).then(r,r)};if(im.complete&&im.naturalWidth)go();else if(im.complete)r();else{im.addEventListener('load',go,{once:true});im.addEventListener('error',()=>r(),{once:true})}});
  const list=[...document.images].map(dec);
  for(const k in poses)list.push(poses[k].ready);
  const sample=CHAPTERS.map(c=>c.num+c.title+c.script.scene+c.script.vo+(c.script.cues||[]).map(q=>q.text).join('')).join(' ')+' Lộ trình Me.Mori Chuẩn Tốc độ phát Chất lượng Tự động';
  ['400 40px "Oooh Baby"','400 16px "Be Vietnam Pro"','500 16px "Be Vietnam Pro"'].forEach(f=>list.push(document.fonts&&document.fonts.load?document.fonts.load(f,sample).catch(()=>{}):Promise.resolve()));
  let n=0;const tot=list.length,upd=()=>{bar.style.transform='scaleX('+Math.max(.04,n/tot*.96)+')'};
  list.forEach(p=>p.then(()=>{n++;upd()}));
  const all=Promise.all(list),timeout=new Promise(r=>setTimeout(r,30000)),minShow=new Promise(r=>setTimeout(r,RM?200:900));
  const raf2=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  return Promise.all([minShow,Promise.race([all,timeout])]).then(raf2).then(()=>{bar.style.transform='scaleX(1)';loader.classList.add('is-done');setTimeout(()=>loader.remove(),1000)});
}
function boot(){
  layout();SELECTED=SELECTED;select(SELECTED,{force:true});paintChapters();moveRing();
  requestAnimationFrame(frame);
  loadGate().then(()=>{window.__loaderDone=performance.now();if(RM){app.classList.remove('intro');app.classList.add('ready');READY=true;idle(warmFit);return}intro();setTimeout(()=>{app.classList.add('ready');READY=true;idle(warmFit)},3300)});
}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,60)});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,60)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{FT={};fitText()});
boot();
