name = "memori-bo-router"
main = "index.js"
compatibility_date = "2026-11-11"

[vars]
AI_MODEL = "openai/gpt-6-luna"
LIMITER = "12"            # câu hỏi/phút/IP
AI_DAILY_PER_IP = "50"    # lần gọi AI/ngày UTC cho mỗi IP
DAILY_CAP = "2000"        # tổng số lần gọi AI/ngày cho toàn Worker
MODEL_TIMEOUT_MS = "4000" # timeout gọi GPT, trước timeout phía trình duyệt 4500 ms
ALLOWED_ORIGINS = "https://moriclass.com,https://www.moriclass.com"
# DEV = "1"               # chỉ khi thử cục bộ: cho phép http://localhost
LOG_USAGE = "1"
AI_JSON = "1"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimit"]
