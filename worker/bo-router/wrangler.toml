name = "memori-bo-router"
main = "index.js"
compatibility_date = "2026-11-11"

[vars]
OPENAI_MODEL = "gpt-4o-mini"   # model phân loại nhỏ; đổi ở đây, không cần sửa code
OPENAI_TIMEOUT_MS = "6000"               # Worker chờ OpenAI tối đa; trang chờ Worker tối đa 8000 ms (ai.timeoutMs)
LIMITER = "12"            # câu hỏi/phút/IP
AI_DAILY_PER_IP = "50"    # lượt gọi AI/ngày UTC cho mỗi IP
DAILY_CAP = "2000"        # tổng số lượt gọi AI/ngày cho toàn Worker
ALLOWED_ORIGINS = "https://moriclass.com,https://www.moriclass.com"
# DEV = "1"               # chỉ khi thử cục bộ: cho phép http://localhost
# DEBUG_USAGE = "1"       # chỉ khi test: trả số token trong header x-bo-tokens (vào,ra,suy nghĩ)

# KHÓA: OPENAI_API_KEY chỉ đặt bằng Worker secret, KHÔNG ghi vào file này:
#   npx wrangler secret put OPENAI_API_KEY
# Chạy thử cục bộ: tạo file .dev.vars (đã bị gitignore) chứa dòng OPENAI_API_KEY=...

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimit"]
