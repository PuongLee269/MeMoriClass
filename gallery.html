<script>
(async()=>{

const ASSIGNMENTS0 = [
  {gems:[0,1,2], photo:'sample'}, {gems:[3,4,5], photo:'sample'}, {gems:[6,7,8], photo:'sample'},
  {gems:[0,3,6], photo:'sample'}, {gems:[1,4,7], photo:'sample'}, {gems:[2,5,8], photo:'sample'},

/* Nội dung sửa được từ trang admin (assets/content/gallery.json + site.json): danh sách ảnh, bộ 3 đá -> ảnh, chữ gợi ý. */
const GC=await MemoriContent.load('gallery',{pageTitle:document.title,hint:'',photos:PHOTOS0,assignments:ASSIGNMENTS0},{replace:['photos']}),SITE=await MemoriContent.load('site',MemoriContent.SITE_DEFAULT);
MemoriContent.applySite(SITE,'.back');document.title=GC.pageTitle||document.title;MemoriContent.setText('#hint',GC.hint);
const PHOTOS=(()=>{const seen={},out=[];for(const p of GC.photos){if(!p||typeof p.id!=='string'||!/^[a-z0-9_-]{1,32}$/i.test(p.id)||seen[p.id])continue;const src=MemoriContent.url(p.src,'');if(!src)continue;seen[p.id]=1;
  const at=Array.isArray(p.at)&&p.at.length===2&&p.at.every(n=>typeof n==='number'&&isFinite(n)&&Math.abs(n)<5000)?p.at:undefined;out.push({id:p.id,src,alt:typeof p.alt==='string'?p.alt:'',at})}
  return out.length?out:PHOTOS0})();
const ASSIGNMENTS=ASSIGNMENTS0.map((d,i)=>{const c=GC.assignments[i];const ok=c&&PHOTOS.some(p=>p.id===c.photo);return{gems:d.gems,photo:ok?c.photo:(PHOTOS.some(p=>p.id===d.photo)?d.photo:PHOTOS[0].id)}});
// Bọ rùa: bộ tư thế TĨNH dùng chung (assets/bo/pose-*.webp, 232x276, chân ở (116,266); docs/BO_POSES.md). KHÔNG có dáng ngang: nghỉ = chính diện, nhìn về một phía = quay 3/4, "back" chỉ để nhìn ảnh chiếu.
// Biểu cảm (chớp mắt, cười, ngạc nhiên, ngước lên) do assets/bo-idle.js tự phát 5-12 giây một lần khi không có tương tác.
const LADYBUG_POSES = {
  rest:{file:'assets/bo/pose-rest.webp',available:true},
  turnL:{file:'assets/bo/pose-turnL.webp',available:true},
  turnR:{file:'assets/bo/pose-turnR.webp',available:true},
  back:{file:'assets/bo/pose-back.webp',available:true},
  blink:{file:'assets/bo/pose-blink.webp',available:true},
  surprised:{file:'assets/bo/pose-surprised.webp',available:true},
  laugh:{file:'assets/bo/pose-laugh.webp',available:true},
  lookup:{file:'assets/bo/pose-lookup.webp',available:true},
};
const LADY_FX=116, LADY_FY=266;   // chân (px sprite)
// Bảng chọn tư thế theo vị trí con trỏ (dễ sửa). Kiểm tra theo thứ tự: vùng trước, rồi 8 hướng (góc 0=phải, 90=trên, ngược chiều kim đồng hồ).
// "trên" dùng back (quay lưng nhìn lên ảnh chiếu); các hướng ngang dùng quay 3/4 (turnL/turnR), không bao giờ nhìn ngang.
const LADY_RULES = {
  onSelf:'laugh',            // con trỏ đặt lên chính bọ rùa: cười
  regions:{frame:'back', tray:'rest'},   // con trỏ trên khung ảnh / khay
  sectors:['turnR','turnR','back','turnL','turnL','turnL','rest','turnR'], // phải, trên-phải, trên, trên-trái, trái, dưới-trái, dưới, dưới-phải
  dwell:0.25, minMove:6, fade:0.001, hop:2.5,   // giây / px
  mouseIdle:6, touchIdle:4,                    // về nghỉ sau (giây)
  photoChange:{pose:'back',hold:2.2}, glitch:{pose:'surprised',hold:1.1},
};
/* ===== HẾT DỮ LIỆU ===== */

const CW=1672,CH=941;
const A={bg:['assets/gallery/bg.webp',0,0],frame:['assets/gallery/frame.webp',347,2],projector:['assets/gallery/projector.webp',686,517],tray:['assets/gallery/tray.webp',940,664]};
const GBOX=[[578,511],[782,511],[988,511],[573,605],[781,605],[990,605],[570,699],[779,700],[992,700]];
const GSZ=[[194,143],[195,142],[191,143],[198,144],[198,145],[197,144],[201,149],[202,148],[204,148]];
const GCOL=['#ff3b3b','#3b7bff','#ffa030','#36d36a','#a550ff','#b4e82a','#2fd8f0','#ff4fb0','#ffffff'];
const GNAME=['đỏ','xanh dương','cam','xanh lá','tím','vàng chanh','lam','hồng','trắng'];
// Tâm ô khay (toạ độ canvas 1672x941). Khay nghiêng phối cảnh nên mỗi hàng lệch phải dần: đo từ đường kẻ của khay (hàng trên 1002/1074/1147, giữa 1003/1078/1155, dưới 1004/1082/1162).
const CELLS=[[1002,701],[1074,701],[1147,701],[1003,729.5],[1078,729.5],[1155,729.5],[1004,759],[1082,759],[1162,759]], GSCALE=0.35;
// Tâm thân viên đá (trọng tâm vùng đặc, bỏ bóng) trong sprite, px sprite
const GBODY=[[96.3,73.3],[96.5,72.9],[94.4,72.7],[98.2,74.0],[97.8,74.2],[97.1,74.2],[99.5,76.3],[99.6,75.7],[99.8,75.9]];
const LENS=[808,648]; // đỉnh chùm sáng (canvas)
const FRAME_C=[833,280], FRAME_HALF=[420,206];

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),hint=$('hint'),live=$('live');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---- ảnh ---- */
function loadImg(src){const o={img:new Image(),ok:false,done:false,w:0,h:0};o.img.onload=()=>{o.ok=true;o.done=true;o.w=o.img.naturalWidth;o.h=o.img.naturalHeight};o.img.onerror=()=>{o.done=true};o.img.src=src;return o}
const IM={};for(const k in A)IM[k]=loadImg(A[k][0]);
const GI=[...Array(9)].map((_,i)=>loadImg('assets/gallery/gem'+i+'.webp'));
const PH={};for(const p of PHOTOS){const o=loadImg(p.src);o.def=p;PH[p.id]=o}
const photoReady=id=>PH[id]&&PH[id].ok;

/* ---- bọ rùa ---- */
const poses={};for(const k in LADYBUG_POSES){const p=LADYBUG_POSES[k];poses[k]=p.available?loadImg(p.file):{img:null,ok:false,done:true}}
// làm sáng/đậm màu cho hợp cảnh đêm: brightness .85, saturate .92, ám ấm nhẹ dần về phía máy chiếu (bên phải). Nướng sẵn vào canvas (không dùng ctx.filter).
function bakePose(o){if(!o.ok||o.proc)return;try{const c=document.createElement('canvas');c.width=o.w;c.height=o.h;const x=c.getContext('2d');x.drawImage(o.img,0,0);
  const id=x.getImageData(0,0,o.w,o.h),d=id.data;for(let j=0;j<o.h;j++)for(let i=0;i<o.w;i++){const k=(j*o.w+i)*4;if(!d[k+3])continue;const t=i/o.w;
    let r=d[k]*.85,g=d[k+1]*.85,b=d[k+2]*.85;const l=.3*r+.59*g+.11*b;r=l+(r-l)*.92;g=l+(g-l)*.92;b=l+(b-l)*.92;
    d[k]=Math.min(255,r*(1+.05*t));d[k+1]=g*(1+.0*t);d[k+2]=b*(1-.1*t)}
  x.putImageData(id,0,0);o.proc=c}catch(_){o.proc=null}}
const BOCTL=BoIdle.create({every:[5,12]});
const LADY={cur:'rest',prev:null,t0:-9,hopT0:-9,hopN:1,hopA:0,hopD:.3,shT0:-9,ovr:null,until:0,act:-99,want:'rest',cand:'rest',candT:0,ptr:null,ptrType:'mouse',inside:false,glanceAt:null,glanceEnd:0,lastP:null};
function setPose(name,hop){if(!poses[name]||!poses[name].ok){name='rest';if(!poses.rest.ok)return}if(name===LADY.cur)return;
  if(RM){LADY.prev=null;LADY.cur=name;return}
  LADY.prev=LADY.cur;LADY.cur=name;LADY.t0=now;if(hop!==0)ladyHop(1,hop||LADY_RULES.hop,.28)}
function ladyHop(n,a,d){LADY.hopT0=now;LADY.hopN=n;LADY.hopA=a;LADY.hopD=d}
// sự kiện (đè lên việc nhìn theo con trỏ trong thời gian hold)
function ladyEvent(kind){const r=LADY_RULES[kind];LADY.ovr=kind;LADY.until=now+r.hold;LADY.evT=now;setPose(r.pose,0);
  if(RM)return;if(kind==='photoChange')ladyHop(2,4,.5);else{ladyHop(2,8,.4);LADY.shT0=now}}
// con trỏ: chỉ ghi nhận vị trí, không can thiệp vào logic kéo/chạm của đá
function ladyPtr(e,gem){const r=cv.getBoundingClientRect();LADY.ptr=gem&&gem.length?gem:[e.clientX-r.left,e.clientY-r.top];LADY.ptrType=e.pointerType==='mouse'?'mouse':'touch';LADY.inside=true;LADY.act=now}
function ladyTarget(P){ // trả về tên tư thế theo con trỏ, hoặc null
  if(!LADY.ptr||!LADY.inside)return null;
  const idle=now-LADY.act;if(idle>(LADY.ptrType==='mouse'?LADY_RULES.mouseIdle:LADY_RULES.touchIdle))return null;
  const [px,py]=LADY.ptr,s=LADYSK*P.kx,[gx,gy]=pt(P,645,749),bx=gx,by=gy-110*s;
  if(Math.abs(px-bx)<75*s&&py>gy-230*s&&py<gy+12*s)return LADY_RULES.onSelf;
  const fr=L.frame;{const [fx,fy]=pt(fr,FRAME_C[0],FRAME_C[1]);if(Math.abs(px-fx)<FRAME_HALF[0]*fr.kx&&Math.abs(py-fy)<FRAME_HALF[1]*fr.ky)return LADY_RULES.regions.frame}
  if(gemPos.length&&px>gemPos[3][0]+0&&py>gemPos[0][1]-cellH*.6&&px<gemPos[5][0]+cellW*.6&&py<gemPos[8][1]+cellH*.6&&px>gemPos[0][0]-cellW*.6)return LADY_RULES.regions.tray;
  const dx=px-bx,dy=by-py;let ang=Math.atan2(dy,dx)*180/Math.PI;if(ang<0)ang+=360;
  let sec=Math.floor(((ang+22.5)%360)/45);
  // trễ góc: giữ khu vực cũ nếu còn trong +-8 độ quanh biên
  if(LADY.sec!=null&&LADY.sec!==sec){const c=LADY.sec*45;let df=Math.abs(((ang-c+540)%360)-180);if(df<22.5+4)sec=LADY.sec}
  LADY.sec=sec;return LADY_RULES.sectors[sec];
}
function ladyUpdate(P){
  if(RM){ // giảm chuyển động: chỉ đổi tư thế tức thì khi có sự kiện trực tiếp
    if(LADY.ovr&&now>LADY.until){LADY.ovr=null;setPose('rest')}return}
  if(LADY.ovr){if(now<LADY.until)return;LADY.ovr=null;LADY.cand=null}
  const t=ladyTarget(P);
  if(t){LADY.glanceAt=null;
    const mv=!LADY.lastP||Math.hypot(LADY.ptr[0]-LADY.lastP[0],LADY.ptr[1]-LADY.lastP[1])>=LADY_RULES.minMove;if(mv)LADY.lastP=LADY.ptr.slice();
    if(t!==LADY.cand){LADY.cand=t;LADY.candT=now}
    if(t!==LADY.cur&&now-LADY.candT>=LADY_RULES.dwell&&(mv||LADY.cand===t))setPose(t);
    return}
  LADY.cand=null;LADY.sec=null;
  const ip=BOCTL.pose;if(LADY.cur!==ip)setPose(ip,0); // nghỉ chính diện + biểu cảm thỉnh thoảng (bo-idle.js)
}
window.__ladyPose=()=>LADY.cur;window.__lady=LADY; // chỉ để kiểm thử tự động
const LADYSK=0.34; // sprite 288x308: thân rộng ~213px; 0.34 cho thân ~72px canvas như sprite cũ
/* ---- bố cục ---- */
let W=0,H=0,DPR=1,L=null,portrait=false;
const mkP=(rx,ry,sx,sy,kx,ky)=>({rx,ry,sx,sy,kx,ky:ky||kx});
const pt=(P,x,y)=>[P.sx+(x-P.rx)*P.kx,P.sy+(y-P.ry)*P.ky];
const cssPx=n=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n))||0;
function layoutFn(w,h){
  const sat=cssPx('--sat'),sab=cssPx('--sab');
