<script>
(async function(){
'use strict';
const W=1672,H=941,$=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q=new URLSearchParams(location.search);
if(Q.get('freeze')==='1')document.documentElement.classList.add('still');

/* ===== NỘI DUNG MẶC ĐỊNH (giống assets/content/lopf1.json; admin sửa file JSON, trang tự nạp) ===== */
const CONFIG_DEFAULT={
  version:1,

    {type:'image',imageUrl:'assets/gallery/photo.webp',videoId:'',provider:'',caption:'Căn nhà bên hồ',alt:'Căn nhà gỗ sáng đèn bên hồ dưới trăng'},
    {type:'video',imageUrl:'assets/lopf1/img/demo3.webp',videoId:'jNQXAC9IVRw',provider:'youtube',caption:'Video mẫu (giữ chỗ)',alt:'Hình đại diện của video mẫu'},
    {type:'image',imageUrl:'assets/lopf1/img/demo1.webp',videoId:'',provider:'',caption:'Hình mẫu 1 (giữ chỗ)',alt:'Hình mẫu giữ chỗ'},

  mobile:{enabled:true,frameStyle:'stone',aspect:.9,book:{cx:425.5,bottom:1378,baseWidth:351}}
};
const PANELS={"L":{"box":[73,297,366,380],"w":367,"h":344,"m":"matrix3d(0.700116,-0.1783873,0,-0.0007714573,-0.01450068,0.821917,0,-3.420589e-05,0,0,1,0,4,56.52542,0,1)"},"C":{"box":[442,278,790,410],"w":788,"h":411,"m":"matrix3d(1.004763,0.002537643,0,9.277337e-06,-0.004853816,0.9989889,0,-1.236447e-05,0,0,1,0,1,-2.046154,0,1)"},"R":{"box":[1234,300,364,376],"w":367,"h":337,"m":"matrix3d(1.391699,0.2522039,0,0.001130326,0.002940837,1.160837,0,-2.652221e-05,0,0,1,0,0,-12.20845,0,1)"}};
const C=await MemoriContent.load('lopf1',CONFIG_DEFAULT,{replace:['items','flipNext','flipPrev','open','idle']});
const SITE=await MemoriContent.load('site',MemoriContent.SITE_DEFAULT);
MemoriContent.applySite(SITE,'#back');
const PG=C.page;
document.title=PG.title||document.title;
MemoriContent.setText('.loader-text',PG.loaderText);
MemoriContent.setText('#ttl h1',PG.title);MemoriContent.setText('#ttl p',PG.subtitle);MemoriContent.setText('#hint',PG.hint);
$('book').setAttribute('aria-label',PG.bookLabel);$('prev').setAttribute('aria-label',PG.prevLabel);$('next').setAttribute('aria-label',PG.nextLabel);
if(!C.showArrows)$('view').classList.add('nonav');

/* ===== danh sách mục (làm sạch) ===== */
const ITEMS=(C.items||[]).map(it=>{
  const type=it.type==='video'?'video':'image';
  let vid='';if(type==='video'){const v=MemoriContent.parseVideo(it.videoId);vid=v&&v.provider==='youtube'?v.id:''}
  let img=MemoriContent.url(it.imageUrl,'');
  if(type==='video'&&!vid)return null;
  if(!img&&vid)img='https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg';
  if(!img)return null;
  return{type,img,vid,caption:String(it.caption||''),alt:String(it.alt||it.caption||'')};
}).filter(Boolean);
if(!ITEMS.length)ITEMS.push({type:'image',img:'assets/lopf1/img/s_clouds.webp',vid:'',caption:'',alt:''});
const N=ITEMS.length,LOOP=C.drag.loop!==false;
let idx=0;
const mod=i=>((i%N)+N)%N;
const itemAt=i=>LOOP?ITEMS[mod(i)]:(i<0||i>=N?null:ITEMS[i]);

/* ===== bố cục: co giãn theo cửa sổ, mở rộng cảnh bằng bản lật gương ===== */
const view=$('view'),stage=$('stage');
let S=1,OX=0,OY=0,MODE='d',PR=false,boCtl=null,MOB=null;
const PM={},MG={"fg": [0, 1500, 852, 346], "rune": [340, 401, 190, 136], "ped": [68, 1223, 702, 272], "frame": [3, 490, 830, 766], "mask": [37, 620, 778, 488]},MB=C.mobile.book;
/* ảnh nền máy tính: chỉ tải khi dùng bố cục ngang (điện thoại dọc không tải) */
function loadDesk(){document.querySelectorAll('img[data-desk]').forEach(i=>{if(i.dataset.src){i.src=i.dataset.src;i.removeAttribute('data-src')}})}
function layout(){
  const vw=innerWidth,vh=innerHeight;let s,ox,oy;
  const nm=(C.mobile.enabled&&vw/vh<C.mobile.aspect)?'m':'d';
  if(nm!==MODE){MODE=nm;if(PR){if(MODE==='d')loadDesk();applyMode()}}
  if(MODE==='m'){layoutM(vw,vh);return}
  if(vw/vh<.9){ s=vw/1112; ox=vw/2-836*s; oy=vh-H*s; }      /* điện thoại dọc: tạm cắt giữa (art điện thoại sẽ thay sau) */
  else { s=Math.min(vw/W,vh/H); ox=(vw-W*s)/2; oy=vh-H*s; }       /* máy tính: vừa khung, neo đáy */
  S=s;OX=ox;OY=oy;
  stage.style.transform='translate3d('+ox+'px,'+oy+'px,0) scale('+s+')';
  $('extL').classList.toggle('on',ox>.5);$('extR').classList.toggle('on',ox+W*s<vw-.5);
  $('extT').classList.toggle('on',oy>.5);$('extB').classList.toggle('on',oy+H*s<vh-.5);
  /* vùng chạm sách tối thiểu 52px màn hình */
  const bk=$('book'),bw=Math.max(372,64/s),bh=Math.max(112,56/s);
  bk.style.left=(836-bw/2)+'px';bk.style.top=(808-bh/2)+'px';bk.style.width=bw+'px';bk.style.height=bh+'px';
  const bf=$('bookfocus');bf.style.cssText='left:'+(836-bw/2)+'px;top:'+(808-bh/2)+'px;width:'+bw+'px;height:'+bh+'px';
  const nb=Math.max(60,52/s);['prev','next'].forEach(id=>{const e=$(id);e.style.width=nb+'px'});
  /* gợi ý + chú thích bám theo cảnh */
  const hd=$('hud');hd.classList.toggle('p',vw/vh<.9);if(vw/vh<.9)$('cap').style.top=(oy-64)+'px';else $('cap').style.top='';
  const hint=$('hint');hint.style.top=(oy+738*s)+'px';hint.style.fontSize=Math.max(14,17*s)+'px';
}
function layoutM(vw,vh){
  ensureMobile();
  let s=Math.max(vw/852,vh/1846),vis=vh/s;
  if(vis<1080){s=vh/1080;vis=1080}
  let top=Math.max(0,Math.min(1846-vis,1050-vis/2));
  const cap=353-76/s;/* Bọ + rune không chạm tiêu đề trên cùng */
  if(top>cap){if(cap+vis>=1440)top=Math.max(0,cap);else if(top<440)top=Math.min(1846-vis,440)}
  const ox=(vw-852*s)/2,oy=-top*s;
  S=s;OX=ox;OY=oy;
  $('mstage').style.transform='translate3d('+ox+'px,'+oy+'px,0) scale('+s+')';
  const bw=Math.max(400,70/s),bh=Math.max(170,60/s),cx=425,cy=1320;
  [['mbook'],['mbookfocus']].forEach(a=>{const e=$(a[0]);e.style.cssText+=';left:'+(cx-bw/2)+'px;top:'+(cy-bh/2)+'px;width:'+bw+'px;height:'+bh+'px'});
  const nb=Math.max(96,48/s);
  [['mprev',10],['mnext',852-10-nb]].forEach(a=>{const e=$(a[0]);e.style.width=nb+'px';e.style.height=nb+'px';e.style.left=a[1]+'px';e.style.top=(864-nb/2)+'px'});
  $('hud').classList.remove('p');$('cap').style.top='';
  const hint=$('hint');hint.style.top=(oy+1236*s)+'px';hint.style.fontSize=Math.max(14,22*s)+'px';
}
/* khung ảnh điện thoại: ghép bằng code từ 3 mảnh (góc, cạnh ngang, cạnh dọc), phản chiếu cho 4 góc/4 cạnh; mỗi cạnh nối đối xứng ở giữa nên không có vết nối */
function buildFrame(el){
  const w=MG.mask,CW=82.5,CH=74,TH=30,OV=0,IN=28,
    L=w[0]-OV-IN,T=w[1]-OV-IN,R=w[0]+w[2]+OV+IN,B=w[1]+w[3]+OV+IN,
    FS=(new URLSearchParams(location.search).get('frame')||C.mobile.frameStyle||'stone')==='wood'?'wood':'stone',u=n=>'assets/lopf1/m/fr_'+n+'_'+FS+'.webp';
  const add=(l,t,wd,ht,bg,sx,sy,bs)=>{const e=document.createElement('i');
    e.style.cssText='left:'+l+'px;top:'+t+'px;width:'+wd+'px;height:'+ht+'px;background-image:url('+u(bg)+');background-size:'+bs+';transform:scale('+sx+','+sy+')';el.appendChild(e)};
  const hw=(R-L)/2-CW,vh=(B-T)/2-CH;
  [[L,T,1,1],[R-CW,T,-1,1],[L,B-CH,1,-1],[R-CW,B-CH,-1,-1]].forEach(a=>add(a[0],a[1],CW,CH,'c',a[2],a[3],CW+'px '+CH+'px'));
  [[L+CW-1,T,1,1],[R-CW-hw,T,-1,1],[L+CW-1,B-TH,1,-1],[R-CW-hw,B-TH,-1,-1]].forEach(a=>add(a[0],a[1],hw+1,TH,'h',a[2],a[3],'390px '+TH+'px'));
  [[L,T+CH-1,1,1],[L,B-CH-vh,1,-1],[R-TH,T+CH-1,-1,1],[R-TH,B-CH-vh,-1,-1]].forEach(a=>add(a[0],a[1],TH,vh+1,'v',a[2],a[3],TH+'px 390px'));
}
/* tạo DOM bản điện thoại một lần (chỉ khi cần; máy tính không tải ảnh này) */
function ensureMobile(){
  if(MOB)return MOB;
  const ms=document.createElement('div');ms.id='mstage';
  const im=(n,g)=>'<img class="L" src="assets/lopf1/m/'+n+'.webp" alt="" style="left:'+g[0]+'px;top:'+g[1]+'px;width:'+g[2]+'px;height:'+g[3]+'px">';
  const m=MG.mask,ar=(id,l,d)=>'<button class="mnav" id="'+id+'" type="button" aria-label="'+(l)+'"><svg viewBox="0 0 26 34" aria-hidden="true"><path d="'+d+'"/></svg></button>';
  ms.innerHTML='<img class="L" src="assets/lopf1/m/bg.webp" alt="" style="left:0;top:0;width:852px;height:1846px">'
   +im('rune',MG.rune)+im('ped',MG.ped)+im('fg',MG.fg)
   +'<div class="mglow" style="left:268px;top:440px;width:330px;height:150px"></div><div class="mglow" style="left:170px;top:1230px;width:520px;height:190px;animation-delay:-2.4s"></div>'
   +'<div id="mbeam"></div><div id="mhit"></div>'
   +'<div class="panel" data-k="M" style="left:'+m[0]+'px;top:'+m[1]+'px;width:'+m[2]+'px;height:'+m[3]+'px"><div class="plane" style="width:'+m[2]+'px;height:'+m[3]+'px"><div class="shift"></div></div></div>'
   +'<div id="mframe"></div>'
   +'<div id="mglint"></div><div id="mmotes"></div><div id="mbo" aria-hidden="true"></div><div id="mbookglow"></div>'
   +'<div id="mfx" aria-hidden="true"><canvas id="mfxc"></canvas><div id="msparks"></div></div>'
   +ar('mprev',PG.prevLabel,'M24 2 2 17l22 15z')+ar('mnext',PG.nextLabel,'M2 2l22 15L2 32z')
   +'<button id="mbook" type="button" aria-describedby="live" aria-label="'+PG.bookLabel.replace(/"/g,'')+'"></button><div id="mbookfocus"></div>';
  view.appendChild(ms);view.classList.add('m');buildFrame(ms.querySelector('#mframe'));
  const P=ms.querySelector('.plane');PM.M={el:ms.querySelector('.panel'),plane:P,shift:P.firstChild,w:m[2],h:m[3]};
  MOB={el:ms};
  if(boCtl){try{BoIdle.mount($('mbo'),boCtl,{lazy:false})}catch(e){}MOB.bo=1}
  const mo=$('mmotes');[[-30,-40,-6],[34,-60,8],[0,-92,3],[-54,-20,-9],[56,-28,10],[-12,12,4]].forEach((p,i)=>{const e=document.createElement('i');e.className='mote';e.style.cssText='left:'+(433+p[0]*1.1)+'px;top:'+(468+p[1])+'px;--mx:'+p[2]+'px;animation-delay:'+(-i*1.15)+'s;animation-duration:'+(5.8+i*.45)+'s';mo.appendChild(e)});
  $('mnext').addEventListener('click',()=>go(1));$('mprev').addEventListener('click',()=>go(-1));
  if(!C.showArrows)view.classList.add('nonav');
  if(typeof bindBook==='function'){bindBook($('mbook'));bindBook($('mhit'))}
  placeMobileFx();
  return MOB;
}
function applyMode(){
  const m=MODE==='m'&&MOB;
  stage.style.display=m?'none':'';if(MOB)MOB.el.style.display=m?'':'none';
  view.classList.toggle('m',!!m);
  panelEls=m?PM:PD;KEYS=m?['M']:['L','C','R'];
  if(BX.frames)selectCv();
  fillPanels(0);
}
/* bản lật gương cho dải thừa */
['L','R','T','B'].forEach(k=>{const e=$('ext'+k),c=$('scenery').cloneNode(true);c.removeAttribute('id');c.querySelectorAll('.wisp,.fgwind').forEach(x=>x.style.animation='none');e.appendChild(c)});
addEventListener('resize',layout);layout();

/* ===== ba ô tranh: mặt nạ lấy từ chính lớp khung, ảnh nằm DƯỚI khung ===== */
const PD={};
['L','C','R'].forEach(k=>{
  const p=PANELS[k],el=document.querySelector('.panel[data-k='+k+']');
  el.style.cssText+=';left:'+p.box[0]+'px;top:'+p.box[1]+'px;width:'+p.box[2]+'px;height:'+p.box[3]+'px';
  el.innerHTML='<div class="plane" style="width:'+p.w+'px;height:'+p.h+'px;transform:'+p.m+'"><div class="shift"></div></div>';
  PD[k]={el,plane:el.firstChild,shift:el.firstChild.firstChild,w:p.w,h:p.h};
});
let panelEls=PD,KEYS=['L','C','R'];const OFF={L:-1,C:0,R:1,M:0};
let ytPlaying=null;
function makeSlot(item,k){
  const s=document.createElement('div');s.className='slot';
  const im=new Image();im.decoding='async';im.draggable=false;im.src=item.img;im.alt=(k==='C'||k==='M')?item.alt:'';if(k!=='C'&&k!=='M')im.setAttribute('aria-hidden','true');
  s.appendChild(im);
  if(item.type==='video'){
    if(k==='C'||k==='M'){
      const b=document.createElement('button');b.type='button';b.className='vplay';b.setAttribute('aria-label',PG.playLabel+': '+item.caption);
      b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2.5v19l17-9.5z"/></svg>';
      b.addEventListener('click',()=>playVideo(s,item));
      b.addEventListener('pointerdown',e=>e.stopPropagation());
      s.appendChild(b);
    }else{const t=document.createElement('span');t.className='vbadge';t.textContent=PG.videoText;s.appendChild(t)}
  }
  return s;
}
function playVideo(slot,item){
  stopVideo();
  const f=document.createElement('iframe');
  f.src='https://www.youtube-nocookie.com/embed/'+item.vid+'?autoplay=1&rel=0&playsinline=1&modestbranding=1';
  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.title=item.caption||PG.videoText;f.referrerPolicy='strict-origin-when-cross-origin';
  slot.querySelectorAll('.vplay').forEach(b=>b.style.display='none');slot.appendChild(f);ytPlaying=f;
}
function stopVideo(){if(ytPlaying){const s=ytPlaying.parentNode;ytPlaying.remove();ytPlaying=null;if(s)s.querySelectorAll('.vplay').forEach(b=>b.style.display='')}}
function fillPanels(animDir){
  stopVideo();
  KEYS.forEach(k=>{
    const P=panelEls[k],item=itemAt(idx+OFF[k]);
    const old=[...P.shift.children];
    if(!item){old.forEach(o=>o.remove());return}
    const s=makeSlot(item,k);P.shift.appendChild(s);
    if(!animDir||RM){old.forEach(o=>o.remove());
      if(animDir&&RM)s.animate([{opacity:0},{opacity:1}],{duration:200});return}
    const dx=P.w*(k==='M'?.03:.12)*animDir;
    old.forEach(o=>{o.style.zIndex=1;const a=o.animate([{transform:'translate3d(0,0,0)',opacity:1},{transform:'translate3d('+(-dx)+'px,0,0)',opacity:0}],{duration:520,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});a.onfinish=()=>o.remove();setTimeout(()=>o.isConnected&&o.remove(),700)});
    s.style.zIndex=2;s.animate([{transform:'translate3d('+dx+'px,0,0)',opacity:0},{transform:'translate3d(0,0,0)',opacity:1}],{duration:520,easing:'cubic-bezier(.2,.7,.2,1)'});
  });
  paintText(animDir);
}
const capEl=$('cap'),capT=$('capt'),capN=$('capn'),live=$('live');
function paintText(anim){
  const it=ITEMS[mod(idx)],n=mod(idx)+1;
  const set=()=>{capT.textContent=it.caption;capN.textContent=PG.counterText.replace('{n}',n).replace('{total}',N);capEl.classList.remove('swap')};
  if(anim&&!RM){capEl.classList.add('swap');setTimeout(set,180)}else set();
  live.textContent=PG.announceText.replace('{n}',n).replace('{total}',N).replace('{caption}',it.caption||it.alt);
}

/* ===== hiệu ứng sách: MÓC bookFx (code = lật trang CSS tạm | frames = chuỗi ảnh trong suốt) ===== */
const fxEl=$('fx'),pgR=fxEl.querySelector('.pgw.r'),pgL=fxEl.querySelector('.pgw.l'),sparks=$('sparks');
const BX={type:'code',frames:null,cv:null,ctx:null,fps:C.bookFx.fps||14,idleTimer:0,box:null};
const codeFx={
  render(dir,t){
    const th=t*Math.PI,c=Math.cos(th),sn=Math.sin(th),on=dir>0?pgR:pgL,off=dir>0?pgL:pgR;
    off.style.opacity=0;
    if(t<=.002){on.style.opacity=0;return}
    on.style.opacity=t>.84?Math.max(0,1-(t-.84)/.16):1;
    on.style.transform='translate3d(0,'+(-13*sn)+'px,0) scaleX('+c+') skewY('+(dir*-5*sn)+'deg)';
    on.lastChild.style.opacity=Math.min(1,sn*1.3);
  },
  clear(){pgR.style.opacity=0;pgL.style.opacity=0}
};
const frameFx={
  render(dir,t){
    const arr=dir>0?BX.frames.flipNext:BX.frames.flipPrev;if(!arr||!arr.length){codeFx.render(dir,t);return}
    const n=arr.length,u=Math.max(0,Math.min(1,t))*(n-1),i0=Math.floor(u),i1=Math.min(n-1,i0+1),fr=u-i0;
    BX.ctx.clearRect(0,0,BX.cv.width,BX.cv.height);BX.ctx.globalAlpha=1;BX.ctx.drawImage(arr[i0],0,0);
    if(fr>.02&&i1!==i0){BX.ctx.globalAlpha=fr;BX.ctx.drawImage(arr[i1],0,0);BX.ctx.globalAlpha=1}
    BX.cv.style.transition='none';BX.cv.style.opacity=Math.min(1,t/.1);   /* hoà vào từ sách của bệ đá */
  },
  clear(){if(BX.cv){BX.cv.style.transition='opacity .25s ease';BX.cv.style.opacity=0}}
};
const fx=()=>BX.type==='frames'?frameFx:codeFx;
async function initBookFx(){
  const cfg=C.bookFx;if(cfg.type!=='frames')return;
  try{
    let fr=cfg.frames||{},man=null;
    if(!(fr.flipNext&&fr.flipNext.length)){
      const r=await fetch(MemoriContent.url(cfg.manifest,'')+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;man=await r.json();
      const base=cfg.manifest.replace(/[^/]*$/,'');
      const pat=(clip)=>{const c=man.clips[clip];if(!c)return[];return Array.from({length:c.count},(_,i)=>base+(c.pattern||(clip+'_{i}.webp')).replace('{i}',String(i).padStart(c.pad||3,'0')))};
      fr={flipNext:pat('flipNext'),flipPrev:pat('flipPrev'),open:pat('open'),idle:pat('idle')};
      BX.fps=man.fps||BX.fps;BX.box=man.bbox||null;
    }
    const load=u=>new Promise(res=>{const im=new Image();im.onload=()=>(im.decode?im.decode():Promise.resolve()).then(()=>res(im),()=>res(im));im.onerror=()=>res(null);im.src=u});
    const out={};for(const k of['flipNext','flipPrev','open','idle'])out[k]=(await Promise.all((fr[k]||[]).map(load))).filter(Boolean);
    if(!out.flipNext.length)throw 0;
    const f0=out.flipNext[0];BX.cv=$('fxc');BX.cv.width=f0.naturalWidth;BX.cv.height=f0.naturalHeight;BX.ctx=BX.cv.getContext('2d');BX.cv.style.display='block';BX.cv.style.opacity=0;
    const b=BX.box||[fxEl.offsetLeft,fxEl.offsetTop,f0.naturalWidth,f0.naturalHeight];
    fxEl.style.cssText+=';left:'+b[0]+'px;top:'+b[1]+'px;width:'+b[2]+'px;height:'+b[3]+'px';
    BX.cv.style.width=b[2]+'px';BX.cv.style.height=b[3]+'px';
    BX.frames=out;BX.type='frames';BX.nat=[f0.naturalWidth,f0.naturalHeight];BX.anchor=man&&man.anchor?man.anchor:{cx:835,bottom:829,baseWidth:204};
    selectCv();placeMobileFx();
  }catch(e){BX.type='code'}
}
function selectCv(){
  if(!BX.frames)return;
  const m=MODE==='m'&&MOB;BX.cv=m?$('mfxc'):$('fxc');
  BX.cv.width=BX.nat[0];BX.cv.height=BX.nat[1];BX.ctx=BX.cv.getContext('2d');BX.cv.style.display='block';BX.cv.style.opacity=0;
}
/* sprite lật sách trên bản điện thoại: cùng hộp so với đáy sách (anchor trong manifest) nhân tỉ lệ sách điện thoại/sách desktop */
function placeMobileFx(){
  if(!PR||!MOB||!BX.frames||!BX.box)return;
  const a=BX.anchor,K=MB.baseWidth/a.baseWidth,b=BX.box,e=$('mfx');
  e.style.left=(MB.cx-(a.cx-b[0])*K)+'px';e.style.top=(MB.bottom-(a.bottom-b[1])*K)+'px';e.style.width=(b[2]*K)+'px';e.style.height=(b[3]*K)+'px';
  if(MODE==='m')selectCv();
}
/* open / idle (chỉ khi type=frames): open phát một lần sau khi tải xong; idle lặp chậm khi không kéo */
let clipTimer=0;
function stopClip(){clearTimeout(clipTimer);clipTimer=0}
function playClip(arr,loop,fps,done){
  stopClip();if(!arr||!arr.length||BX.type!=='frames'||RM){done&&done();return}
  let i=0;const dt=1000/(fps||BX.fps||24);
  const tick=()=>{
    if(drag||flipT>0){stopClip();return}
    BX.cv.style.display='block';BX.ctx.clearRect(0,0,BX.cv.width,BX.cv.height);BX.ctx.drawImage(arr[i],0,0);i++;
    if(i>=arr.length){if(loop){i=0}else{BX.cv.style.display='none';clipTimer=0;done&&done();return}}
    clipTimer=setTimeout(tick,dt);
  };tick();
}
function startIdle(){if(BX.type==='frames'&&BX.frames.idle&&BX.frames.idle.length&&!document.hidden)playClip(BX.frames.idle,true,Math.min(12,BX.fps))}
function spawnSparks(dir){
  if(RM)return;
  for(let i=0;i<12;i++){
    const d=document.createElement('i');d.className='spk';
    const mm=MODE==='m'&&MOB,kk=mm?MB.baseWidth/((BX.anchor||{baseWidth:204}).baseWidth):1,fl=mm?(BX.box?BX.box[0]:685):(parseFloat(fxEl.style.left)||700),ft=mm?(BX.box?BX.box[1]:700):(parseFloat(fxEl.style.top)||740),x=(835-fl+dir*(18+Math.random()*78))*kk,y=(766-ft+Math.random()*52)*kk;d.style.left=x+'px';d.style.top=y+'px';(mm?$('msparks'):sparks).appendChild(d);
    const a=d.animate([{opacity:0,transform:'translate3d(0,0,0) scale(.5)'},{opacity:.9,offset:.25},{opacity:0,transform:'translate3d('+(dir*(8+Math.random()*26)*kk)+'px,'+((-22-Math.random()*38)*kk)+'px,0) scale(1.1)'}],{duration:760+Math.random()*500,delay:Math.random()*240,easing:'ease-out'});
    a.onfinish=()=>d.remove();
  }
}
/* animation tiến trình lật t: 0..1 (rAF) */
let flipT=0,flipDir=1,flipRaf=0;
function animateFlip(to,ms,done){
  cancelAnimationFrame(flipRaf);const from=flipT,t0=performance.now();
  if(RM||ms<=0){flipT=to;fx().render(flipDir,flipT);if(to<=0||to>=1)fx().clear();done&&done();return}
  const step=now=>{
    let u=Math.min(1,(now-t0)/ms);u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    flipT=from+(to-from)*u;fx().render(flipDir,flipT);
    if(now-t0<ms)flipRaf=requestAnimationFrame(step);else{flipT=to;fx().render(flipDir,flipT);if(to<=0||to>=1){fx().clear();flipT=0}done&&done()}
  };flipRaf=requestAnimationFrame(step);
}

/* ===== đổi mục ===== */
let lastGo=0;
function go(dir,steps){
  steps=steps||1;if(!LOOP&&(idx+dir*steps<0||idx+dir*steps>N-1)){const c=Math.max(0,Math.min(N-1,idx+dir*steps));if(c===idx){snapBack();return}steps=Math.abs(c-idx)}
  idx=LOOP?mod(idx+dir*steps):idx+dir*steps;lastGo=performance.now();
  flipDir=dir;
  fillPanels(dir);
  spawnSparks(dir);
  document.dispatchEvent(new CustomEvent('memori:sound',{detail:{page:'lopf1',name:'flip',dir:dir}}));   /* móc âm thanh toàn cục sau này */
  if(boCtl){boCtl.react('surprised',900)}
  stopClip();animateFlip(1,BX.type==='frames'?Math.round(1000*(BX.frames.flipNext.length)/BX.fps):520,()=>{flipT=0;startIdle()});
  releaseShift();
}
$('next').addEventListener('click',()=>go(1));$('prev').addEventListener('click',()=>go(-1));

/* ===== kéo trên sách ===== */
const book=$('book');
let drag=null;
const thr=()=>Math.max(24,C.drag.threshold);
function setShift(p){KEYS.forEach(k=>{const P=panelEls[k];P.shift.classList.remove('rel');P.shift.style.transform='translate3d('+(p*P.w*(k==='M'?.018:.07))+'px,0,0)'})}
function releaseShift(){KEYS.forEach(k=>{const P=panelEls[k];P.shift.classList.add('rel');P.shift.style.transform='translate3d(0,0,0)'})}
function snapBack(){animateFlip(0,260);releaseShift()}
function bindBook(book){
book.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  cancelAnimationFrame(flipRaf);stopClip();
  drag={id:e.pointerId,x0:e.clientX,x:e.clientX,t:performance.now(),v:0,moved:false};
  try{book.setPointerCapture(e.pointerId)}catch(_){}
  book.classList.add('grab');view.classList.add('hot');
  if(boCtl)boCtl.look(0);
});
book.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const now=performance.now(),dx=e.clientX-drag.x0;
  drag.v=.8*drag.v+.2*((e.clientX-drag.x)/Math.max(1,now-drag.t));drag.x=e.clientX;drag.t=now;
  if(Math.abs(dx)>4)drag.moved=true;
  if(!drag.moved)return;
  const dir=dx<0?1:-1,p=Math.min(1,Math.abs(dx)/(thr()*1.7));
  if(dir!==flipDir||flipT===0){flipDir=dir;codeFx.clear();frameFx.clear()}
  flipT=p*.5;fx().render(flipDir,flipT);setShift(-dir*p);
  if(boCtl)boCtl.look(dir>0?-1:1);
});
function endDrag(e,cancel){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  const dx=drag.x-drag.x0,v=drag.v,moved=drag.moved;drag=null;
  book.classList.remove('grab');if(!matchMedia('(hover:hover)').matches||!book.matches(':hover'))view.classList.remove('hot');
  if(boCtl)boCtl.look(0);
  if(cancel||!moved){if(flipT>0)snapBack();return}
  const dir=dx<0?1:-1,ad=Math.abs(dx);
  const flick=C.drag.inertia&&Math.abs(v)>C.drag.flick&&ad>thr()*C.drag.snap;
  if(ad>=thr()||flick){const steps=(C.drag.inertia&&Math.abs(v)>2.4&&ad>thr())?2:1;flipDir=dir;go(dir,steps)}
  else snapBack();
}
book.addEventListener('pointerup',e=>endDrag(e,false));
book.addEventListener('pointercancel',e=>endDrag(e,true));
book.addEventListener('lostpointercapture',e=>{if(drag)endDrag(e,true)});
book.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')view.classList.add('hot')});
book.addEventListener('pointerleave',e=>{if(!drag&&!book.matches(':focus-visible'))view.classList.remove('hot')});
book.addEventListener('focus',()=>{if(book.matches(':focus-visible'))view.classList.add('hot')});
book.addEventListener('blur',()=>{if(!drag)view.classList.remove('hot')});
book.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();go(1)}});
}
bindBook(book);
/* phím mũi tên ở mọi nơi; bánh xe chuột */
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}
});
let wheelAcc=0,wheelT=0;
view.addEventListener('wheel',e=>{
  if(C.drag.wheel===false)return;e.preventDefault();
  const now=performance.now();if(now-wheelT<C.drag.wheelCooldown)return;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;wheelAcc+=d;
  if(Math.abs(wheelAcc)>40){go(wheelAcc>0?1:-1);wheelAcc=0;wheelT=now}
},{passive:false});
view.addEventListener('contextmenu',e=>{if(drag)e.preventDefault()});

/* ===== chuyển động nền rất nhẹ ===== */
(function ambient(){
  if(RM)return;
  const mo=$('motes'),pts=[[800,214,-6],[868,206,8],[838,176,3],[784,240,-9],[890,236,10],[826,258,4]];
  pts.forEach((p,i)=>{const m=document.createElement('i');m.className='mote';m.style.cssText='left:'+p[0]+'px;top:'+p[1]+'px;--mx:'+p[2]+'px;animation-delay:'+(-i*1.15)+'s;animation-duration:'+(5.8+i*.45)+'s';mo.appendChild(m)});
  (function tick(){setTimeout(()=>{if(!document.hidden){[$('glint'),$('mglint')].forEach(g=>{if(g){g.classList.remove('on');void g.offsetWidth;g.classList.add('on')}})}tick()},3000+Math.random()*3000)})();
})();
document.addEventListener('visibilitychange',()=>{document.documentElement.style.setProperty('--paused',document.hidden?'1':'0')});

/* ===== Bọ (sprite của trang chủ), đứng trên đá chiếu ===== */
try{boCtl=BoIdle.create({every:[5,12]});BoIdle.mount($('bo'),boCtl,{lazy:false})}catch(e){}
if(MOB&&!MOB.bo){try{BoIdle.mount($('mbo'),boCtl,{lazy:false})}catch(e){}MOB.bo=1}

/* ===== tải thật: mọi ảnh + giải mã + phông chữ + 8 dáng Bọ ===== */
function loadGate(){
  const warm=[];window.__warm=warm;
  const loader=document.querySelector('.loader'),bar=loader.querySelector('.loader-track span');
  const dec=im=>new Promise(r=>{const go=()=>{(im.decode?im.decode():Promise.resolve()).then(r,r)};if(im.complete&&im.naturalWidth)go();else if(im.complete)r();else{im.addEventListener('load',go,{once:true});im.addEventListener('error',()=>r(),{once:true})}});
  const list=[...document.images].map(dec);
  /* chỉ chờ hình đang hiện + 2 hình kề (cả hai bên); các hình còn lại nạp nền sau khi mở trang */
  const near=new Set([mod(idx-1),mod(idx),mod(idx+1)]);
  ITEMS.slice(0,9).forEach((it,i)=>{const im=new Image();if(near.has(i)){im.src=it.img;list.push(dec(im))}else warm.push([im,it.img])});
  if(MODE!=='m')['maskL','maskC','maskR'].forEach(m=>{const im=new Image();im.src='assets/lopf1/img/'+m+'.webp';list.push(dec(im))});
  try{list.push(BoIdle.preload())}catch(e){}
  list.push(initBookFx());
  const sample=PG.title+PG.subtitle+PG.hint+ITEMS.map(i=>i.caption).join('')+' Về trang Bọ Bản đồ trang';
  ['400 40px "Oooh Baby"','400 16px "Be Vietnam Pro"','500 16px "Be Vietnam Pro"'].forEach(f=>list.push(document.fonts&&document.fonts.load?document.fonts.load(f,sample).catch(()=>{}):Promise.resolve()));
  let n=0;const tot=list.length;
  list.forEach(p=>p.then(()=>{n++;bar.style.transform='scaleX('+Math.max(.04,n/tot*.96)+')'}));
  const all=Promise.all(list),timeout=new Promise(r=>setTimeout(r,30000)),minShow=new Promise(r=>setTimeout(r,RM?200:900));
  const raf2=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  return Promise.all([minShow,Promise.race([all,timeout])]).then(raf2).then(()=>{bar.style.transform='scaleX(1)';loader.classList.add('is-done');warm.forEach(w=>{w[0].src=w[1]});setTimeout(()=>loader.remove(),1000)});
}
PR=true;if(MODE!=='m')loadDesk();if(MODE==='m')applyMode();else fillPanels(0);
await loadGate();
window.__lopf1={get index(){return mod(idx)},go,get fxType(){return BX.type},items:ITEMS,get scale(){return S}};
document.documentElement.dataset.ready='1';
if(BX.type==='frames')playClip(BX.frames.open,false,BX.fps,startIdle);
/* thiết bị cảm ứng: gợi ý hiện 5 giây rồi tắt (chuột thì chỉ hiện khi rê) */
if(!matchMedia('(hover:hover)').matches){const h=$('hud');h.classList.add('showhint');setTimeout(()=>h.classList.remove('showhint'),5200)}
})();
