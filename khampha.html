:root{
  color-scheme:dark;
  --script:'Oooh Baby','Segoe Script','Bradley Hand',cursive;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --night:#021e5f;--cream:#fbf1d6;--glow:#ffd98a;--card:rgba(8,16,58,.82);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--night);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);color:var(--cream);-webkit-tap-highlight-color:transparent}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
#view{position:fixed;inset:0;overflow:hidden;overflow:clip;background:var(--night);user-select:none;-webkit-user-select:none}
#view.pan{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none}
#view.pan::-webkit-scrollbar{display:none}
#spacer{position:absolute;left:0;top:0;height:1px;pointer-events:none}
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0}
.L{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none;user-select:none}
.scenery{position:absolute;left:0;top:0;width:1672px;height:941px}
.ext{position:absolute;width:1672px;height:941px;overflow:hidden;background-size:1672px 941px;background-repeat:no-repeat}
.ext::after{content:'';position:absolute;inset:0;pointer-events:none}
#extT::after,#extTL::after,#extTR::after{background:linear-gradient(180deg,rgba(2,30,95,0) 0,rgba(2,30,95,.55) 50px,rgba(2,30,95,.88) 130px,#021e5f 220px)}
#extB::after,#extBL::after,#extBR::after{background:linear-gradient(0deg,rgba(2,30,95,0) 0,rgba(2,30,95,.55) 50px,rgba(2,30,95,.88) 130px,#021e5f 220px)}
#extL::after{background:linear-gradient(90deg,rgba(2,30,95,0) 0,rgba(2,30,95,.2) 60%,rgba(2,30,95,.5) 100%)}
#extR::after{background:linear-gradient(270deg,rgba(2,30,95,0) 0,rgba(2,30,95,.2) 60%,rgba(2,30,95,.5) 100%)}
#extL{left:-1669px;transform:scaleX(-1)}#extR{left:1669px;transform:scaleX(-1)}
#extT{top:-938px;transform:scaleY(-1)}#extB{top:938px;transform:scaleY(-1)}
#extTL{left:-1669px;top:-938px;transform:scale(-1,-1)}#extTR{left:1669px;top:-938px;transform:scale(-1,-1)}
#extBL{left:-1669px;top:938px;transform:scale(-1,-1)}#extBR{left:1669px;top:938px;transform:scale(-1,-1)}
/* mây xa trôi rất chậm (chỉ transform) */
#far{position:absolute;left:0;top:0;width:1672px;height:941px;animation:drift 70s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-5px,1px,0)}to{transform:translate3d(6px,-2px,0)}}
/* sao lấp lánh: ít, chậm, mờ */
.tw{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,rgba(255,248,222,.9),rgba(255,236,180,.28) 45%,rgba(255,236,180,0));animation:tw 4.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0}50%{opacity:.5}}
/* công trình: lớp tắt đèn (04) luôn hiện; bản bật đèn (05) cắt sẵn từng công trình, chỉ đổi opacity */
#off{left:0;top:0;width:1672px;height:941px}
.lit{opacity:0;transition:opacity var(--fade,450ms) ease}
.lit.on{opacity:1}
/* vùng bấm: đa giác đo từ chênh lệch 04/05; clip-path cũng cắt luôn vùng nhận chuột */
.hs{position:absolute;display:block;margin:0;padding:0;border:0;background:transparent;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hs.nolink{cursor:default}
#bo{position:absolute;left:80px;top:686px;width:81px;height:96px;pointer-events:none}
/* chữ thật bằng DOM */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#ttl{position:absolute;left:0;right:0;top:max(10px,env(safe-area-inset-top,0px));text-align:center;padding:0 96px}
#ttl h1{margin:0;font:400 clamp(34px,6vh,64px)/1 var(--script);color:var(--cream);text-shadow:0 2px 12px rgba(4,10,50,.95),0 0 3px rgba(4,10,50,.9)}
#ttl p{margin:4px 0 0;font:500 clamp(13px,1.8vh,16px)/1.4 var(--sans);color:#e9e1c8;text-shadow:0 1px 8px rgba(4,10,50,.95),0 0 3px rgba(4,10,50,.9)}
@media (max-width:700px){#ttl{top:calc(max(10px,env(safe-area-inset-top,0px)) + 44px);padding:0 16px}#ttl h1{font-size:clamp(30px,9vw,42px)}#ttl p{text-wrap:balance;font-size:13px}}
@media (max-height:520px){#ttl p{display:none}#ttl h1{font-size:38px}}
#ttl p:empty,#hint:empty,.tip em:empty{display:none}
#hint{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));text-align:center;padding:0 20px;font:500 14px/1.4 var(--sans);color:#e9e1c8;text-shadow:0 1px 8px rgba(4,10,50,.95);opacity:0;transition:opacity .5s ease}
#hud.showhint #hint{opacity:1}
/* thẻ chú thích: thẻ riêng cho từng công trình, nằm trong HUD để chữ không bị co theo cảnh */
.tip{position:absolute;left:0;top:0;width:max-content;max-width:min(280px,calc(100vw - 24px));padding:10px 14px 11px;border-radius:12px;background:var(--card);color:var(--cream);text-align:left;opacity:0;transform:translate3d(0,6px,0);transition:opacity .3s ease,transform .3s ease;will-change:opacity,transform;box-shadow:0 8px 28px rgba(2,8,40,.5)}
.tip.on{opacity:1}
.tip b{display:block;font:500 16px/1.3 var(--sans);margin:0 0 3px}
.tip span{display:block;font:400 13px/1.5 var(--sans);color:#e2d9bd}
.tip em{display:block;margin-top:6px;font:500 12px/1.3 var(--sans);font-style:normal;color:var(--glow);letter-spacing:.02em}
.tip.soon em{color:#c9cfee}
/* thẻ tác phẩm: tên, ảnh đại diện, mô tả, "Vào xem"; đặt cạnh ngôi nhà đang sáng, không che hết nó */
.wc{position:absolute;left:0;top:0;width:300px;padding:10px 10px 14px;border-radius:16px;background:rgba(7,14,52,.93);color:var(--cream);border:1px solid rgba(255,217,138,.34);box-shadow:0 14px 40px rgba(2,8,40,.6),0 0 0 1px rgba(2,8,40,.5);opacity:0;visibility:hidden;transform:translate3d(0,8px,0);transition:opacity .28s ease,transform .28s ease,visibility 0s .28s;pointer-events:auto;will-change:opacity,transform}
.wc.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s ease,transform .28s ease}
.wc-img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#0b1544}
.wc-img[hidden]{display:none}
.wc-t{padding:10px 4px 0}
.wc-k{display:block;font:500 12px/1.3 var(--sans);color:var(--glow);letter-spacing:.02em}
.wc-k:empty{display:none}
.wc h2{margin:2px 0 4px;font:500 18px/1.3 var(--sans);color:var(--cream)}
.wc p{margin:0;font:400 14px/1.5 var(--sans);color:#e2d9bd;display:-webkit-box;-webkit-line-clamp:4;line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wc-go{display:inline-flex;align-items:center;gap:8px;margin-top:12px;min-height:44px;padding:0 20px;border-radius:99px;background:var(--glow);color:#2a1d08;font:500 15px/1 var(--sans);text-decoration:none;-webkit-tap-highlight-color:transparent}
.wc-go:hover{background:#ffe6b0}
.wc-go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wc-x{position:absolute;right:2px;top:2px;width:44px;height:44px;padding:0;border:0;background:transparent;color:var(--cream);cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.wc-x i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(5,10,40,.72);box-shadow:0 0 0 1px rgba(255,244,214,.25)}
.wc-x svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.wc-x:hover i{background:rgba(5,10,40,.92)}
.wc-go:focus-visible,.wc-x:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.wc.row{display:grid;grid-template-columns:116px 1fr;column-gap:12px;align-items:start;padding:10px 12px 10px 10px}
.wc.row .wc-img{aspect-ratio:4/3}
.wc.row .wc-t{padding:0 30px 0 0}
.wc.row h2{font-size:16px;margin:1px 0 3px}
.wc.row p{font-size:13px;line-height:1.45;-webkit-line-clamp:3;line-clamp:3}
.wc.row .wc-go{margin-top:8px;min-height:44px;padding:0 18px}
.wc.row .wc-x{right:0;top:0}
@media (prefers-reduced-motion:reduce){.wc{transition-duration:.01s!important}}
#back{position:fixed;z-index:60;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));min-height:44px;display:flex;align-items:center;padding:0 6px;color:var(--cream);font:500 16px/1 var(--sans);text-decoration:none;text-shadow:0 1px 8px rgba(4,10,50,.95),0 0 3px rgba(4,10,50,.9);pointer-events:auto}

/* màn hình tải (kiểu trang Bọ) */
.loader{position:fixed;inset:0;z-index:2147483100;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#173a30 0%,#0b1918 60%,#06100e 100%);transition:opacity .9s ease,visibility .9s}
.loader.is-done{opacity:0;visibility:hidden;pointer-events:none}
.loader-inner{display:grid;justify-items:center;gap:14px;padding:0 24px;text-align:center}
.loader-logo{display:flex;flex-direction:column;align-items:center;font:400 clamp(44px,8vw,64px)/.8 "Oooh Baby","Segoe Script",cursive;color:#f8ebcb;text-shadow:0 0 18px #ffd98a40}
.loader-logo small{margin-top:10px;font:400 10px/1 Georgia,serif;letter-spacing:.5em}
.loader-text{margin:4px 0 0;font:400 14px/1.4 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;color:#d9cfae}
.loader-track{width:min(220px,60vw);height:2px;border-radius:2px;background:#f4e7c41f;overflow:hidden}
.loader-track span{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(.04);background:linear-gradient(90deg,#d9c27a,#fff3c8);box-shadow:0 0 8px #ffd98a;transition:transform .4s ease}
.loader-flies{position:relative;width:160px;height:40px}
.loader-flies i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe8a4;box-shadow:0 0 10px 3px #ffd97d88;animation:loader-fly 3.2s ease-in-out infinite}
.loader-flies i:nth-child(1){left:10%;top:60%;animation-delay:-.4s}.loader-flies i:nth-child(2){left:32%;top:20%;animation-delay:-1.2s}
.loader-flies i:nth-child(3){left:52%;top:70%;animation-delay:-2s}.loader-flies i:nth-child(4){left:72%;top:30%;animation-delay:-.8s}.loader-flies i:nth-child(5){left:88%;top:65%;animation-delay:-2.6s}

/* tạm dừng khi tab ẩn; ?freeze=1 dừng mọi chuyển động nền (kiểm thử so điểm ảnh) */
html.paused *,html.still *,html.still *::before{animation-play-state:paused!important}

function ext(k,on){

ITEMS.forEach((it,idx)=>{

  tip.innerHTML='<b></b><span></span><em></em>';tip.firstChild.textContent=it.title;tip.children[1].textContent=it.desc;

  hs.addEventListener('blur',()=>{st.focus=false;sync()});

    if(it.work){e.preventDefault();if(lastPtr!=='touch'&&lastPtr!=='pen')openCard(st,lastPtr==='kbd');return}   /* nhà có tác phẩm: mở thẻ (cảm ứng xử lý ở pointerup) */
    if(st.go){st.go=false;if(!it.href)e.preventDefault();return}                   /* mở do chạm lần 2 (pointerup bên dưới) */
    if(lastPtr==='touch'||lastPtr==='pen'){e.preventDefault();return}              /* cảm ứng xử lý ở pointerup, không dựa vào click */

let lastPtr='';
document.addEventListener('keydown',()=>{lastPtr='kbd'},true);
/* chạm: tự nhận diện "tap" (di chuyển < 10px) ở pointerup nên kéo ngang cuộn cảnh không nhầm thành chạm; vùng nhận rộng hơn đa giác */
const inPoly=(x,y,P)=>{let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c};
function hitTest(cx,cy){
  const x=(cx+view.scrollLeft-OX)/S,y=(cy-OY)/S,pad=Math.max(10,22/S);let best=null,bd=1e9;

    const dx=Math.max(b[0]-x,0,x-b[2]),dy=Math.max(b[1]-y,0,y-b[3]),d=Math.hypot(dx,dy);

let down=null;

  const cw=card.offsetWidth,ch=card.offsetHeight,b=openSt.it.bb;
  const hx0=OX-view.scrollLeft+b[0]*S,hx1=OX-view.scrollLeft+b[2]*S,hy0=OY+b[1]*S,hy1=OY+b[3]*S;
  const top=$('ttl').getBoundingClientRect().bottom+6,g=12,bt=Math.max(12,0);
  const cand=narrow?[[(vw-cw)/2,vh-ch-bt],[(vw-cw)/2,top]]
    :[[(hx0+hx1)/2-cw/2,hy0-ch-g],[(hx0+hx1)/2-cw/2,hy1+g],[hx1+g,(hy0+hy1)/2-ch/2],[hx0-cw-g,(hy0+hy1)/2-ch/2]];
  let best=null,bo=1e12;
  cand.forEach(c=>{
    const x=Math.max(8,Math.min(vw-cw-8,c[0])),y=Math.max(top,Math.min(vh-ch-8,c[1]));
    const ov=Math.max(0,Math.min(x+cw,hx1)-Math.max(x,hx0))*Math.max(0,Math.min(y+ch,hy1)-Math.max(y,hy0));
    if(ov<bo-1){bo=ov;best=[x,y]}
  });
  card.style.left=Math.round(best[0])+'px';card.style.top=Math.round(best[1])+'px';
}
$('wcX').addEventListener('click',()=>closeCard(true));

/* thẻ chú thích đặt theo toạ độ màn hình của công trình (trên đầu nếu đủ chỗ, không thì dưới chân) */
function placeTips(){
  const ttlB=$('ttl').getBoundingClientRect().bottom;
  state.forEach(st=>{
    const tw=st.tip.offsetWidth,th=st.tip.offsetHeight;
    const cx=OX-view.scrollLeft+st.it.anchor[0]*S,top=OY+st.it.bb[1]*S,bot=OY+st.it.bb[3]*S;
    let x=cx-tw/2,y=top-th-10;
    const lim=ttlB+6;
    if(y<lim&&bot+10+th<=innerHeight-8)y=bot+10;
    if(y<lim)y=lim;
    x=Math.max(10,Math.min(innerWidth-tw-10,x));y=Math.max(8,Math.min(innerHeight-th-8,y));
    st.tip.style.left=Math.round(x)+'px';st.tip.style.top=Math.round(y)+'px';
  });
}
addEventListener('resize',layout);view.addEventListener('scroll',()=>{placeTips();placeCard()},{passive:true});layout();

/* ===== tải thật: mọi ảnh + giải mã + phông chữ + 8 dáng Bọ ===== */
function loadGate(){
  const loader=document.querySelector('.loader'),bar=loader.querySelector('.loader-track span');
  const dec=im=>new Promise(r=>{const go=()=>{(im.decode?im.decode():Promise.resolve()).then(r,r)};if(im.complete&&im.naturalWidth)go();else if(im.complete&&im.src)r();else{im.addEventListener('load',go,{once:true});im.addEventListener('error',()=>r(),{once:true})}});
  const list=[...document.images].filter(i=>i.src).map(dec);
  try{list.push(BoIdle.preload())}catch(e){}
  const sample=PG.title+PG.viewText+PG.subtitle+PG.subtitleTouch+PG.hint+ITEMS.map(i=>i.title+i.desc).join('')+PG.soonText+PG.openText+PG.tapText+' Về trang Bọ Bản đồ trang';
  ['400 40px "Oooh Baby"','400 16px "Be Vietnam Pro"','500 16px "Be Vietnam Pro"'].forEach(f=>list.push(document.fonts&&document.fonts.load?document.fonts.load(f,sample).catch(()=>{}):Promise.resolve()));
  let n=0;const tot=list.length;
  list.forEach(p=>p.then(()=>{n++;bar.style.transform='scaleX('+Math.max(.04,n/tot*.96)+')'}));
  const all=Promise.all(list),timeout=new Promise(r=>setTimeout(r,30000)),minShow=new Promise(r=>setTimeout(r,RM?200:400));
  const raf2=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  return Promise.all([minShow,Promise.race([all,timeout])]).then(raf2).then(()=>{bar.style.transform='scaleX(1)';loader.classList.add('is-done');setTimeout(()=>loader.remove(),1000)});
}
const t0=performance.now();
