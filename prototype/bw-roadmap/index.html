<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbfbfa">
<title>Lộ trình Me.Mori (bản mẫu đen trắng)</title>
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="img/bg-bw.webp">
<link rel="stylesheet" href="style.css">
<script src="../../assets/content-loader.js"></script>
<script>
  /* content-loader tải 'assets/content/…' theo đường dẫn tương đối của trang; trang mẫu nằm sâu hơn nên đổi gốc ở đây (không sửa tệp dùng chung). */
  (function () {
    var f = window.fetch;
    if (typeof f !== 'function') return;
    window.fetch = function (input, init) {
      if (typeof input === 'string' && input.indexOf('assets/content/') === 0) input = '../../' + input;
      return f.call(this, input, init);
    };
  })();
  MemoriContent.prefetch("roadmap"); MemoriContent.prefetch("site"); MemoriContent.prefetch("journey");
</script>
<script src="../../assets/yt-fast.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="hand" x="-4%" y="-6%" width="108%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="loader" role="status" aria-live="polite">
  <div class="loader-inner">
    <img class="loader-bo" src="../bw-bo/img/bo/idle.webp" alt="" width="112" height="112" draggable="false">
    <div class="loader-logo">Me.Mori<small>CLASS</small></div>
    <p class="loader-text">Bọ đang thắp đèn cho lộ trình…</p>
    <div class="loader-track" aria-hidden="true"><span></span></div>
  </div>
</div>

<nav class="np" id="np" aria-label="Trang gợi ý"></nav>
<a class="map-btn" id="mapBtn" href="../bw-map/" aria-label="Bản đồ trang">
  <img src="../../assets/sitemap/map-card.webp" alt="" width="320" height="196">
</a>

<div id="app" class="intro">
  <div class="g" id="bgG"><div class="gi" id="bgGI"><img class="l" id="bgImg" alt=""><div id="bgveil"></div></div></div>
  <div id="pfs">
  <div class="g" id="playerG"></div>
  <div id="pz" class="fade">
   <div id="pw">
    <div id="vwrap" aria-hidden="true"><div id="tram"></div></div>
    <div id="pui">
    <div id="vclick"></div>
    <div id="cc" aria-hidden="true"></div>
    <div id="spin"></div>
    <div id="msg" role="status"></div>
    <div id="nextbox"><span id="nexttxt"></span><button type="button" id="cancelNext" aria-label="Hủy tự chuyển chương">Hủy</button></div>
    <button type="button" id="bigplay" aria-label="Phát video"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <div id="bar">
      <div class="prog"><div class="tr"><div class="bf" id="buf"></div><div class="pl" id="played"></div></div>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Thanh tiến độ video"></div>
      <div class="row">
        <button type="button" class="cb" id="bPlay" aria-label="Phát"><svg viewBox="0 0 24 24"><path class="fillic" d="M8 5.5v13l11-6.5z"/></svg></button>
        <span id="time">--:--</span>
        <span class="sp"></span>
        <button type="button" class="cb" id="bMute" aria-label="Tắt tiếng"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path id="volWaves" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/><path id="volX" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
        <input type="range" id="vol" min="0" max="100" value="100" aria-label="Âm lượng">
        <button type="button" class="cb" id="bCC" aria-label="Phụ đề" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M10.4 10.3a2.1 2.1 0 1 0 0 3.4M16.6 10.3a2.1 2.1 0 1 0 0 3.4"/></svg></button>
        <button type="button" class="cb" id="bSet" aria-label="Cài đặt" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.6"/><path d="M12 2.4v3M12 18.6v3M2.4 12h3M18.6 12h3M5.2 5.2l2 2M16.8 16.8l2 2M18.8 5.2l-2 2M7.2 16.8l-2 2"/></svg></button>
        <button type="button" class="cb" id="bFs" aria-label="Toàn màn hình"><svg viewBox="0 0 24 24"><path id="fsIn" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
    </div>
    <div id="menu" role="group" aria-label="Cài đặt video" hidden>
      <div class="mt">Tốc độ phát</div>
      <div class="speeds" role="radiogroup" aria-label="Tốc độ phát"></div>
      <div class="qrow"><span>Chất lượng</span><span>Tự động</span></div>
    </div>
    </div>
    <div id="vborder" aria-hidden="true"></div>
   </div>
  </div>
  </div>
  <div class="g" id="scrollG"><div class="gi" id="scrollGI"></div></div>
  <div id="stext" class="fade" aria-live="polite"></div>
  <div id="sketch" class="fade" aria-hidden="true"><div class="fr"></div>
    <svg viewBox="0 0 155 90" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="112" cy="20" r="7"/><path d="M6 70c14-10 24-6 34-1s20-12 32-5 22 3 34-3 28 5 40-2"/><path d="M14 62c0-8 8-10 12-6 2-8 12-8 14 0 6-3 11 2 8 8M52 66c4-9 12-9 14 0"/><ellipse cx="116" cy="58" rx="9" ry="6.5"/><circle cx="104" cy="53" r="4.2"/><path d="M102 49l-4-6M106 49l1-7M110 63l-3 7M116 64l0 7M122 62l3 7M114 52l5-3"/></svg></div>
  <div id="deco" class="fade" aria-hidden="true"><svg viewBox="480 650 660 80" preserveAspectRatio="none" fill="none" stroke="#111" stroke-opacity=".75" stroke-width="1.3" stroke-linecap="round"><path d="M1015 704h86M1015 712h86M1015 720h60"/><path d="M900 719c36-3 68-10 94-24M994 695l-9-1M994 695l-4 8"/><path d="M497 669h64M497 681h56" stroke-width="2.4" stroke-opacity=".5"/></svg></div>
  <div id="seal" class="fade" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28" fill="#fbfbfa" stroke-width="2.6"/><circle cx="32" cy="32" r="22" stroke-width="1.4" stroke-dasharray="2.5 3"/><circle cx="32" cy="35" r="8.5" fill="#111"/><path d="M32 26.5v17" stroke="#fbfbfa" stroke-width="1.3"/><circle cx="29" cy="32" r="1.5" fill="#fbfbfa" stroke="none"/><circle cx="35" cy="32.5" r="1.5" fill="#fbfbfa" stroke="none"/><path d="M29 24.5c-1.5-3-3.5-4-5-4M35 24.5c1.5-3 3.5-4 5-4" stroke-width="1.6"/></svg></div>
  <div class="g" id="leafLG"><div class="gi" id="leafLGI"></div></div>
  <div class="g" id="leafRG"><div class="gi" id="leafRGI"></div></div>
  <div class="g" id="moundLG"><div class="gi" id="moundLGI"></div></div>
  <div class="g" id="chapG"><div class="gi" id="chapGI"></div></div>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<script src="app.js"></script>
</body>
</html>
