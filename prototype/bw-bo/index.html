<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbfbfa">
<title>Me.Mori Class — Bọ (bản mẫu đen trắng)</title>
<link rel="preload" as="image" href="img/bg-phone.webp" media="(max-width: 640px)">
<link rel="preload" as="image" href="img/bg-desktop.webp" media="(min-width: 641px)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="hand" x="-5%" y="-8%" width="110%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<main>
  <div class="stage" id="stage" aria-hidden="true">
    <div class="bg-layer">
      <picture>
        <source media="(min-width: 641px)" srcset="img/bg-desktop.webp">
        <img src="img/bg-phone.webp" alt="" decoding="async" fetchpriority="high">
      </picture>
    </div>
  </div>
  <div class="stage stage-bo" id="stageBo" aria-hidden="true">
    <div class="bo-pos">
      <div class="bo-fx" id="boFx">
        <div class="bo-body" id="boBody">
          <img id="boA" alt="" draggable="false">
          <img id="boB" alt="" draggable="false">
        </div>
      </div>
      <button class="bo-hit" id="boHit" type="button" tabindex="-1" aria-label="Bọ"></button>
    </div>
  </div>

  <a class="logo" href="index.html" aria-label="Me.Mori Class"><b>Me.Mori</b><small>CLASS</small></a>

  <a class="map-btn" id="mapBtn" href="../bw-map/" aria-label="Tham quan bản đồ">
    <img src="../../assets/sitemap/map-card.webp" alt="" width="320" height="196">
  </a>

  <section class="bubble" id="bubble" aria-live="polite" aria-label="Bọ nói">
    <div class="bubble-ink" aria-hidden="true">
      <div class="bubble-shape"></div>
      <svg class="bubble-tail" viewBox="0 0 46 40" aria-hidden="true">
        <path d="M10 -2 C 12 17, 8 30, 1 38 C 22 35, 36 22, 38 -2 Z" fill="#fbfbfa" stroke="none"/>
        <path d="M10 0 C 12 17, 8 30, 1 38 C 22 35, 36 22, 38 0" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <svg class="bubble-leaf" viewBox="0 0 44 30" aria-hidden="true">
      <path d="M2 28 C 8 10, 24 2, 42 3 C 38 18, 22 28, 2 28 Z" fill="#fbfbfa" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M5 26 C 16 18, 26 12, 40 4" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M40 4 C 42 1, 44 0, 44 0" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <div class="bubble-body" id="bubbleBody">
      <span class="label">Bọ</span>
      <p class="q" id="boQ"></p>
      <div class="say" id="boSay"></div>
    </div>
  </section>

  <form class="ask" id="ask" autocomplete="off" novalidate>
    <div class="ask-ink" aria-hidden="true"></div>
    <label class="sr" for="question">Câu hỏi của bạn</label>
    <input id="question" name="q" type="text" placeholder="Hỏi Me.Mori…" enterkeyhint="send" maxlength="300">
    <button type="submit" aria-label="Gửi câu hỏi">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 3.5 3.5 10.8l6.2 2.4 2.4 6.3 8.4-16Z" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/><path d="m9.7 13.2 4.6-4.1" stroke="#111" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </form>

  <div class="round-btns">
    <button class="round-btn" id="muteBtn" type="button" aria-pressed="false" aria-label="Bật âm thanh">
      <svg class="off-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 9.5h3.2L11.5 5.5v13l-4.8-4H3.5z" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/><path d="m15.5 9.5 5 5m0-5-5 5" stroke="#111" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="on-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 9.5h3.2L11.5 5.5v13l-4.8-4H3.5z" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 9a4.2 4.2 0 0 1 0 6M17.5 6.5a7.8 7.8 0 0 1 0 11" stroke="#111" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <a class="round-btn" id="nextBtn" href="../bw-map/" aria-label="Trang tiếp">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.5 6.5v11l8-5.5zM17.5 6.5v11" stroke="#111" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </a>
  </div>
</main>
<div class="veil" id="veil" aria-hidden="true"></div>

<!-- Nội dung trả lời: dùng lại đúng các tệp của trang thật -->
<script src="../../assets/content-loader.js"></script>
<script>
  /* content-loader tải 'assets/content/…' theo đường dẫn tương đối của trang; trang mẫu nằm sâu hơn nên đổi gốc ở đây (không sửa tệp dùng chung). */
  (function () {
    var f = window.fetch;
    if (typeof f !== 'function') return;
    window.fetch = function (input, init) {
      if (typeof input === 'string' && input.indexOf('assets/content/') === 0) input = '../../' + input;
      return f.call(this, input, init);
    };
  })();
  MemoriContent.prefetch("bo");MemoriContent.prefetch("bo-replies",8000);MemoriContent.prefetch("bo-faq",8000);
</script>
<script src="../../assets/bo-matcher.js"></script>
<script src="../../assets/bo-ai.js"></script>
<script src="../../assets/bo-replies.js"></script>
<script src="app.js"></script>
</body>
</html>
