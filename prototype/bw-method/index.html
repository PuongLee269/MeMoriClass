<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbfbfa">
<title>Phương pháp (bản mẫu đen trắng)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="../../assets/content-loader.js"></script>
<script>
  /* content-loader tải 'assets/content/…' theo đường dẫn tương đối của trang; trang mẫu nằm sâu hơn nên đổi gốc ở đây (không sửa tệp dùng chung). */
  (function () {
    var f = window.fetch;
    if (typeof f !== 'function') return;
    window.fetch = function (input, init) {
      if (typeof input === 'string' && input.indexOf('assets/content/') === 0) input = '../../' + input;
      return f.call(this, input, init);
    };
  })();
  MemoriContent.prefetch("method"); MemoriContent.prefetch("site"); MemoriContent.prefetch("journey");
</script>
<script src="../../assets/yt-fast.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="hand" x="-4%" y="-6%" width="108%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="loader" role="status" aria-live="polite">
  <div class="loader-inner">
    <img class="loader-bo" src="../bw-bo/img/bo/idle.webp" alt="" width="112" height="112" draggable="false">
    <div class="loader-logo">Me.Mori<small>CLASS</small></div>
    <p class="loader-text" id="ldText">Bọ đang dọn bàn đá…</p>
    <div class="loader-track" aria-hidden="true"><span id="ldBar"></span></div>
  </div>
</div>

<div id="bg" aria-hidden="true"><img id="bgimg" alt="" src="img/bg-bw.webp" decoding="async"><div id="bgveil"></div></div>
<main id="scene" aria-label="Bàn đá thí nghiệm"></main>
<div id="ui">
  <header id="head"><h1 id="pageTitle">Phương pháp</h1><p id="pageSub"></p></header>
  <section id="panel" class="panel" role="region" aria-labelledby="pTitle" tabindex="-1">
    <button class="pclose" id="pclose" type="button" aria-label="Đóng">×</button>
    <div class="pin">
      <img class="pimg" id="pimg" alt="" hidden>
      <h2 id="pTitle" tabindex="-1"></h2>
      <p class="ptext" id="ptext"></p>
      <div class="pvid" id="pvid" hidden></div>
    </div>
  </section>
  <p id="hint"></p>
  <p id="wrong" role="status"></p>
  <nav class="np" id="np" aria-label="Trang gợi ý"></nav>
  <a class="map-btn" id="mapBtn" href="../bw-map/" aria-label="Bản đồ trang">
    <img src="../../assets/sitemap/map-card.webp" alt="" width="320" height="196">
  </a>
  <div id="tools">
    <button class="pill ibtn" id="reset" type="button" aria-label="Xếp lại"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.6h-4.6"/></svg></button>
    <button class="pill ibtn" id="snd" type="button" aria-pressed="false" aria-label="Tắt âm thanh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor" stroke="none"/><g id="sndOn"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g id="sndOff" hidden><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
  </div>
  <div id="sr" aria-live="polite" role="status"></div>
</div>
<script src="app.js"></script>
</body>
</html>
