<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#191b3d" />
  <title>Me.mori Class — Ngọn lửa của bạn</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23191b3d'/%3E%3Cpath d='M32 10c-4 13 9 14 3 24-3-4-8-5-8-13-10 8-12 20-3 28 8 7 22 4 26-6 4-10-5-17-10-22 1 8-5 11-8 13 3-9-2-15 0-24Z' fill='%23ffbc65'/%3E%3C/svg%3E" />
  <style>
    :root { --ink:#f8efd8; --muted:#b5b2c8; --night:#171936; --night-2:#242454; --pink:#f39ab7; --gold:#ffbd68; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--night); color:var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    body { overflow:hidden; }
    button { font:inherit; color:inherit; cursor:pointer; }
    .app { position:relative; width:100vw; height:100vh; min-height:620px; overflow:hidden; background:radial-gradient(circle at 50% 35%, #33336b 0%, #1c1d42 45%, #111329 100%); }
    .app:before { content:""; position:absolute; inset:0; opacity:.13; pointer-events:none; background-image:radial-gradient(#fff 0.7px, transparent .7px); background-size:7px 7px; mix-blend-mode:screen; }
    .moon { position:absolute; width:180px; height:180px; right:11%; top:10%; border-radius:50%; background:#fff0c8; box-shadow:0 0 0 18px rgba(255,240,200,.05), 0 0 65px rgba(255,240,200,.18); opacity:.92; }
    .moon:after { content:""; position:absolute; width:24px;height:24px; border-radius:50%; background:#ded1b2; top:38px; left:46px; opacity:.35; box-shadow:48px 40px 0 7px #ded1b2, 20px 89px 0 3px #ded1b2; }
    .stars { position:absolute; inset:0; pointer-events:none; opacity:.78; background-image:radial-gradient(circle, #ffeec8 0 1.3px, transparent 1.8px),radial-gradient(circle, #b4c7ff 0 1px, transparent 1.5px); background-size:121px 97px, 173px 139px; background-position:20px 13px, 80px 51px; }
    .hud { position:absolute; z-index:8; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:24px clamp(18px,4vw,60px); pointer-events:none; }
    .brand { display:flex; align-items:center; gap:10px; font-family:Arial,sans-serif; font-size:14px; font-weight:800; letter-spacing:.19em; text-transform:uppercase; }
    .brand-mark { width:30px; height:30px; border:1px solid var(--gold); border-radius:50% 50% 46% 46%; display:grid; place-items:center; color:var(--gold); font-size:17px; }
    .chapter { color:var(--muted); font:600 12px Arial,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
    .scene { position:absolute; inset:0; overflow:hidden; }
    .ground { position:absolute; left:-5%; right:-5%; bottom:-17%; height:56%; background:#202949; border-radius:50% 50% 0 0 / 14% 14% 0 0; transform:rotate(-2deg); box-shadow:inset 0 18px 0 rgba(81,103,120,.12); }
    .hill { position:absolute; left:-14%; right:-10%; bottom:17%; height:27%; background:#2b3157; border-radius:50% 50% 0 0 / 24% 24% 0 0; transform:rotate(3deg); }
    .hill.back { bottom:28%; height:20%; background:#303460; opacity:.76; transform:rotate(-2deg); }
    .tree-line { position:absolute; left:0; right:0; bottom:30%; height:27%; opacity:.9; background:linear-gradient(150deg, transparent 0 8%, #1b2545 8% 13%, transparent 13% 22%, #1b2545 22% 28%, transparent 28% 39%, #1b2545 39% 47%, transparent 47% 56%, #1b2545 56% 64%, transparent 64% 74%, #1b2545 74% 80%, transparent 80%); clip-path:polygon(0 70%,5% 15%,11% 68%,17% 25%,23% 70%,30% 5%,37% 70%,43% 26%,50% 70%,57% 12%,63% 70%,70% 25%,77% 70%,84% 0,91% 70%,97% 26%,100% 70%,100% 100%,0 100%); }
    .vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 45%, rgba(8,10,27,.43) 100%); }
    .game-object { position:absolute; z-index:4; transform:translate(-50%,-50%); transition:opacity .4s, filter .4s; }
    .wood { width:86px; height:56px; }
    .wood svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 8px 6px rgba(0,0,0,.25)); transform:rotate(-9deg); }
    .wood-label,.fire-label { position:absolute; top:calc(100% + 10px); left:50%; transform:translateX(-50%); white-space:nowrap; color:#f8efd8; font:600 12px Arial,sans-serif; letter-spacing:.05em; opacity:.7; }
    .fire { width:88px; height:106px; filter:drop-shadow(0 0 22px rgba(255,181,88,.48)); }
    .fire svg { width:100%; height:100%; overflow:visible; animation:fire-breathe 1.15s ease-in-out infinite alternate; }
    @keyframes fire-breathe { from{transform:scale(.96) rotate(-2deg)} to{transform:scale(1.05) rotate(2deg)} }
    .fire.off { filter:none; opacity:.82; }
    .fire.off svg { animation:none; }
    .player { position:absolute; z-index:6; width:88px; height:120px; transform:translate(-50%,-76%); transition:filter .25s; pointer-events:none; }
    .player svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 10px 5px rgba(0,0,0,.3)); }
    .player.walking svg { animation:bob .35s ease-in-out infinite alternate; }
    @keyframes bob { from{transform:translateY(0)} to{transform:translateY(-5px)} }
    .portal { position:absolute; z-index:5; left:50%; top:52%; transform:translate(-50%,-50%) scale(.7); width:170px;height:220px; opacity:0; pointer-events:none; transition:opacity 1s, transform 1s; }
    .portal.open { opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; animation:portal-float 2.5s ease-in-out infinite; cursor:pointer; }
    @keyframes portal-float { 50% { margin-top:-8px; } }
    .portal svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 25px rgba(253,191,125,.8)); }
    .status { position:absolute; z-index:7; left:50%; bottom:32px; transform:translateX(-50%); min-width:240px; text-align:center; color:#fff6de; font:600 14px Arial,sans-serif; letter-spacing:.02em; opacity:.86; }
    .inventory { position:absolute; z-index:8; right:clamp(18px,4vw,60px); bottom:28px; display:flex; align-items:center; gap:10px; padding:10px 14px 10px 10px; border:1px solid rgba(255,239,201,.2); border-radius:999px; background:rgba(19,21,50,.46); backdrop-filter:blur(8px); font:600 12px Arial,sans-serif; color:var(--muted); }
    .inventory-icon { width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#303765;color:var(--gold); }
    .inventory.carrying { color:var(--gold); border-color:rgba(255,189,104,.55); }
    .intro { position:absolute; z-index:20; inset:0; display:grid; place-items:center; background:linear-gradient(160deg, rgba(22,23,53,.96), rgba(18,19,42,.97)); transition:opacity .7s, visibility .7s; }
    .intro.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .intro-card { width:min(540px,calc(100% - 36px)); text-align:center; animation:reveal .9s ease both; }
    @keyframes reveal { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
    .eyebrow { display:inline-flex; align-items:center; gap:9px; color:var(--gold); font:700 11px Arial,sans-serif; letter-spacing:.2em; text-transform:uppercase; }
    .eyebrow:before,.eyebrow:after { content:""; width:26px; height:1px; background:var(--gold); opacity:.7; }
    h1 { margin:22px 0 12px; color:#fff4da; font-size:clamp(36px,7vw,68px); line-height:1.03; font-weight:400; letter-spacing:-.045em; text-wrap:balance; }
    .intro-copy { margin:0 auto 30px; max-width:400px; color:#c5c2d2; font:16px/1.65 Arial,sans-serif; }
    .choices { display:flex; gap:15px; justify-content:center; }
    .choice { min-width:150px; padding:17px 22px; border-radius:16px; border:1px solid rgba(255,240,200,.22); background:rgba(255,255,255,.06); transition:.25s; }
    .choice:hover,.choice:focus-visible { transform:translateY(-4px); border-color:var(--gold); background:rgba(255,189,104,.12); }
    .choice strong { display:block; font-size:16px; font-weight:400; }
    .choice small { display:block; margin-top:5px; color:var(--muted); font:12px Arial,sans-serif; }
    .dialogue { position:absolute; z-index:18; inset:0; display:grid; place-items:center; text-align:center; pointer-events:none; opacity:0; transition:opacity .6s; background:radial-gradient(ellipse at center, rgba(18,20,53,.3), rgba(14,15,35,.72)); }
    .dialogue.show { opacity:1; }
    .dialogue p { max-width:760px; padding:24px; color:#fff3d3; font-size:clamp(32px,6vw,66px); line-height:1.08; font-style:italic; text-shadow:0 3px 28px rgba(255,196,106,.25); }
    .toast { position:absolute; z-index:16; left:50%; top:82px; transform:translate(-50%,-12px); padding:11px 18px; border:1px solid rgba(255,240,200,.15); border-radius:99px; background:rgba(19,20,46,.8); color:#f7e6be; font:600 13px Arial,sans-serif; opacity:0; transition:.35s; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .portal-copy { position:absolute; z-index:6; top:calc(52% + 120px); left:50%; transform:translateX(-50%); width:230px; text-align:center; color:#ffe6ad; font:700 12px Arial,sans-serif; text-transform:uppercase; letter-spacing:.12em; opacity:0; transition:opacity .8s 1s; }
    .portal-copy.show { opacity:1; }
    @media (max-width:650px) { .app{min-height:540px}.moon{width:110px;height:110px;right:8%;top:12%}.hud{padding:18px}.chapter{display:none}.status{bottom:24px;font-size:12px}.inventory{bottom:58px;right:18px}.choices{flex-direction:column;align-items:stretch;width:min(260px,100%);margin:0 auto}.choice{padding:14px}.dialogue p{font-size:34px}.ground{bottom:-9%;height:52%}.portal{width:140px;height:190px} }
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="Me.mori Class — trò chơi tìm ngọn lửa">
    <div class="moon" aria-hidden="true"></div><div class="stars" aria-hidden="true"></div>
    <header class="hud"><div class="brand"><span class="brand-mark">✦</span> me.mori</div><div class="chapter">Chương 01 · Tìm ngọn lửa</div></header>
    <section class="scene" id="scene" aria-label="Khu rừng đêm. Nhấp vào mặt đất để di chuyển nhân vật.">
      <div class="hill back"></div><div class="tree-line"></div><div class="hill"></div><div class="ground"></div>
      <div class="portal" id="portal" title="Cánh cổng"><svg viewBox="0 0 180 230" aria-hidden="true"><defs><linearGradient id="pg" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ffc06c"/><stop offset=".5" stop-color="#f090b0"/><stop offset="1" stop-color="#907ce0"/></linearGradient></defs><path d="M18 214V88C18 32 48 10 90 10s72 22 72 78v126" fill="none" stroke="#7e759e" stroke-width="14"/><path d="M38 213V91c0-43 20-62 52-62s52 19 52 62v122" fill="#182047" stroke="#ffd083" stroke-width="3"/><path d="M50 211V91c0-33 14-48 40-48s40 15 40 48v120" fill="url(#pg)" opacity=".72"/><path d="M78 210c-8-44 19-60 26-92 18 27 21 57-3 92Z" fill="#fff1bf" opacity=".86"/><circle cx="90" cy="25" r="5" fill="#fff1bf"/></svg></div>
      <div class="portal-copy" id="portalCopy">Cổng đã mở · chạm để bước tiếp</div>
      <div class="game-object wood" id="wood"><svg viewBox="0 0 100 70" aria-hidden="true"><g stroke="#321c2b" stroke-width="3"><path d="M19 18 77 29l-4 20-57-11Z" fill="#9d5e43"/><path d="m26 23 56 11-4 20-56-11Z" fill="#c0774a"/><ellipse cx="78" cy="44" rx="10" ry="14" fill="#e2955e" transform="rotate(-11 78 44)"/><path d="M76 37c5 1 7 4 6 9" fill="none"/></g></svg><span class="wood-label">củi khô</span></div>
      <div class="game-object fire off" id="fire"><svg viewBox="0 0 90 110" aria-hidden="true"><path d="M45 105C17 105 10 87 18 71c5-10 16-14 14-31 14 8 16 17 15 27 7-7 9-16 7-26 18 16 28 32 20 47-7 13-16 17-29 17Z" fill="#f2a65c" stroke="#42233a" stroke-width="3"/><path d="M45 95c-14 0-17-12-11-21 4-6 8-9 8-18 10 7 17 14 14 24-2 8-5 12-11 15Z" fill="#fff0a8" stroke="#9d5661" stroke-width="2"/><circle cx="26" cy="49" r="3" fill="#ffc974"/><circle cx="68" cy="57" r="2.5" fill="#ffc974"/></svg><span class="fire-label">ngọn lửa</span></div>
      <div class="player" id="player" aria-label="Nhân vật của bạn"></div><div class="vignette"></div>
    </section>
    <div class="status" id="status">Nhấp vào mặt đất để bắt đầu hành trình</div><div class="inventory" id="inventory"><span class="inventory-icon">✧</span><span id="inventoryText">Tay đang trống</span></div><div class="toast" id="toast"></div><div class="dialogue" id="dialogue"><p id="dialogueText"></p></div>
    <section class="intro" id="intro"><div class="intro-card"><div class="eyebrow">Một lớp học trong rừng</div><h1>Ngọn lửa của bạn<br>đang chờ đó.</h1><p class="intro-copy">Chọn người bạn đồng hành, rồi lắng nghe khu rừng chỉ đường.</p><div class="choices"><button class="choice" data-gender="girl"><strong>✿ Bạn nữ</strong><small>Nhẹ nhàng & tinh ý</small></button><button class="choice" data-gender="boy"><strong>✦ Bạn nam</strong><small>Gan dạ & tò mò</small></button></div></div></section>
  </main>
  <script>
    const $ = id => document.getElementById(id); const scene=$('scene'), player=$('player'), wood=$('wood'), fire=$('fire'), portal=$('portal'), portalCopy=$('portalCopy'); const intro=$('intro'), dialogue=$('dialogue'), dialogueText=$('dialogueText'), statusEl=$('status'), toast=$('toast'), inventory=$('inventory'), inventoryText=$('inventoryText');
    let carrying=false, lit=false, playing=false, target={x:18,y:78}, pos={x:18,y:78}, lastTime=0, toastTimer; const clamp=(n,min,max)=>Math.max(min,Math.min(max,n)); const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    const say=(text,duration=2300)=>new Promise(resolve=>{dialogueText.innerHTML=text;dialogue.classList.add('show');setTimeout(()=>{dialogue.classList.remove('show');setTimeout(resolve,550)},duration)}); const notify=text=>{toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)};
    function characterSvg(kind){const skin='#f3c6a5',hair=kind==='girl'?'#34254b':'#24334c',outfit=kind==='girl'?'#e48da8':'#6f9fc3';return `<svg viewBox="0 0 90 120" aria-hidden="true"><path d="M21 48c-7-25 5-39 25-40 23-1 34 14 25 41l-8 11H27Z" fill="${hair}" stroke="#17162d" stroke-width="3"/><circle cx="45" cy="40" r="21" fill="${skin}" stroke="#41293d" stroke-width="3"/><path d="M23 38c4-26 38-32 49-6-12-9-31-3-49 6Z" fill="${hair}"/><circle cx="38" cy="42" r="2" fill="#231c32"/><circle cx="52" cy="42" r="2" fill="#231c32"/><path d="M42 50q4 3 8 0" fill="none" stroke="#a65b6f" stroke-width="2" stroke-linecap="round"/><path d="M23 67q22-12 44 0l9 43H14Z" fill="${outfit}" stroke="#17162d" stroke-width="3"/><path d="M23 73 10 91M67 73l13 18" stroke="${skin}" stroke-width="8" stroke-linecap="round"/><path d="M30 110 23 119M59 110l8 9" stroke="#d7a96e" stroke-width="7" stroke-linecap="round"/></svg>`}
    function setPosition(x,y){pos={x,y};player.style.left=x+'%';player.style.top=y+'%'} function placeObjects(){const seed=Math.random(),woodX=clamp(18+seed*34,14,52),woodY=clamp(53+seed*17,48,76),fireX=clamp(64+seed*21,61,86),fireY=clamp(43+(1-seed)*24,42,72);wood.style.left=woodX+'%';wood.style.top=woodY+'%';fire.style.left=fireX+'%';fire.style.top=fireY+'%';return{wood:{x:woodX,y:woodY},fire:{x:fireX,y:fireY}}} let objects={wood:{x:30,y:60},fire:{x:75,y:56}};
    async function start(kind){player.innerHTML=characterSvg(kind);intro.classList.add('hidden');objects=placeObjects();setPosition(18,78);playing=false;await say('Chào mừng bạn đến với lớp học Me.mori',2400);await say('Hãy đi tìm ngọn lửa của bạn nào',2100);playing=true;statusEl.textContent='Nhấp vào mặt đất để di chuyển'}
    function arrive(){player.classList.remove('walking');if(distance(pos,objects.wood)<8&&!carrying){carrying=true;wood.style.opacity='0';inventory.classList.add('carrying');inventoryText.textContent='Đang cầm một thanh củi';notify('Bạn đã nhặt được củi khô');statusEl.textContent='Mang củi đến ngọn lửa'}if(distance(pos,objects.fire)<9&&!lit){if(carrying){lit=true;carrying=false;fire.classList.remove('off');wood.style.opacity='1';wood.style.left=pos.x+'%';wood.style.top=(pos.y-1.5)+'%';wood.style.transform='translate(-50%,-50%) rotate(4deg)';inventory.classList.remove('carrying');inventoryText.textContent='Ngọn lửa đang cháy';portal.classList.add('open');portalCopy.classList.add('show');notify('Bạn đã tìm thấy ngọn lửa của mình ✦');statusEl.textContent='Cánh cổng đã mở ở giữa khu rừng'}else{notify('Lửa cần có củi mới cháy được');statusEl.textContent='Quay lại tìm một thanh củi'}}}
    function tick(t){if(!lastTime)lastTime=t;const dt=Math.min((t-lastTime)/1000,.05);lastTime=t;if(playing&&distance(pos,target)>.35){const dx=target.x-pos.x,dy=target.y-pos.y,d=Math.hypot(dx,dy),speed=20;setPosition(pos.x+dx/d*speed*dt,pos.y+dy/d*speed*dt);player.classList.add('walking');player.style.transform=`translate(-50%,-76%) scaleX(${dx<0?-1:1})`;if(distance(pos,target)<=.5)arrive()}requestAnimationFrame(tick)}
    scene.addEventListener('pointerdown',e=>{if(!playing||e.target.closest('.portal'))return;const r=scene.getBoundingClientRect();target={x:clamp((e.clientX-r.left)/r.width*100,6,94),y:clamp((e.clientY-r.top)/r.height*100,38,91)};statusEl.textContent='Đang bước theo ánh sáng...'}); portal.addEventListener('click',()=>{if(lit){notify('Một hành trình mới sắp bắt đầu...');statusEl.textContent='Cảm ơn bạn đã thắp sáng khu rừng ✦';portalCopy.textContent='Bạn đã sẵn sàng'}}); document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>start(btn.dataset.gender))); requestAnimationFrame(tick);
  </script>
</body>
</html>
