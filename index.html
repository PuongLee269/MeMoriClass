<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101b30" />
  <title>Me.mori — Ngọn lửa của bạn</title>
  <style>
    :root{--ink:#fff1cf;--navy:#101b30;--panel:#172a42;--line:#7ea1a9;--gold:#ffc66c;--coral:#e87a68}
    *{box-sizing:border-box} html,body{height:100%;margin:0;background:#0a1120;color:var(--ink);font-family:monospace} body{overflow:hidden}
    #game{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;background:#101b30}
    .hud{position:fixed;inset:0;z-index:3;pointer-events:none;padding:clamp(14px,3vw,34px);display:flex;justify-content:space-between;align-items:flex-start;text-transform:uppercase;font-size:clamp(10px,1.4vw,13px);letter-spacing:.08em;text-shadow:2px 2px #101b30}
    .brand{font-weight:900;color:#fff0c0}.brand i{color:var(--gold);font-style:normal}.quest{text-align:right;color:#b9ced0;line-height:1.6}.quest b{color:var(--gold)}
    .caption{position:fixed;z-index:4;left:50%;bottom:clamp(22px,5vh,44px);transform:translateX(-50%);text-align:center;text-shadow:2px 2px #101b30;font-size:clamp(11px,1.5vw,14px);letter-spacing:.06em;pointer-events:none;min-width:270px}
    .caption small{display:block;color:#a7c0c3;margin-top:7px;font-size:.8em}.toast{position:fixed;z-index:6;top:80px;left:50%;transform:translate(-50%,-12px);opacity:0;transition:.3s;padding:9px 14px;border:2px solid #f8d892;background:#193449;color:#fff3cf;box-shadow:4px 4px #0c1728;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .veil,.choose{position:fixed;z-index:8;inset:0;display:grid;place-items:center;background:rgba(7,14,28,.88);transition:opacity .45s}.veil.hide,.choose.hide{opacity:0;pointer-events:none}
    .dialogue{max-width:min(760px,88vw);padding:22px 28px;text-align:center;color:#fff1cf;font-size:clamp(25px,4.8vw,54px);line-height:1.18;text-shadow:4px 4px #101b30;animation:pop .35s steps(3)}@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}.dialogue span{display:block;margin-top:16px;color:#9dc4c1;font-size:11px;letter-spacing:.15em}
    .card{width:min(560px,calc(100vw - 32px));padding:30px;text-align:center;background:#152943;border:3px solid #90b9b6;box-shadow:8px 8px #071020,12px 12px #c76d62}.eyebrow{color:#ffc66c;font-size:12px;letter-spacing:.18em}.card h1{margin:15px 0 10px;font-size:clamp(32px,5vw,52px);line-height:1.02}.card p{margin:0 0 23px;color:#bed2cf;line-height:1.6;font-size:13px}.choices{display:flex;gap:12px;justify-content:center}.pick{min-width:185px;padding:15px 10px;background:#243d56;border:2px solid #719aa1;color:#fff0cf;box-shadow:4px 4px #0b1628;font-family:inherit;transition:transform .12s}.pick:hover,.pick:focus-visible{transform:translate(-2px,-2px);border-color:#ffc66c;box-shadow:6px 6px #0b1628}.pick strong{display:block;font-size:15px;color:#ffc66c}.pick small{display:block;margin-top:7px;color:#b8d1cd;font-size:11px}@media(max-width:500px){.choices{flex-direction:column}.pick{min-width:0}.hud .quest{display:none}}
  </style>
</head>
<body>
  <canvas id="game" width="320" height="180" aria-label="Game pixel Me.mori. Nhấp để di chuyển nhân vật."></canvas>
  <div class="hud"><div class="brand"><i>✦</i> ME.MORI / FIRE QUEST</div><div class="quest"><b id="state">CHƯA CÓ CỦI</b><br><span id="step">TÌM THANH CỦI</span></div></div>
  <div class="toast" id="toast"></div><div class="caption" id="caption">Chọn nhân vật để bắt đầu<small>NHẤP VÀO BẢN ĐỒ ĐỂ DI CHUYỂN</small></div>
  <section class="choose" id="choose"><div class="card"><div class="eyebrow">CHƯƠNG 01 · KHU RỪNG ĐOM ĐÓM</div><h1>Ngọn lửa của bạn<br>đang chờ đó.</h1><p>Chọn người bạn đồng hành cho chuyến đi đêm nay.</p><div class="choices"><button class="pick" data-type="girl"><strong>✿ BẠN NỮ</strong><small>Áo hồng · tóc tím</small></button><button class="pick" data-type="boy"><strong>✦ BẠN NAM</strong><small>Áo xanh · tóc nâu</small></button></div></div></section>
  <section class="veil hide" id="veil"><div class="dialogue" id="dialogue"></div></section>
  <script>
  const c=document.getElementById('game'),x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  const UI={choose:document.getElementById('choose'),veil:document.getElementById('veil'),dialogue:document.getElementById('dialogue'),caption:document.getElementById('caption'),toast:document.getElementById('toast'),state:document.getElementById('state'),step:document.getElementById('step')};
  const W=320,H=180; let started=false,kind='girl',t=0,last=0,toastTimer,gate=false;
  const p={x:64,y:132,tx:64,ty:132,face:1,walk:0,hasWood:false,hasFire:false}; let wood={x:116,y:112,alive:true},flame={x:236,y:91,alive:true}; let motes=[];
  const C={sky:'#101b30',sky2:'#213a55',far:'#29475c',ground:'#254b55',grass:'#326169',dark:'#17313f',leaf:'#3f786d',mint:'#a7d7bc',moon:'#fff1bc',gold:'#ffc66c',orange:'#f39a5a',coral:'#e87067',pink:'#d985aa',cream:'#fff1cf',ink:'#101b30',wood:'#925b45',bark:'#613e3d'};
  const r=(a,b)=>Math.floor(a+Math.random()*(b-a+1)); const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  function px(a,b,w,h,col){x.fillStyle=col;x.fillRect(a|0,b|0,w,h)}
  function text(s,a,b,col=C.cream){x.fillStyle=col;x.font='7px monospace';x.fillText(s,a,b)}
  function cloud(a,b){for(let i=0;i<5;i++)px(a+i*7,b+Math.abs(2-i)*2,9,3,'#182b45')}
  function tree(a,b,s=1){px(a-2*s,b,5*s,25*s,C.bark); px(a-9*s,b-15*s,19*s,17*s,C.dark);px(a-12*s,b-8*s,25*s,13*s,C.leaf);px(a-7*s,b-21*s,15*s,11*s,C.leaf);px(a-4*s,b-25*s,9*s,7*s,C.mint);px(a-10*s,b-4*s,5*s,4*s,C.mint)}
  function drawWorld(){
    x.fillStyle=C.sky;x.fillRect(0,0,W,H); for(let i=0;i<60;i++){let sx=(i*53+13)%W,sy=(i*31+9)%76;if(i%5===0)px(sx,sy,2,2,C.moon);else px(sx,sy,1,1,'#81a8b2')}
    px(247,19,20,20,C.moon);px(251,22,5,4,'#f1d99e');px(259,31,3,3,'#f1d99e'); cloud(50,25);cloud(146,42);
    for(let i=0;i<8;i++){let h=17+(i%3)*8,yy=90-h; px(i*48-8,yy,54,h,C.far);px(i*48+5,yy-8,27,11,C.far)}
    px(0,88,W,92,C.ground); for(let i=0;i<125;i++){let gx=(i*29+7)%W,gy=94+(i*17)%86;px(gx,gy,1+(i%4===0),1,i%3?C.leaf:C.mint)}
    for(let i=0;i<10;i++){let q=(i*37+18)%W;tree(q,78+(i%3)*7,i%3===0?2:1)}
    for(let i=0;i<17;i++){let q=(i*41+3)%W,yy=123+(i*13)%42;px(q,yy,5,2,C.dark);px(q+2,yy-3,2,3,C.leaf)}
    px(0,160,W,20,'#1b3c4b');for(let i=0;i<35;i++)px((i*23)%W,164+(i*7)%16,5,1,C.leaf);
  }
  function drawLog(a,b,held=false){x.save();x.translate(a|0,b|0);if(held)x.rotate(p.face*.18);px(-10,-3,20,7,C.bark);px(-8,-5,17,7,C.wood);px(-10,-3,3,7,'#bb7955');px(7,-3,3,7,'#51333b');px(3,-4,2,1,'#d4905d');x.restore()}
  function drawFire(a,b,big=false){let f=Math.floor(t/110)%2; let s=big?1.25:1; px(a-4*s,b,8*s,3,C.bark);px(a-7*s,b+3*s,14*s,3,C.wood);px(a-3*s,b-9*s-f,6*s,10*s,C.coral);px(a-2*s,b-13*s+f,4*s,7*s,C.gold);px(a-1*s,b-8*s,2*s,4*s,C.cream); if(big){px(a-9*s,b-2*s,2,2,C.gold);px(a+8*s,b-7*s,2,2,C.gold)}}
  function drawPlayer(){let bob=started&&d(p,{x:p.tx,y:p.ty})>1?Math.sin(p.walk)*1.2:0,a=p.x|0,b=(p.y+bob)|0;let hair=kind==='girl'?'#4b3a68':'#5a3b35',shirt=kind==='girl'?'#d886a6':'#5a92b7';
    px(a-7,b-2,14,3,'#15313d'); // shadow
    px(a-4,b-18,8,9,'#f2c49e');px(a-5,b-22,10,7,hair);px(a-6,b-20,2,7,hair); if(kind==='girl'){px(a+4,b-19,3,8,hair);px(a-7,b-17,2,5,hair)}
    px(a-2,b-16,1,1,C.ink);px(a+2,b-16,1,1,C.ink);px(a-4,b-8,8,9,shirt);px(a-5,b-7,1,5,'#f2c49e');px(a+5,b-7,1,5,'#f2c49e');
    let leg=Math.sin(p.walk)>0?1:-1;px(a-3,b+1,2,6,'#273a55');px(a+2,b+1,2,6,'#273a55');px(a-4,b+7+leg,3,2,'#f1c284');px(a+1,b+7-leg,3,2,'#f1c284');
    if(p.hasWood||p.hasFire){let hx=a+p.face*8,hy=b-8;drawLog(hx,hy,true);if(p.hasFire)drawFire(hx+p.face*1,hy-5,true)}
  }
  function drawPortal(){if(!gate)return;let a=160,b=78,tw=Math.floor(t/180)%2;px(a-13,b-20,26,3,'#bc8cba');px(a-16,b-17,5,36,'#806b9d');px(a+11,b-17,5,36,'#806b9d');px(a-11,b-18,22,38,'#4d4274');px(a-8,b-15,16,32,tw?'#d675a0':'#b380bb');px(a-5,b-12,10,26,tw?'#ffd182':'#ffc2a1');px(a-2,b-8,4,17,'#fff0bb');px(a-18,b+19,36,3,'#583c63');text('CỔNG ÁNH SÁNG',128,110,C.gold)}
  function particles(){if(p.hasFire&&Math.random()<.28)motes.push({x:p.x+p.face*8,y:p.y-20,vx:(Math.random()-.5)*.32,vy:-Math.random()*.45-.2,life:24});if(!p.hasFire&&flame.alive&&Math.random()<.18)motes.push({x:flame.x,y:flame.y-13,vx:(Math.random()-.5)*.23,vy:-.35,life:20});motes=motes.filter(m=>m.life-->0);motes.forEach(m=>{m.x+=m.vx;m.y+=m.vy;px(m.x,m.y,1,1,m.life%2?C.gold:C.cream)})}
  function render(){drawWorld();if(wood.alive)drawLog(wood.x,wood.y);if(flame.alive)drawFire(flame.x,flame.y);drawPortal();drawPlayer();particles();if(started){text('✦',p.tx-2,p.ty-13,C.gold)}}
  function toast(s){UI.toast.textContent=s;UI.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>UI.toast.classList.remove('show'),1700)}
  function updateQuest(){if(p.hasFire){UI.state.textContent='LỬA ĐANG CHÁY';UI.step.textContent='MANG ÁNH SÁNG TỚI CÁNH CỔNG';UI.caption.innerHTML='Bạn đang mang ngọn lửa của mình <small>ÁNH LỬA BÁM THEO TỪNG BƯỚC CHÂN</small>'}else if(p.hasWood){UI.state.textContent='ĐÃ CÓ CỦI';UI.step.textContent='TÌM NGỌN LỬA';UI.caption.innerHTML='Mang củi đến gần ngọn lửa <small>CỦI ĐANG Ở TRONG TAY BẠN</small>'}else{UI.state.textContent='CHƯA CÓ CỦI';UI.step.textContent='TÌM THANH CỦI';UI.caption.innerHTML='Nhấp lên bản đồ để di chuyển <small>TÌM THANH CỦI NẰM TRONG CỎ</small>'}}
  function arrive(){if(wood.alive&&d(p,wood)<12){wood.alive=false;p.hasWood=true;toast('ĐÃ NHẶT CỦI — CỦI BÁM VÀO TAY!');updateQuest()}if(flame.alive&&d(p,flame)<13){if(p.hasWood){flame.alive=false;p.hasWood=false;p.hasFire=true;gate=true;toast('NGỌN LỬA ĐÃ CHÁY TRÊN CỦI!');updateQuest()}else{toast('CẦN MỘT THANH CỦI ĐỂ MANG LỬA ĐI')}}}
  function loop(now){let dt=Math.min((now-last)/16.7,2);last=now;t+=dt*16;let dx=p.tx-p.x,dy=p.ty-p.y,dist=Math.hypot(dx,dy);if(started&&dist>.5){let v=.7*dt;p.x+=dx/dist*Math.min(v,dist);p.y+=dy/dist*Math.min(v,dist);p.face=dx<0?-1:1;p.walk+=.55*dt;if(dist<1.2)arrive()}render();requestAnimationFrame(loop)}
  async function line(s,ms){UI.dialogue.innerHTML=s+'<span>ME.MORI CLASS</span>';UI.veil.classList.remove('hide');await new Promise(r=>setTimeout(r,ms));UI.veil.classList.add('hide');await new Promise(r=>setTimeout(r,400))}
  document.querySelectorAll('.pick').forEach(b=>b.onclick=async()=>{kind=b.dataset.type;UI.choose.classList.add('hide');await line('Chào mừng bạn đến với<br>lớp học Me.mori',2100);await line('Hãy đi tìm ngọn lửa<br>của bạn nào',1900);started=true;updateQuest()});
  c.addEventListener('pointerdown',e=>{if(!started)return;let r=c.getBoundingClientRect();p.tx=Math.max(10,Math.min(310,(e.clientX-r.left)/r.width*W));p.ty=Math.max(88,Math.min(163,(e.clientY-r.top)/r.height*H));UI.caption.innerHTML='Đang bước qua rừng đom đóm...<small>MỖI BƯỚC ĐỀU ĐANG ĐƯA BẠN GẦN HƠN</small>'});
  requestAnimationFrame(loop);
  </script>
</body>
</html>
