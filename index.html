  <script>
    (() => {
      const scene = document.querySelector('.scene');
      const artwork = document.querySelector('.artwork');
      const form = document.querySelector('.question-form');
      const field = document.querySelector('#question');
      const dialogue = document.querySelector('.dialogue');
      const windLayer = document.querySelector('.wind-layer');
      const beetleHead = document.querySelector('.beetle-head');
      const brand = document.querySelector('.brand-mark');
      const heroTitle = document.querySelector('.hero-title');
      const heroQuestion = document.querySelector('.hero-question');
      const glowTargets = [...document.querySelectorAll('.hero-copy .copy-base')];
      glowTargets.forEach(target => {
        const text = target.textContent;
        target.setAttribute('aria-label', text.trim());
        const tokens = text.split(/(\s+)/u);
        const pieces = tokens.map(token => {
          if (/^\s+$/u.test(token)) return document.createTextNode(token);
          const word = document.createElement('span');
          word.className = 'glow-word';
          word.textContent = token;
          return word;
        });
        target.replaceChildren(...pieces);
      });
      const sharpCopy = [
        [heroTitle, 428, 250, 540, 80],
        [heroQuestion, 523, 310, 800, 82]
      ];

      // Map hotspots from the original artwork coordinates to the visible object-fit:cover image.
      // This keeps the actual controls aligned when the browser crops the artwork on narrow screens.
      const hotspots = [
        [brand, 52, 24, 205, 82],
        [beetleHead, 1138, 454, 214, 213],
        [form, 418, 500, 625, 66],
        [dialogue, 418, 186, 660, 302]
      ];
      function placeHotspots() {
        if (!artwork.naturalWidth || !artwork.naturalHeight) return;
        const box = artwork.getBoundingClientRect();
        const scale = Math.max(box.width / artwork.naturalWidth, box.height / artwork.naturalHeight);
        const renderedWidth = artwork.naturalWidth * scale;
        const renderedHeight = artwork.naturalHeight * scale;
        const [objectX = '50%', objectY = '50%'] = getComputedStyle(artwork).objectPosition.split(' ');
        const positionX = Number.parseFloat(objectX) / 100 || .5;
        const positionY = Number.parseFloat(objectY) / 100 || .5;
        const imageLeft = box.left + (box.width - renderedWidth) * positionX - scene.getBoundingClientRect().left;
        const imageTop = box.top + (box.height - renderedHeight) * positionY - scene.getBoundingClientRect().top;
        scene.style.setProperty('--art-scale', String(scale));
        artwork.style.backgroundPosition = getComputedStyle(artwork).objectPosition;
        if (paper) paper.layout(imageLeft, imageTop, scale);
        for (const [element, x, y, width, height] of sharpCopy) {
          element.style.left = `${imageLeft + x * scale}px`;
          element.style.top = `${imageTop + y * scale}px`;
          element.style.width = `${width * scale}px`;
          element.style.height = `${height * scale}px`;
        }
        for (const [element, x, y, width, height] of hotspots) {
          element.style.left = `${imageLeft + x * scale}px`;
          element.style.top = `${imageTop + y * scale}px`;
          element.style.width = `${width * scale}px`;
          element.style.height = `${height * scale}px`;
          element.style.right = 'auto';
        }
        const compact = innerWidth / innerHeight < artwork.naturalWidth / artwork.naturalHeight;
        brand.dataset.compact = String(compact);
      }

      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const windFront = document.querySelector('.wind-front');
      const random = (min, max) => min + Math.random() * (max - min);
      const pick = list => list[Math.floor(Math.random() * list.length)];

      // ---- Painted-style leaves (gradient fill, soft rim light, veins) ----
      const leafKinds = [
        { grad:'g-gold', weight:3, vein:'#fff3b0', d:'M50 97C49 87 49 78 48 70 38 72 28 68 18 60 26 58 30 54 28 48 22 46 16 42 10 34 20 34 28 34 32 30 30 24 28 18 28 10 36 16 42 20 46 28 47 18 48 10 50 2 52 10 53 18 54 28 58 20 64 16 72 10 72 18 70 24 68 30 72 34 80 34 90 34 84 42 78 46 72 48 70 54 74 58 82 60 72 68 62 72 52 70 51 78 51 86 50 97Z', v:'M50 95V12M49 70 20 52M51 70 80 52M50 52 28 36M50 52 72 36' },
        { grad:'g-green', weight:3, vein:'#e6efb0', d:'M50 98C28 84 14 62 20 38 25 20 38 8 50 2 62 8 75 20 80 38 86 62 72 84 50 98Z', v:'M50 96C51 70 50 40 50 6M50 78 28 62M50 78 72 62M50 56 26 40M50 56 74 40M50 34 36 22M50 34 64 22' },
        { grad:'g-olive', weight:2, vein:'#f1f2b8', d:'M50 98C38 82 33 52 43 26 46 15 48 8 50 2 52 8 54 15 57 26 67 52 62 82 50 98Z', v:'M50 96V6M50 76 41 62M50 76 59 62M50 54 42 40M50 54 58 40' },
        { grad:'g-amber', weight:2, vein:'#ffe2a6', d:'M50 98C30 86 12 66 18 44 22 30 34 22 40 14 44 8 48 6 50 2 54 8 60 10 66 18 74 28 84 40 82 54 80 74 66 88 50 98Z', v:'M50 96C50 66 50 36 50 6M50 76 26 60M50 76 74 60M50 52 28 36M50 52 72 36' },
        { grad:'g-petal', weight:1, vein:'#e8d6a4', d:'M50 96C28 80 18 52 30 28 36 14 46 6 50 2 54 6 64 14 70 28 82 52 72 80 50 96Z', v:'M50 92C50 64 50 34 50 10' }
      ];
      const leafBag = leafKinds.flatMap(kind => Array(kind.weight).fill(kind));
      const leafSVG = kind => `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${kind.d}" fill="url(#${kind.grad})" stroke="#0b1d12" stroke-opacity=".5" stroke-width="1.6" stroke-linejoin="round"/><path d="${kind.d}" fill="url(#g-light)"/><path d="${kind.v}" fill="none" stroke="${kind.vein}" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 97q-1 4-5 8" fill="none" stroke="#6d5b30" stroke-width="2.2" stroke-linecap="round"/></svg>`;

      // Wind: thin cream strokes with a curl, drawn on and off as a gust passes.
      const windPaths = [
        'M4 74C86 40 150 98 240 64 322 33 392 52 470 62 520 68 560 56 590 40',
        'M0 60C90 88 170 30 262 56 340 78 380 92 452 70 500 56 520 40 548 48 574 56 568 78 548 76 534 74 536 62 548 60',
        'M10 50C100 70 190 40 300 58 380 70 450 54 520 44'
      ];
      function spawnStreaks(y, duration, W, H) {
        const count = Math.round(random(2, 3));
        for (let i = 0; i < count; i++) {
          const streak = document.createElement('div');
          streak.className = 'wind-streak';
          streak.innerHTML = `<svg viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="${pick(windPaths)}"/></svg>`;
          windLayer.append(streak);
          const yy = y + random(-.1, .14) * H;
          const run = duration * random(.5, .62);
          const delay = i * random(180, 520);
          const move = streak.animate([
            { transform:`translate3d(${-.5 * W}px,${yy}px,0)`, opacity:0 },
            { opacity:.85, offset:.2 },
            { opacity:.85, offset:.78 },
            { transform:`translate3d(${W}px,${yy + random(-30, 30)}px,0)`, opacity:0 }
          ], { duration:run, delay, easing:'cubic-bezier(.3,.1,.5,.9)', fill:'both' });
          streak.querySelector('path').animate([{ strokeDashoffset:.3 }, { strokeDashoffset:-1.5 }], { duration:run, delay, easing:'ease-in-out', fill:'both' });
          move.onfinish = () => streak.remove();
        }
      }

      let activeLeaves = 0;
      function spawnLeaf(yHint) {
        const W = innerWidth, H = innerHeight;
        const unit = Math.max(.75, Math.min(1.3, W / 1440));
        const roll = Math.random();
        const depth = roll < .28 ? 'far' : roll < .82 ? 'mid' : 'near';
        const cfg = {
          far:  { size:[24, 36],  speed:[70, 95],   opacity:.6,  layer:windLayer },
          mid:  { size:[48, 74],  speed:[105, 145], opacity:.92, layer:windLayer },
          near: { size:[88, 128], speed:[150, 200], opacity:.55, layer:windFront }
        }[depth];
        const size = random(...cfg.size) * unit;
        const travel = W + size * 2.4;
        const duration = Math.min(18, Math.max(6.5, travel / random(...cfg.speed))) * 1000;
        const leaf = document.createElement('span');
        leaf.className = `leaf is-${depth}`;
        leaf.style.width = leaf.style.height = `${size}px`;
        leaf.innerHTML = leafSVG(pick(leafBag));
        const svg = leaf.firstElementChild;
        cfg.layer.append(leaf);

        const x0 = -size * 1.3, x1 = W + size * 1.3;
        // big blurred leaves keep to the top/bottom bands so they never cover the headline
        const yStart = yHint ?? (depth === 'near' ? (Math.random() < .5 ? random(.04, .2) : random(.62, .8)) : random(.1, .6)) * H;
        const fall = random(.04, .2) * H;
        const amp = random(.018, .045) * H * (depth === 'near' ? 1.4 : 1);
        const swings = random(1.4, 2.6);
        const phase = random(0, 6.283), phase2 = random(0, 6.283);
        const rot0 = random(-40, 40), spin = random(-60, 140);
        const flipAmp = random(40, 72), flips = random(2.2, 3.8);
        const gust = random(.02, .05), gustF = random(1, 2);
        const steps = 40, TAU = Math.PI * 2;
        const body = [], flutter = [];
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const e = t + gust * Math.sin(TAU * gustF * t + phase) * Math.sin(Math.PI * t);
          const x = x0 + (x1 - x0) * e;
          const y = yStart + fall * t + amp * Math.sin(TAU * swings * t + phase);
          const r = rot0 + spin * t + 26 * Math.sin(TAU * swings * t + phase + 1.2);
          const fade = t < .07 ? t / .07 : t > .93 ? (1 - t) / .07 : 1;
          body.push({ offset:t, opacity:cfg.opacity * fade, transform:`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) rotate(${r.toFixed(1)}deg)` });
          const flip = flipAmp * Math.sin(TAU * flips * t + phase2);
          const tilt = 18 * Math.sin(TAU * flips * .7 * t + phase);
          flutter.push({ offset:t, transform:`perspective(520px) rotateY(${flip.toFixed(1)}deg) rotateX(${tilt.toFixed(1)}deg)`, filter:`brightness(${(.78 + .3 * Math.cos(flip * Math.PI / 180)).toFixed(2)})` });
        }
        activeLeaves++;
        svg.animate(flutter, { duration, easing:'linear', fill:'both' });
        const flight = leaf.animate(body, { duration, easing:'linear', fill:'both' });
        flight.onfinish = () => { leaf.remove(); activeLeaves--; };
        return { yStart, duration, W, H };
      }

      const depthBoost = () => 0.8 + Math.random() * 0.6;
      function spawnGust() {
        const first = spawnLeaf();
        if (paper) paper.gust(depthBoost(first.H));
        spawnStreaks(first.yStart, first.duration, first.W, first.H);
        if (Math.random() < .22) window.setTimeout(() => { if (!document.hidden) spawnLeaf(first.yStart + random(-.08, .08) * first.H); }, random(400, 1100));
      }
      let leafTimer = 0;
      function scheduleLeaf(initial) {
        window.clearTimeout(leafTimer);
        leafTimer = window.setTimeout(() => {
          const limit = innerWidth < 700 ? 3 : 4;
          if (!document.hidden && !reduceMotion.matches && activeLeaves < limit) spawnGust();
          scheduleLeaf(false);
        }, initial ? random(600, 1500) : random(3000, 7000));
      }
      if (!reduceMotion.matches) scheduleLeaf(true);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) window.clearTimeout(leafTimer);
        else if (!reduceMotion.matches) scheduleLeaf(false);
      });

      // ---- Paper scene: the painting cut into paper layers that sway in the breeze (assets/paper/forest) ----
      // Slow connections keep the still image; everything else loads the moving layers in the background.
      const conn = navigator.connection || {};
      const lightMode = conn.saveData || /(^|-)2g$/.test(conn.effectiveType || '');
      const loadBar = document.querySelector('.load-bar');
      const loader = document.querySelector('.loader');
      const loaderBar = loader.querySelector('.loader-track span');
      let paperReady = false, paperFailed = false;
      const paper = window.PaperScene && !lightMode ? PaperScene.create(document.querySelector('.forest-paper'), {
        width: 1672, height: 941,
        layers: [
          { src:'assets/paper/forest3/back.webp', x:0, y:0, w:1672, h:941, depth:0 },
          { src:'assets/paper/forest3/front-trunks.webp', x:0, y:0, w:1672, h:941, depth:0.25 },
          { src:'assets/paper/forest3/02-trees-left-twigs.webp', x:94, y:0, w:121, h:415, ox:120, oy:520, depth:0.25, sway:{ amp:0.45, period:6.2, bend:0.5, gust:1.1 } },
          { src:'assets/paper/forest3/03-trees-right-twigs.webp', x:1334, y:0, w:239, h:416, ox:1560, oy:520, depth:0.25, sway:{ amp:0.45, period:6.6, bend:0.5, gust:1.1 } },
          { src:'assets/paper/forest3/lake-water.webp', x:205, y:701, w:845, h:176, depth:.2, className:'lake-ripple' },
          { src:'assets/paper/forest3/lake-still.webp', x:70, y:351, w:1151, h:526, depth:.2 },
          { src:'assets/bo/bank-clean.webp', x:0, y:17, w:1672, h:924, depth:0.5 },
          { src:'assets/paper/forest3/fg-shade.webp', x:0, y:310, w:1672, h:631, depth:.5 },
          { src:'assets/paper/forest3/08-overhead-leaves.webp', x:495, y:0, w:704, h:211, ox:850, oy:-40, depth:0.45, shadow:true, sway:{ amp:0.45, period:8, bend:0.55 } },
          { src:'assets/paper/forest3/09-foreground-left.webp', x:0, y:332, w:585, h:609, ox:150, oy:980, depth:1, sway:{ amp:0.5, period:7.5, bend:0.7 } },
          { src:'assets/paper/forest3/10-foreground-bottom.webp', x:580, y:729, w:697, h:212, ox:930, oy:990, depth:0.9, sway:{ amp:0.45, period:5.6, bend:0.75 } },
          { src:'assets/paper/forest3/11-foreground-right.webp', x:1217, y:728, w:455, h:213, ox:1500, oy:990, depth:0.9, sway:{ amp:0.5, period:6.4, bend:0.7 } }
        ],
        onProgress: p => { loadBar.style.transform = `scaleX(${p})`; loaderBar.style.transform = `scaleX(${Math.max(.04, p)})`; },
        glows: [[317,297],[337,541],[342,617],[927,602],[831,662],[1255,393],[1417,589],[1527,278],[1574,757],[1473,815]]
      }) : null;
      if (paper) {
        paper.ready.then(() => { paperReady = true; }).catch(() => { paperFailed = true; });
        paper.follow(document.querySelector('.beetle-head'), 'bank-clean'); // Bọ moves with the bank he stands on
        PaperScene.linkTransitions(paper);
      } else {
        loadBar.remove();
      }

      // ---- Bọ: idle sprite + flight sprite sheet (assets/bo). Flies in and lands on load, takes off before leaving for another page. ----
      const bo = (() => {
        const art = beetleHead.querySelector('.bo-art'), idle = beetleHead.querySelector('.bo-idle');
        const idleCtl = BoIdle.create({ every: [5, 12] }); BoIdle.mount(idle, idleCtl); window.boIdleCtl = idleCtl;
        const fly = beetleHead.querySelector('.bo-fly'), flyImg = fly.querySelector('img');
        const decoded = img => (img.decode ? img.decode() : Promise.resolve()).catch(() => {});
        const idleReady = BoIdle.preload();   // cả bộ tư thế được tải + giải mã cùng bộ tải trang
        let flyOK = false;
        const flyReady = new Promise(resolve => {
          flyImg.addEventListener('load', () => decoded(flyImg).then(() => { flyOK = true; resolve(); }), { once: true });
          flyImg.addEventListener('error', resolve, { once: true });
        });
        flyImg.src = 'assets/bo/bo-fly.webp';
        const show = on => { fly.classList.toggle('on', on); beetleHead.classList.toggle('is-flying', on); };
        function reset() { art.getAnimations().forEach(a => a.cancel()); show(false); }
        // Flies in from the right (flipped to face left), then lands on the idle pose. Resolves when he has landed.
        function arrive() {
          if (!flyOK || reduceMotion.matches || !art.animate) return Promise.resolve();
          const r = beetleHead.getBoundingClientRect();
          const dx = innerWidth - r.left + 60, dy = -Math.min(innerHeight * .45, 380);
          fly.classList.add('flip'); show(true);
          const move = art.animate([
            { transform: `translate(${dx}px,${dy}px) scale(.82)`, offset: 0 },
            { transform: `translate(${dx * .3}px,${dy * .35}px) scale(.95)`, offset: .6 },
            { transform: 'translate(0,-14px) scale(1)', offset: .9 },
            { transform: 'translate(0,0) scale(1)', offset: 1 }
          ], { duration: 1500, delay: 500, easing: 'cubic-bezier(.3,.5,.4,1)', fill: 'both' });
          return move.finished.then(() => {
            show(false); fly.classList.remove('flip'); move.cancel();
            idle.animate([{ transform: 'scale(1.035,.95)' }, { transform: 'scale(1,1)' }], { duration: 300, easing: 'ease-out' });
          }).catch(() => { reset(); });
        }
        // Short flight up and away while the paper scene lifts off.
        function leave() {
          if (!flyOK || reduceMotion.matches || !art.animate) return;
          reset(); fly.classList.remove('flip'); show(true);
          art.animate([
            { transform: 'translate(0,0) scale(1)', opacity: 1, offset: 0 },
            { transform: 'translate(40px,-34px) scale(1.04)', opacity: 1, offset: .2 },
            { transform: `translate(${innerWidth * .5}px,${-innerHeight * .55}px) scale(.7)`, opacity: 0, offset: 1 }
          ], { duration: 1000, easing: 'ease-in', fill: 'forwards' });
        }
        return { ready: Promise.all([idleReady, flyReady]), arrive, leave, reset };
      })();
      let boSettled = true;   // the greeting waits until Bọ has landed
      // Bọ looks toward the mouse (3/4 turn, never side-on) when the cursor is far to one side; back to facing front after 4 s or when the cursor leaves.
      {
        const fine = matchMedia('(hover:hover) and (pointer:fine)'); let lookT = 0, dir = 0;
        scene.addEventListener('pointermove', event => {
          if (event.pointerType !== 'mouse' || !fine.matches || reduceMotion.matches || beetleHead.classList.contains('is-flying')) return;
          const r = beetleHead.getBoundingClientRect(), dx = event.clientX - (r.left + r.width / 2), th = Math.max(240, innerWidth * .2);
          const want = Math.abs(dx) > th ? (dx < 0 ? -1 : 1) : (Math.abs(dx) < th * .75 ? 0 : dir);
          if (want !== dir) { dir = want; window.boIdleCtl.look(dir); }
          clearTimeout(lookT); lookT = setTimeout(() => { dir = 0; window.boIdleCtl.look(0); }, 4000);
        }, { passive: true });
        scene.addEventListener('pointerleave', () => { dir = 0; window.boIdleCtl.look(0); });
      }
      if (paper) {
        document.addEventListener('click', event => {
          const link = event.target.closest && event.target.closest('a[href]');
          if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          if (link.target && link.target !== '_self') return;
          const url = new URL(link.href, location.href);
          if (url.origin !== location.origin || (url.pathname === location.pathname && url.hash)) return;
          bo.leave();
        }, true);
        window.addEventListener('pageshow', event => { if (event.persisted) bo.reset(); });
      }

      // ---- Start: wait for fonts, the still image and every paper layer (max 12 s), then lift the loading screen ----
      const stillReady = new Promise(r => (artwork.complete && artwork.naturalWidth ? r() : (artwork.addEventListener('load', r, { once: true }), artwork.addEventListener('error', r, { once: true }))));
      const fontsReady = document.fonts ? document.fonts.ready.catch(() => {}) : Promise.resolve();
      const layersReady = paper ? paper.ready.catch(() => {}) : Promise.resolve();
      const timeout = new Promise(r => setTimeout(r, 12000));
      const minShow = new Promise(r => setTimeout(r, 1200));   // never just flash the loading screen
      Promise.all([minShow, Promise.race([Promise.all([stillReady, fontsReady, layersReady, bo.ready]), timeout])]).then(() => {
        placeHotspots();
        loader.classList.add('is-done');
        loadBar.classList.add('is-done');
        if (paper && paperReady) {
          paper.reveal(0);
          boSettled = false;
          const landed = bo.arrive();   // hides the idle pose until the flight is over
          scene.classList.add('has-paper');
          landed.then(() => { boSettled = true; }, () => { boSettled = true; });
          paper.enter({ duration: 1000, stagger: 70 });
        } else if (paper && !paperFailed) {
          // slow network: show the still now, swap in the moving layers when they arrive
          loadBar.classList.remove('is-done');
          paper.ready.then(() => paper.reveal()).then(() => { scene.classList.add('has-paper'); loadBar.classList.add('is-done'); }).catch(() => loadBar.classList.add('is-done'));
        }
        setTimeout(() => loader.remove(), 1000);
      });

      // ---- Pointer glow: follows the mouse; on touch screens a small glow follows the finger ----
      const glow = document.querySelector('.pointer-glow');
      if (!reduceMotion.matches) {
        const moveGlow = event => {
          const box = scene.getBoundingClientRect();
          glow.style.transform = `translate(${event.clientX - box.left}px,${event.clientY - box.top}px)`;
        };
        scene.addEventListener('pointermove', event => {
          if (event.pointerType === 'touch' && !glow.classList.contains('is-touch')) return;
          moveGlow(event);
          glow.classList.add('is-on');
        }, { passive: true });
        scene.addEventListener('pointerdown', event => {
          glow.classList.toggle('is-touch', event.pointerType === 'touch');
          moveGlow(event);
          glow.classList.add('is-on');
        }, { passive: true });
        const touchEnd = event => { if (event.pointerType === 'touch') glow.classList.remove('is-on'); };
        scene.addEventListener('pointerup', touchEnd, { passive: true });
        scene.addEventListener('pointercancel', touchEnd, { passive: true });
        scene.addEventListener('pointerleave', event => { if (event.pointerType !== 'touch') glow.classList.remove('is-on'); });
        // dragging a finger can cancel pointer events on phones, so touch events drive the glow there
        scene.addEventListener('touchmove', event => { const t = event.touches[0]; if (!t) return; glow.classList.add('is-touch', 'is-on'); moveGlow(t); }, { passive: true });
        scene.addEventListener('touchend', () => glow.classList.remove('is-on'), { passive: true });
      }

      if (artwork.complete) placeHotspots();
      artwork.addEventListener('load', placeHotspots, { once: true });
      new ResizeObserver(placeHotspots).observe(scene);
      window.addEventListener('resize', placeHotspots, { passive: true });

      // ---- Night-forest soundscape: a seamless ambience loop + random distant animal / beetle sounds ----
      (() => {
        const box = document.querySelector('.music');
        const toggle = box.querySelector('.music-toggle');
        const nextBtn = box.querySelector('.music-next');
        const title = box.querySelector('.music-title');
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { box.hidden = true; return; }
        const EXT = new Audio().canPlayType('audio/ogg; codecs="vorbis"') ? 'ogg' : 'mp3';
        const DIR = 'assets/ambience/';
        const scenes = [{ title: 'Rừng đêm', file: 'night-forest' }, { title: 'Bên hồ', file: 'lakeside' }];
        const events = ['beetle-flyby-1', 'beetle-flyby-2', 'owl', 'frog-1', 'frog-2', 'night-bird', 'leaves-rustle'];
        const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
        let sceneIndex = Number(store.get('memori-ambience')) || 0;
        let wanted = store.get('memori-sound') !== 'off';
        let ctx = null, master = null, bed = null, eventTimer = 0, titleTimer = 0;
        const buffers = new Map();
        const VOLUME = 0.9;
        const load = name => {
          if (!buffers.has(name)) buffers.set(name, fetch(`${DIR}${name}.${EXT}`).then(r => r.arrayBuffer()).then(d => new Promise((ok, no) => ctx.decodeAudioData(d, ok, no))));
          return buffers.get(name);
        };
        function showTitle() {
          title.textContent = scenes[sceneIndex].title;
          title.classList.add('is-visible');
          clearTimeout(titleTimer);
          titleTimer = setTimeout(() => title.classList.remove('is-visible'), 2600);
        }
        function setUI(on) {
          box.classList.toggle('is-playing', on);
          toggle.setAttribute('aria-pressed', String(on));
          toggle.setAttribute('aria-label', on ? 'Tắt âm thanh rừng' : 'Bật âm thanh rừng');
        }
        function ensureContext() {
          if (ctx) return;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0;
          master.connect(ctx.destination);
        }
        function fade(target, seconds) {
          const t = ctx.currentTime;
          master.gain.cancelScheduledValues(t);
          master.gain.setValueAtTime(master.gain.value, t);
          master.gain.linearRampToValueAtTime(target, t + seconds);
        }
        async function startBed() {
          const buffer = await load(scenes[sceneIndex].file);
          const old = bed;
          const src = ctx.createBufferSource();
          const g = ctx.createGain();
          src.buffer = buffer; src.loop = true;
          src.connect(g).connect(master);
          g.gain.setValueAtTime(0, ctx.currentTime);
          g.gain.linearRampToValueAtTime(1, ctx.currentTime + 2);   // crossfade between scenes
          src.start();
          bed = { src, g };
          if (old) { old.g.gain.linearRampToValueAtTime(0, ctx.currentTime + 2); old.src.stop(ctx.currentTime + 2.1); }
        }
        function scheduleEvent() {
          clearTimeout(eventTimer);
          eventTimer = setTimeout(async () => {
            if (box.classList.contains('is-playing') && !document.hidden) {
              const name = events[Math.floor(Math.random() * events.length)];
              try {
                const buffer = await load(name);
                const src = ctx.createBufferSource();
                const g = ctx.createGain();
                const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
                src.buffer = buffer;
                g.gain.value = 0.55 + Math.random() * 0.45;               // nearer / farther
                if (pan) { pan.pan.value = name.startsWith('beetle') ? 0 : Math.random() * 1.6 - 0.8; src.connect(g).connect(pan).connect(master); }
                else src.connect(g).connect(master);
                src.start();
              } catch {}
            }
            scheduleEvent();
          }, 6000 + Math.random() * 14000);
        }
        async function play() {
          ensureContext();
          // resume() stays pending until the browser allows sound, so don't wait on it forever
          await Promise.race([ctx.resume().catch(() => {}), new Promise(r => setTimeout(r, 400))]);
          if (ctx.state !== 'running') { setUI(false); return false; }
          try { await startBed(); } catch { setUI(false); return false; }
          setUI(true); fade(VOLUME, 2.5); showTitle(); scheduleEvent();
          return true;
        }
        function stop() {
          clearTimeout(eventTimer);
          setUI(false);
          if (!ctx) return;
          fade(0, 0.8);
          setTimeout(() => { if (!box.classList.contains('is-playing')) ctx.suspend(); }, 900);
        }
        toggle.addEventListener('click', () => {
          if (box.classList.contains('is-playing')) { wanted = false; store.set('memori-sound', 'off'); stop(); }
          else { wanted = true; store.set('memori-sound', 'on'); play(); }
        });
        nextBtn.addEventListener('click', () => {
          sceneIndex = (sceneIndex + 1) % scenes.length;
          store.set('memori-ambience', String(sceneIndex));
          if (box.classList.contains('is-playing')) { startBed(); showTitle(); }
          else if (wanted) play(); else showTitle();
        });
        // try right away; browsers that block sound start it on the first tap / key outside these buttons
        if (wanted) play().then(ok => {
          if (ok) return;
          // phones only count a finished tap (pointerup / touchend / click) as permission to play sound
          const kinds = ['pointerup', 'touchend', 'click', 'keydown'];
          title.textContent = 'Chạm vào màn hình để nghe tiếng rừng';
          title.classList.add('is-visible');
          const start = event => {
            if (box.contains(event.target)) return;
            kinds.forEach(t => document.removeEventListener(t, start, true));
            if (wanted && !box.classList.contains('is-playing')) play();
          };
          kinds.forEach(t => document.addEventListener(t, start, true));
        });
        document.addEventListener('visibilitychange', () => {
          if (!ctx) return;
          if (document.hidden) ctx.suspend();
          else if (box.classList.contains('is-playing')) ctx.resume();
        });
      })();

      let pointerFrame = 0;
      const finePointer = matchMedia('(hover:hover) and (pointer:fine)');
      function clearGlow() {
        scene.classList.remove('is-illuminated');
        glowTargets.forEach(target => {
          target.classList.remove('is-hovered');
          target.querySelectorAll('.glow-word').forEach(word => { word.style.removeProperty('color'); word.style.removeProperty('text-shadow'); });
        });
      }
      scene.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch' || !finePointer.matches) return;
        cancelAnimationFrame(pointerFrame);
        pointerFrame = requestAnimationFrame(() => {
          const x = event.clientX;
          const y = event.clientY;
          const hovered = glowTargets.filter(target => {
            const rect = target.getBoundingClientRect();
            return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
          });
          glowTargets.forEach(target => target.classList.toggle('is-hovered', hovered.includes(target)));
          if (!hovered.length) { clearGlow(); return; }
          const bounds = scene.getBoundingClientRect();
          scene.style.setProperty('--cursor-x', `${x - bounds.left}px`);
          scene.style.setProperty('--cursor-y', `${y - bounds.top}px`);
          const radius = parseFloat(getComputedStyle(scene).getPropertyValue('--aura-size')) || 200;
          glowTargets.forEach(target => {
            target.querySelectorAll('.glow-word').forEach(word => {
              const box = word.getBoundingClientRect();
              const nearX = Math.max(box.left, Math.min(x, box.right));
              const nearY = Math.max(box.top, Math.min(y, box.bottom));
              const distance = Math.hypot(x - nearX, y - nearY);
              const falloff = Math.max(0, 1 - distance / radius);
              const strength = falloff * falloff;
              if (strength < .025) { word.style.removeProperty('color'); word.style.removeProperty('text-shadow'); return; }
              const mix = Math.round(245 + (255 - 245) * strength);
              const green = Math.round(232 + (248 - 232) * strength);
              const blue = Math.round(197 + (221 - 197) * strength);
              word.style.color = `rgb(${mix} ${green} ${blue})`;
              word.style.textShadow = `0 0 ${2 + 5 * strength}px rgba(255,244,215,${strength.toFixed(3)}), 0 0 ${5 + 14 * strength}px rgba(246,211,138,${(.68 * strength).toFixed(3)})`;
            });
          });
          scene.classList.add('is-illuminated');
        });
      }, { passive:true });
      scene.addEventListener('pointerleave', clearGlow);

      // ---- Chat: focusing the box clears the headline and opens the dialogue above it ----
      let typeTimer = 0, replyTimer = 0, chatStarted = false, userAsked = false, finishTyping = null;
      function addMessage(role) {
        const row = document.createElement('p');
        row.className = `msg msg-${role}`;
        dialogue.append(row);
        while (dialogue.children.length > 6) dialogue.firstElementChild.remove();
        dialogue.scrollTop = dialogue.scrollHeight;
        return row;
      }
      function botSay(text, link) {
        window.clearInterval(typeTimer);
        if (finishTyping) finishTyping();
        const row = addMessage('bot');
        row.insertAdjacentHTML('afterbegin', '<svg class="flourish" viewBox="0 0 34 18" aria-hidden="true"><path d="M2 15c8-1 13-5 16-12M18 3c2 5 7 8 14 9M18 3c-3 1-5 3-5 6 3 0 5-2 5-6Zm0 0c3 0 6 2 7 5-3 1-6-1-7-5Z" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>');
        const node = document.createTextNode('');
        row.append(node);
        const done = () => {
          finishTyping = null;
          node.data = text;
          if (link) row.append(' ', link);
          dialogue.setAttribute('aria-busy', 'false');
          beetleHead.classList.remove('is-talking');
          if (window.boIdleCtl) window.boIdleCtl.react('laugh', 1400);   // happy face when a reply is finished
          dialogue.scrollTop = dialogue.scrollHeight;
        };
        if (reduceMotion.matches) { done(); return; }
        finishTyping = done;
        dialogue.setAttribute('aria-busy', 'true');
        beetleHead.classList.add('is-talking');
        let i = 0;
        typeTimer = window.setInterval(() => {
          node.data = text.slice(0, ++i);
          dialogue.scrollTop = dialogue.scrollHeight;
          if (i >= text.length) { window.clearInterval(typeTimer); done(); }
        }, 24);
      }
      function openChat() {
        scene.classList.add('is-chatting');
        if (chatStarted) return;
        chatStarted = true;
        window.setTimeout(() => botSay(BO_TEXT.openLine), reduceMotion.matches ? 0 : 380);
      }
      // First message (replaces the old headline): greeting, then the map card. The input stays usable throughout.
      let greeted = false;
      function makeMapCard() {
        const card = document.createElement('a');
        card.href = 'sitemap.html'; card.className = 'map-card';
        const cardImg = document.createElement('img'); cardImg.src = 'assets/sitemap/map-card.webp'; cardImg.width = 320; cardImg.height = 196; cardImg.alt = '';
        const cardLabel = document.createElement('span'); cardLabel.textContent = BO_TEXT.mapCardLabel;
        card.append(cardImg, cardLabel);
        return card;
      }
      function greet() {
        if (greeted || chatStarted || userAsked) return;
        greeted = chatStarted = true;
        scene.classList.add('is-chatting');
        window.setTimeout(() => botSay(BO_TEXT.greeting, makeMapCard()), reduceMotion.matches ? 0 : 500);
      }
      const greetWait = setInterval(() => { if (!document.querySelector('.loader') && boSettled) { clearInterval(greetWait); BO_READY.then(greet); } }, 300);
      // Leaving the box without asking anything brings the headline back.
      function closeIdleChat() {
        if (greeted || userAsked || form.contains(document.activeElement) || field.value.trim()) return;
        window.clearInterval(typeTimer);
        window.clearTimeout(replyTimer);
        scene.classList.remove('is-chatting');
        beetleHead.classList.remove('is-talking');
        chatStarted = false;
        window.setTimeout(() => { if (!scene.classList.contains('is-chatting')) dialogue.replaceChildren(); }, 500);
      }
      form.addEventListener('focusin', openChat);
      form.addEventListener('focusout', () => window.setTimeout(closeIdleChat, 150));
      field.addEventListener('keydown', event => { if (event.key === 'Escape') field.blur(); });

      // Keyword answers (assets/bo-replies.js). Accents are ignored, longer matching phrases win.
      // Matcher dùng chung: assets/bo-matcher.js (chỉ mục ngược, cùng luật điểm với bản cũ).
      let replyIndex = BoMatcher.build(typeof BO_REPLIES !== 'undefined' ? BO_REPLIES : []);
      document.addEventListener('bo:content', () => {
        replyIndex = BoMatcher.build(typeof BO_REPLIES !== 'undefined' ? BO_REPLIES : []);
        if (BO_TEXT.placeholder) field.placeholder = BO_TEXT.placeholder;
        if (BO_TEXT.pageTitle) document.title = BO_TEXT.pageTitle;
      });
      function findReply(question) {
        const r = replyIndex.reply(question, (typeof BO_FALLBACK !== 'undefined' && BO_FALLBACK) || '');
        return { reply: r.reply, target: r.target, label: r.label, card: r.card };
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const question = field.value.trim();
        openChat();
        if (!question) { botSay(BO_TEXT.emptyPrompt); field.focus(); return; }
        userAsked = true;
        addMessage('user').textContent = question;
        field.value = '';
        window.clearTimeout(replyTimer);
        answer(question);
      });
      async function answer(question) {
        let selected = null;
        if (typeof BoAI !== 'undefined') {
          BoAI.configure(typeof BO_AI !== 'undefined' ? BO_AI : null, MemoriContent.url);
          const id = await BoAI.route(question, k => BO_REPLIES.some(e => e.id === k));
          const hit = id && BO_REPLIES.find(e => e.id === id);
          if (hit) selected = { reply: hit.reply, target: hit.link && hit.link.href, label: hit.link && hit.link.label, card: !!hit.card };
        }
        const { reply, target, label, card } = selected || findReply(question);
        let link = null;
        if (card) link = makeMapCard();
        else if (target) { link = document.createElement('a'); link.href = target; link.textContent = label; if (BoMatcher.isPagePill(target)) { link.classList.add('go-community'); link.textContent = '✦ ' + label; } }
        replyTimer = window.setTimeout(() => botSay(reply, link), reduceMotion.matches ? 0 : 650);
      }
    })();
  </script>
